<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>수능 섬</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D10000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수능섬">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════
   수능 섬 — 시험지 테마
   공부 아일랜드 자매앱
   ① 두꺼운 네이비 외곽선 + 하드 섀도우
   ② 눌리는 입체 버튼 (active → translateY)
   ③ 누런 시험지 / 수능 빨강 / OMR 마킹
═══════════════════════════ */
:root{
  --bg:linear-gradient(180deg,#EAE7DC 0%,#F1EEE4 26%,#F7F4EC 55%,#FBF9F3 80%,#FDFCF8 100%);
  --card:#FFFFFF; --card2:#FAF7EF;
  --ink:#1A1A2E; --soft:#8C8678; --line:#E6E1D4;
  --sh:0 4px 0 rgba(26,26,46,.16); --sh2:0 2px 0 rgba(26,26,46,.13);
  --red:#D10000; --navy:#1A1A2E; --blue:#2563EB; --green:#15803D;
  --amber:#B45309; --purple:#7C3AED; --pink:#DB2777; --gold:#CA8A04;
  --paper:#FFFEFA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,-apple-system,sans-serif;
  color:var(--ink);letter-spacing:-.2px;min-height:100%;overflow-x:hidden;
  background:var(--bg);background-attachment:fixed;
}
.serif{font-family:'Nanum Myeongjo','AppleMyungjo','Batang',serif;}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px;}

/* ── Island header ── */
.island{position:relative;height:160px;display:flex;align-items:flex-end;justify-content:center;}
.hdr-stats{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:8px;}
.pill{
  background:var(--paper);border:3px solid var(--ink);
  border-radius:999px;padding:5px 13px;font-weight:800;font-size:12px;
  box-shadow:var(--sh2);display:flex;align-items:center;gap:5px;
}
.pill svg{width:13px;height:13px;}
.pill.red{background:var(--red);color:#fff;border-color:var(--red);}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bobber{animation:bob 3.6s ease-in-out infinite;cursor:pointer;}
@media(prefers-reduced-motion:reduce){.bobber{animation:none}}

/* ── OMR Tabs ── */
.tabs{display:flex;gap:4px;justify-content:center;margin:2px 0 14px;}
.tab{
  flex:1;background:var(--card);border:2.5px solid var(--ink);border-radius:13px;
  padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;box-shadow:var(--sh2);color:var(--soft);
  transition:transform .08s,box-shadow .08s;
}
.bub{
  width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:var(--ink);transition:all .1s;
}
.tlab{font-weight:800;font-size:9.5px;}
.tab.on{background:var(--card2);transform:translateY(-2px);box-shadow:0 6px 0 rgba(26,26,46,.15);color:var(--ink);}
.tab.on .bub{background:var(--red);border-color:var(--red);color:#fff;}
.tab:active{transform:translateY(2px)!important;box-shadow:none!important;}

/* ── Cards ── */
.card{
  background:var(--card);border:2.5px solid var(--ink);
  border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:var(--sh);
}
.sec{display:flex;align-items:center;gap:7px;font-weight:900;font-size:14px;margin:2px 2px 12px;}
.sec svg{width:18px;height:18px;}
.muted{color:var(--soft);font-size:12px;font-weight:600;}
.spacer{height:8px;}

/* ── D-day big ── */
.dday-card{
  background:var(--navy);color:#fff;border:2.5px solid var(--ink);
  border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:var(--sh);
  text-align:center;position:relative;overflow:hidden;
}
.dday-card .dlabel{font-size:13px;font-weight:700;opacity:.85;letter-spacing:1px;}
.dday-card .dbig{font-size:46px;font-weight:800;line-height:1.05;margin:2px 0;}
.dday-card .dsub{font-size:12px;opacity:.8;font-weight:600;}
.dday-card .stamp{
  position:absolute;top:12px;right:-10px;transform:rotate(9deg);
  border:3px solid var(--red);color:var(--red);border-radius:8px;
  font-weight:900;font-size:11px;padding:3px 22px 3px 12px;opacity:.9;letter-spacing:1px;
}

/* ── Date nav ── */
.daybar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px;}
.dlbl{font-weight:900;font-size:17px;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;}
.dlbl input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.navb{
  width:38px;height:38px;border:2.5px solid var(--ink);border-radius:12px;
  background:var(--navy);color:#fff;font-weight:900;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:15px;user-select:none;
  box-shadow:var(--sh2);transition:transform .08s,box-shadow .08s;
}
.navb.today{background:var(--red);width:auto;padding:0 13px;}
.navb:active{transform:translateY(3px)!important;box-shadow:none!important;}

/* ── Rows / steppers ── */
.row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  border:2px solid var(--line);border-radius:14px;margin-bottom:9px;background:var(--card2);
}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);flex-shrink:0;}
.rname{font-weight:800;font-size:14px;flex:1;min-width:0;}
.rname .tgt{font-size:11px;color:var(--soft);font-weight:700;margin-left:4px;}
.step{display:flex;align-items:center;gap:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;}
.step b{width:26px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;cursor:pointer;user-select:none;color:var(--ink);}
.step b:active{background:var(--card2);}
.step input{width:42px;height:30px;border:none;border-left:2px solid var(--ink);border-right:2px solid var(--ink);text-align:center;font-size:14px;font-weight:800;font-family:inherit;color:var(--ink);background:#fff;}
.step input:focus{outline:none;background:#FFFBEF;}
.slabel{font-size:10px;font-weight:800;color:var(--soft);width:30px;text-align:right;}

/* ── progress bar ── */
.pbar{height:11px;border-radius:99px;background:var(--line);overflow:hidden;border:1.5px solid var(--ink);}
.pbar>span{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s;}
.pbar.navy>span{background:var(--navy);}

/* ── stat tiles ── */
.tiles{display:flex;gap:9px;margin-bottom:4px;}
.tile{flex:1;border:2px solid var(--ink);border-radius:14px;padding:11px 8px;text-align:center;background:var(--card2);}
.tile .tn{font-size:24px;font-weight:900;line-height:1;}
.tile .tt{font-size:11px;font-weight:700;color:var(--soft);margin-top:3px;}

/* ── buttons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:14px;
  padding:13px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:var(--sh);
  transition:transform .08s,box-shadow .08s;
}
.btn svg{width:17px;height:17px;}
.btn.navy{background:var(--navy);}
.btn.ghost{background:var(--card);color:var(--ink);}
.btn:active{transform:translateY(3px);box-shadow:none;}
.iconbtn,.xbtn{
  width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:var(--sh2);
}
.iconbtn svg,.xbtn svg{width:16px;height:16px;}
.xbtn{background:#FFF0F0;}.xbtn svg{stroke:var(--red);}
.iconbtn:active,.xbtn:active{transform:translateY(2px);box-shadow:none;}

/* ── chips / grade ── */
.gchip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border:2px solid var(--ink);border-radius:8px;font-weight:900;font-size:13px;background:#fff;}
.gchip.g1,.gchip.g2{background:#15803D;color:#fff;border-color:#15803D;}
.gchip.g3,.gchip.g4{background:#2563EB;color:#fff;border-color:#2563EB;}
.gchip.g5,.gchip.g6{background:#B45309;color:#fff;border-color:#B45309;}
.gchip.g7,.gchip.g8,.gchip.g9{background:#D10000;color:#fff;border-color:#D10000;}

/* ── mock card ── */
.mock{border:2px solid var(--ink);border-radius:16px;padding:13px;margin-bottom:11px;background:var(--card2);}
.mock .mh{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.mock .mn{font-weight:900;font-size:15px;flex:1;}
.mock .md{font-size:11px;font-weight:700;color:var(--soft);}
.mgrid{display:flex;flex-wrap:wrap;gap:6px;}
.mg{display:flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff;font-size:12px;font-weight:800;}
.mg .mgn{font-size:10px;color:var(--soft);}

/* ── metric toggle ── */
.mtoggle{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.mtoggle .mt{border:2px solid var(--ink);border-radius:10px;padding:6px 11px;font-weight:800;font-size:12px;background:#fff;cursor:pointer;box-shadow:var(--sh2);}
.mtoggle .mt.on{background:var(--navy);color:#fff;}
.mtoggle .mt:active{transform:translateY(2px);box-shadow:none;}

/* ── chart ── */
.chart{width:100%;height:auto;display:block;}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;justify-content:center;}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--soft);}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* ── empty ── */
.empty{text-align:center;padding:26px 10px;color:var(--soft);font-weight:700;font-size:13px;line-height:1.6;}

/* ── sheet / modal ── */
.scrim{position:fixed;inset:0;background:rgba(26,26,46,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--card);border:2.5px solid var(--ink);border-bottom:none;
  border-radius:24px 24px 0 0;padding:20px 18px 30px;width:100%;max-width:560px;
  transform:translateY(20px);transition:transform .22s;max-height:88vh;overflow-y:auto;
}
.scrim.open .sheet{transform:translateY(0);}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px;}
.mtitle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;margin-bottom:14px;}
.mtitle svg{width:20px;height:20px;}
label{display:block;font-weight:800;font-size:12px;margin:12px 2px 5px;color:var(--ink);}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;border:2.5px solid var(--ink);border-radius:12px;padding:11px 12px;
  font-size:14px;font-weight:700;font-family:inherit;color:var(--ink);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:none;background:#FFFBEF;}
.rowf{display:flex;gap:10px;}.rowf>div{flex:1;}
.rowf4{display:flex;gap:7px;}.rowf4>div{flex:1;}
.rowf4 label{font-size:11px;}
.rowf4 input{padding:9px 6px;text-align:center;}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;}
.cdot.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink);}


/* ── 다마고치 본체 ── */
.tama-wrap{position:relative;width:228px;margin:10px auto 0;}
/* 상단 고리 */
.tama-ant{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;}
.tama-ant i{display:block;width:4px;height:13px;margin:0 auto;background:var(--ink);border-radius:2px;}
.tama-ant b{
  display:block;width:14px;height:14px;margin:-2px auto 0;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFF3B0,#FFD23F 60%,#E8A800);
  border:2.5px solid var(--ink);animation:antglow 2.4s ease-in-out infinite;
}
@keyframes antglow{0%,100%{box-shadow:0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 9px 2px rgba(255,210,63,.85)}}

/* 본체: 높이 고정 없음 — 내용물이 높이를 결정 (넘침 방지) */
.tama{
  position:relative;box-sizing:border-box;width:228px;
  padding:26px 18px 16px;
  display:flex;flex-direction:column;align-items:center;
  background:
    radial-gradient(circle at 24% 15%,rgba(255,255,255,.6) 0 7%,transparent 32%),
    linear-gradient(155deg,var(--sh1) 0%,var(--sh2) 40%,var(--sh3) 72%,var(--sh4) 100%);
  border:3.5px solid var(--ink);
  border-radius:48% 48% 44% 44% / 34% 34% 60% 60%;
  box-shadow:0 7px 0 rgba(26,26,46,.22), inset 0 5px 15px rgba(255,255,255,.45), inset 0 -9px 16px rgba(0,0,0,.12);
  transition:background .35s;
}
.tama-brand{
  font-size:7.5px;font-weight:800;letter-spacing:3px;color:#fff;
  margin-bottom:6px;text-shadow:0 1.5px 0 rgba(0,0,0,.28);
}
/* 화면 */
.tama-screen{
  position:relative;box-sizing:border-box;
  width:152px;height:140px;
  background:#7E9169;border:3.5px solid var(--ink);
  border-radius:15px;padding:5px;
  box-shadow:inset 0 3px 9px rgba(0,0,0,.42);
  display:flex;
}
.tama-lcd{
  position:relative;overflow:hidden;flex:1;box-sizing:border-box;
  background:#C7D6A4;border-radius:9px;padding:4px 6px;
  display:flex;flex-direction:column;align-items:center;
  background-image:repeating-linear-gradient(0deg,rgba(80,100,60,.08) 0px,rgba(80,100,60,.08) 1px,transparent 1px,transparent 3px);
}
.tama-lcd.flash:after{content:'';position:absolute;inset:0;background:#EAF2D4;animation:lcdflash .22s ease-out;pointer-events:none;}
@keyframes lcdflash{0%{opacity:.85}100%{opacity:0}}
.lcd-top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:8px;font-weight:900;color:#3A472F;flex-shrink:0;}
.lcd-pet{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;min-height:0;}
.lcd-bot{font-size:8.5px;font-weight:900;color:#3A472F;text-align:center;flex-shrink:0;}
@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:.15}}
.blink{animation:blk .9s steps(1) infinite;}

/* 상호작용 애니메이션 */
.lcd-pet.happy{animation:pethop .55s ease;}
@keyframes pethop{0%,100%{transform:translateY(0)}28%{transform:translateY(-9px) scale(1.06)}55%{transform:translateY(0) scale(.96)}75%{transform:translateY(-4px)}}
.lcd-pet.wiggle{animation:petwig .5s ease;}
@keyframes petwig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
.lcd-pet.eat{animation:peteat .6s ease;}
@keyframes peteat{0%,100%{transform:scale(1)}25%{transform:scale(1.1,.92)}50%{transform:scale(.94,1.08)}75%{transform:scale(1.05,.96)}}
.lcd-pet.sad{animation:petsad .7s ease;}
@keyframes petsad{0%,100%{transform:translateY(0)}50%{transform:translateY(5px) scale(.96)}}
.fly-meat{position:absolute;left:50%;bottom:2px;font-size:18px;pointer-events:none;animation:flymeat .6s ease-out forwards;}
@keyframes flymeat{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}35%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.7)}}
.fly-heart{position:absolute;pointer-events:none;font-size:12px;animation:flyheart .9s ease-out forwards;}
@keyframes flyheart{0%{opacity:0;transform:translateY(4px) scale(.5)}30%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-24px) scale(.8)}}

/* 버튼: 본체 안쪽에 확실히 포함 */
.tama-btns{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:12px;}
.tama-btn{
  position:relative;box-sizing:border-box;width:32px;height:32px;border-radius:50%;
  border:3px solid var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;font-family:'Nanum Myeongjo',serif;color:var(--ink);
  background:linear-gradient(180deg,#FFFFFF 0%,#F2F4F9 40%,#CDD3E0 100%);
  box-shadow:0 4px 0 rgba(26,26,46,.42),0 5px 6px rgba(0,0,0,.16),
    inset 0 2px 3px rgba(255,255,255,1),inset 0 -2px 3px rgba(0,0,0,.12);
  transition:transform .07s cubic-bezier(.3,.8,.4,1),box-shadow .07s;
}
.tama-btn:before{content:'';position:absolute;top:3px;left:6px;width:11px;height:7px;background:rgba(255,255,255,.95);border-radius:50%;transform:rotate(-16deg);pointer-events:none;}
.tama-btn.hot{background:linear-gradient(180deg,#FFFBEA 0%,#FFE79A 40%,#F5C518 100%);animation:btnpulse 1.4s ease-in-out infinite;}
@keyframes btnpulse{
  0%,100%{box-shadow:0 4px 0 rgba(26,26,46,.42),0 5px 6px rgba(0,0,0,.16),inset 0 2px 3px rgba(255,255,255,1),inset 0 -2px 3px rgba(0,0,0,.12)}
  50%{box-shadow:0 4px 0 rgba(26,26,46,.42),0 5px 6px rgba(0,0,0,.16),inset 0 2px 3px rgba(255,255,255,1),inset 0 -2px 3px rgba(0,0,0,.12),0 0 12px 4px rgba(245,197,24,.8)}
}
.tama-btn:active{transform:translateY(4px) scale(.94);box-shadow:0 0 0 rgba(26,26,46,0),inset 0 3px 5px rgba(0,0,0,.35);}
.tama-btn.press{animation:btnpress .34s cubic-bezier(.25,1.4,.5,1);}
@keyframes btnpress{0%{transform:translateY(4px) scale(.94)}45%{transform:translateY(-3px) scale(1.06)}70%{transform:translateY(1px) scale(.99)}100%{transform:translateY(0) scale(1)}}
.tama-btn .ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0;pointer-events:none;}
.tama-btn.press .ring{animation:ringout .45s ease-out;}
@keyframes ringout{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.6)}}
.tama-lbls{display:flex;justify-content:center;gap:15px;margin-top:4px;}
.tama-lbls span{font-size:7.5px;font-weight:900;color:#fff;width:32px;text-align:center;text-shadow:0 1.5px 0 rgba(0,0,0,.3);}

/* 먹이 + 색상 바 */
.feedbar{display:flex;align-items:center;gap:9px;margin-top:14px;border:2px solid var(--ink);border-radius:13px;padding:9px 11px;background:var(--card2);}
.feedbar .fb-txt{font-size:12.5px;font-weight:800;white-space:nowrap;}
.feedbar .fb-sub{font-size:10.5px;font-weight:700;color:var(--soft);}
.shells{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;max-width:150px;}
.shell{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(26,26,46,.2);transition:transform .1s;}
.shell.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);transform:translateY(-1px);}
.shell:active{transform:translateY(2px);box-shadow:none;}

/* 밥 카운터 */
.meat{display:flex;align-items:center;justify-content:center;gap:5px;}
.meat b{font-size:23px;line-height:1;filter:drop-shadow(0 2px 0 rgba(26,26,46,.18));}
.meat i{font-style:normal;font-size:15px;font-weight:900;color:var(--soft);}
.meat u{text-decoration:none;font-size:22px;font-weight:900;color:var(--ink);font-family:'Nanum Myeongjo',serif;}

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:14px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

{id:'w1b',week:1,tag:'사회 · 법',color:'#B45309',title:'착오 송금과 부당이득',
 passage:[
`송금인이 계좌번호를 잘못 눌러 의도하지 않은 사람에게 돈이 옮겨 가는 일을 착오 송금이라 한다. 잘못 간 돈이니 은행이 곧바로 되돌리면 그만이라고 여기기 쉽지만, 법은 그렇게 처리하지 않는다. 이체가 완료되면 수취인은 은행에 대하여 그 금액만큼 지급을 청구할 수 있는 예금 채권을 얻는데, 판례는 송금인과 수취인 사이에 이체의 원인이 되는 법률관계가 없더라도 이 예금 채권은 유효하게 성립한다고 본다. 이체의 원인과 이체의 효력을 서로 떼어 놓는 것이다.`,
`이렇게 보는 데에는 까닭이 있다. 은행은 하루에도 수많은 이체를 기계적으로 처리할 뿐, 그 이체에 정당한 원인이 있는지를 일일이 ⓐ살필 수 없다. 만약 원인 관계의 유무에 따라 예금 채권의 성립 여부가 달라진다면, 계좌에 찍힌 잔액을 아무도 믿을 수 없게 되어 결제 제도 전체가 흔들린다. 그리하여 은행은 송금인의 요청만으로 수취인의 동의 없이 이체를 되돌릴 수 없다. 송금인이 상대해야 할 사람은 은행이 아니라 수취인인 것이다.`,
`그렇다면 송금인은 무엇을 근거로 돈을 되찾는가. 민법은 법률상 원인 없이 남의 재산으로 이익을 얻고 그로 인해 그에게 손해를 입힌 자는 그 이익을 반환하여야 한다고 정한다. 수취인은 아무런 원인 없이 예금 채권이라는 이익을 얻었고 송금인은 그만큼 손해를 입었으므로, 송금인은 수취인에게 부당이득의 반환을 청구할 수 있다. 여기서 유의할 점은, 예금 채권이 성립하지 않아서 반환 의무가 생기는 것이 아니라, 채권은 성립하되 그것을 보유할 법률상 원인이 없기 때문에 반환 의무가 생긴다는 것이다. 성립과 보유는 별개의 층위이다.`,
`그러나 이 권리는 종이 위의 권리에 그치기 쉽다. 수취인이 반환을 거절하고 돈을 써 버리면 송금인은 소송이라는 부담을 ⓑ떠안는다. 금액이 적을수록 변호사 비용과 시간이 회수액을 넘어서, 권리는 있으나 행사할 수 없는 상태가 된다. 이러한 사정을 고려하여, 일정 요건을 갖춘 착오 송금에 대해서는 공적 기관이 송금인으로부터 반환 청구권을 넘겨받아 대신 회수해 주는 지원 제도가 ⓒ마련되었다. 이때 공적 기관은 은행의 의무를 대신 이행하는 것이 아니라, 송금인이 수취인에 대해 가지는 권리를 양도받아 행사하는 것이다.`,
`권리들이 서로 부딪치는 국면도 있다. 수취인에게 돈을 받을 다른 채권자가 있어 그 계좌를 압류해 두었다면, 착오로 들어온 돈도 압류의 대상이 된다. 압류채권자로서는 그 돈이 어떤 사연으로 들어왔는지 알 길이 없고, 계좌에 찍힌 잔액을 믿고 절차를 밟았을 뿐이기 때문이다. 이때 송금인이 가진 것은 수취인에 대한 반환 청구권일 뿐, 그 돈 자체에 대한 권리가 아니다. 그리하여 송금인은 압류채권자보다 앞서 그 돈을 가져가겠다고 주장하기 어렵다. 이체의 원인과 효력을 떼어 놓은 대가가 송금인에게 돌아오는 지점이다.`,
`수취인이 그 은행에 빚을 지고 있으면 문제는 한층 얽힌다. 은행은 자신이 받을 대출금 채권과 수취인의 예금 채권을 맞대어 지우는 상계를 할 수 있는데, 착오로 들어온 돈까지 상계에 끌어다 쓰면 사실상 은행이 남의 돈으로 자기 채권을 회수하는 셈이 된다. 판례는 은행이 그 돈이 착오 송금된 것임을 알면서도 이를 이용하여 채권을 회수하려는 경우에는 그 상계가 신의칙에 어긋나 허용되지 않는다고 보아, 송금인의 지위를 일정 부분 ⓓ지켜 준다. 다만 이는 개별 사정을 저울질하여 판단하는 것이어서 언제나 보호가 ⓔ담보되지는 않는다.`

{id:'w1c',week:1,tag:'기술',color:'#2563EB',title:'가상 메모리와 유효 접근 시간',
 passage:[
`프로그램이 실행되려면 그 코드와 데이터가 주기억 장치에 올라와 있어야 한다. 그러나 주기억 장치의 용량은 한정되어 있고, 동시에 실행되는 프로그램들의 크기를 합하면 그 용량을 훌쩍 넘는다. 이 간극을 메우는 기법이 가상 메모리이다. 가상 메모리는 프로그램마다 실제 용량과 무관한 커다란 주소 공간을 가진 것처럼 보이게 하고, 그중 당장 필요한 부분만 주기억 장치에 올려 둔다.`,
`이를 위해 주소는 두 층으로 나뉜다. 프로그램이 쓰는 주소는 논리 주소이고, 주기억 장치의 실제 자리를 가리키는 것은 물리 주소이다. 논리 주소 공간은 페이지라는 일정한 크기의 조각으로, 물리 주소 공간은 같은 크기의 프레임으로 나뉘며, 어느 페이지가 어느 프레임에 올라와 있는지는 페이지 테이블에 ⓐ적힌다. 프로그램이 어떤 논리 주소에 접근하면 주소 변환 장치가 테이블을 뒤져 대응하는 물리 주소를 찾는다. 덕분에 한 프로그램의 페이지들이 물리 주소 공간에 연속으로 놓일 필요는 없다.`,
`문제는 이 변환 자체가 비용이라는 점이다. 페이지 테이블은 주기억 장치에 있으므로, 논리 주소 하나를 다루려면 테이블을 읽기 위해 한 번, 실제 데이터를 읽기 위해 다시 한 번, 모두 두 차례 주기억 장치에 접근해야 한다. 이 낭비를 덜기 위해 최근 변환한 결과를 담아 두는 작고 빠른 저장소를 두는데, 이것이 ㉠변환 색인 버퍼이다. 찾는 항목이 여기 있으면 테이블을 건너뛰고 곧바로 물리 주소를 얻는다. 항목을 찾을 확률을 적중률이라 하며, 프로그램이 좁은 영역을 되풀이해 ⓑ건드릴수록 적중률은 높아진다.`,
`한편 접근하려는 페이지가 주기억 장치에 아예 없으면 페이지 부재가 일어난다. 그러면 운영 체제는 보조 기억 장치에서 그 페이지를 읽어 올려야 하는데, 보조 기억 장치의 접근 시간은 주기억 장치의 그것보다 수만 배 크다. 빈 프레임이 없으면 올라와 있는 페이지 하나를 골라 내보내야 하며, 이때 어떤 페이지를 ⓒ내칠지 정하는 것이 페이지 교체 알고리즘이다. 가장 오랫동안 쓰이지 않은 페이지를 내보내는 방식이 널리 쓰이는데, 이는 최근 쓰인 페이지가 곧 다시 쓰이리라는 지역성을 전제로 한다.`,
`이제 한 번의 메모리 접근에 걸리는 평균 시간, 곧 유효 접근 시간을 따져 보자. 변환 색인 버퍼에서 항목을 찾으면 주기억 장치를 한 번만 읽으면 되고, 찾지 못하면 테이블을 읽느라 한 번을 더 써야 한다. 여기에 페이지 부재가 일어나면 보조 기억 장치를 오가는 시간이 통째로 얹힌다. 결국 유효 접근 시간은 적중률이 높을수록 짧아지고, 페이지 부재율이 높을수록 길어진다. 그런데 보조 기억 장치의 접근 시간이 워낙 크기 때문에, 페이지 부재율이 아주 조금만 올라도 유효 접근 시간은 크게 ⓓ불어난다. 적중률을 몇 퍼센트 끌어올려 얻는 이득이, 페이지 부재율이 조금 오르며 잃는 손실에 쉽게 상쇄되는 것이다.`,
`지역성에는 두 갈래가 있다. 한 번 쓴 자리를 머지않아 다시 쓰는 성질이 시간적 지역성이고, 어떤 자리를 쓰면 그 근처도 곧 쓰게 되는 성질이 공간적 지역성이다. 페이지는 일정한 크기의 덩어리이므로, 공간적 지역성이 큰 프로그램은 페이지 하나를 올리는 것만으로 뒤이어 필요한 자료까지 함께 얻는다. 반대로 넓은 영역을 띄엄띄엄 건드리는 프로그램은 페이지를 올릴 때마다 그 안의 극히 일부만 쓰고 버리게 되어, 같은 양을 계산하고도 훨씬 많은 페이지 부재를 겪는다.`,
`쫓아낸 페이지를 곧바로 다시 불러들이는 일이 되풀이되면 사정은 더 나빠진다. 프로세서는 계산은 못 하고 페이지를 실어 나르는 일에만 매달리게 되는데, 이를 스래싱이라 한다. 스래싱에 빠진 시스템은 프로그램을 더 띄울수록 오히려 처리량이 떨어진다. 이를 막으려면 각 프로그램이 당장 집중적으로 쓰는 페이지들의 집합을 ⓔ어림하여, 그만큼의 프레임은 확보해 준 뒤에야 새 프로그램을 띄워야 한다.`
 ],
 points:[
  '페이지 테이블로 논리 주소 ↔ 물리 주소 변환 → 물리 공간에 연속 배치 불필요',
  'TLB 적중률↑ → 유효 접근 시간↓ / 페이지 부재율↑ → 유효 접근 시간↑',

{id:'w2a',week:2,tag:'인문 · 기호학',color:'#7C3AED',title:'바르트의 신화론 — 이차적 기호 체계',
 passage:[
`소쉬르는 언어 기호를 소리나 문자 같은 감각적 형식인 기표와 그것이 가리키는 개념인 기의의 결합으로 보았다. 둘은 종이의 앞뒤처럼 떼어 놓을 수 없이 맞붙어 하나의 기호를 이루며, 그 결합은 필연이 아니라 한 언어 공동체가 받아들인 약속일 따름이다. 바르트는 이 틀을 언어 바깥의 문화 현상으로 넓히면서, 신화라 불리는 특수한 의미 작용을 ⓐ밝혔다.`,
`소쉬르에게 기호의 의미는 그것이 무엇을 닮았는지가 아니라 다른 기호들과 어떻게 구별되는지에서 나온다. 산이라는 말이 뜻을 갖는 것은 그것이 강이나 들이 아니기 때문이다. 의미는 사물과 말 사이의 직선이 아니라 말들 사이의 그물에서 생겨나며, 그러므로 기표와 기의의 결합은 어느 하나가 다른 하나를 자연히 불러내는 관계가 아니다. 바르트는 이 자의성이야말로 문화 분석의 지렛대라고 보았다. 자연스러워 보이는 결합일수록 그 뒤에 사람의 손길이 숨어 있을 수 있기 때문이다.`,
`바르트에 따르면 신화는 이미 완성된 기호를 재료로 삼는 이차적 기호 체계이다. 일차 체계에서 기표와 기의가 결합해 만들어 낸 기호가, 이차 체계에서는 그 자체로 기표의 자리에 들어선다. 바르트는 이 새 기표를 형식이라, 그와 결합하는 새 기의를 개념이라 불렀다. 이때 형식이 된 일차적 기호는 원래의 풍부한 의미를 상당 부분 잃는다. 그러나 완전히 지워지지는 않는다. 그 의미는 뒤로 물러나 있다가, 신화가 억지스럽다는 의심을 받는 순간 다시 불려 나와 신화의 알리바이가 되어 준다. 비었으면서도 비어 있지 않은 이 상태가 신화의 힘이다.`,
`군복을 입고 국기를 향해 경례하는 한 소년의 잡지 표지 사진을 예로 들어 보자. 일차 체계에서 이 사진은 경례하는 한 소년이라는 기호를 이룬다. 그런데 이 기호가 이차 체계의 형식이 되면, 여기에는 이 나라의 제국은 인종의 차별 없이 모두를 품는다는 개념이 얹힌다. 소년의 이름과 사연, 그가 그 자리에 서기까지의 역사는 뒤로 밀려나고 그 자리를 정치적 개념이 차지한다. 그러면서도 그것은 논증되거나 주장되지 않고, 사진 한 장이 보여 주는 자연스러운 사실인 양 나타난다. 만약 누군가 그 함의를 ⓑ따지고 들면, 신화는 언제든 물러나 나는 그저 한 소년의 사진일 뿐이라고 말할 수 있다.`,
`바르트는 이 사진을 읽는 방식을 셋으로 나눈다. 첫째, 형식이 비어 있다고 여기고 개념을 곧이곧대로 채워 넣는 읽기이다. 이는 신화를 만들어 내는 자의 시선으로, 소년을 제국의 상징으로 삼는다. 둘째, 형식과 개념을 떼어 놓고 형식 속에 남은 의미를 되살려 개념의 억지스러움을 ⓒ드러내는 읽기이다. 이는 신화를 해체하는 자의 시선이다. 셋째, 형식과 개념을 떼어 놓지 않고 그 둘이 얽힌 채로 받아들이는 읽기이다. 신화의 소비자는 바로 이 세 번째 방식으로 읽으며, 그렇기에 그는 자신이 상징을 읽고 있다고 느끼지 않고 그저 사실을 보고 있다고 느낀다.`,
`바르트가 신화를 문제 삼은 것은 바로 이 자연스러움 때문이다. 신화는 역사적으로 만들어진 특정한 관점을, 마치 세상이 원래 그러한 것처럼 보이게 한다. 곧 역사를 자연으로 ⓓ탈바꿈시킨다. 신화는 무언가를 감추려 거짓말을 하는 것이 아니라, 그것을 굳이 설명할 필요조차 없는 당연한 것으로 만들어 버림으로써 작동한다. 그러므로 신화는 반박하기 어렵다. 반박은 주장을 상대로만 가능한데, 신화는 애초에 주장의 형태를 ⓔ띠지 않기 때문이다. 신화를 읽어 내는 일이 곧 그 당연함이 언제 어떻게 만들어졌는지를 되묻는 일인 까닭이 여기에 있다.`

{id:'w2b',week:2,tag:'사회 · 조세',color:'#15803D',title:'조세 법률주의와 증여세의 완전 포괄주의',
 passage:[
`국가가 국민의 재산을 세금으로 거두려면 반드시 법률의 근거가 있어야 한다. 이를 조세 법률주의라 하며, 여기에는 두 요구가 따른다. 하나는 누구에게 어떤 사실이 있을 때 얼마의 세금을 매길지, 곧 과세 요건을 법률로 정해야 한다는 것이고, 다른 하나는 그 법률이 명확하여 국민이 자신의 부담을 미리 헤아릴 수 있어야 한다는 것이다. 여기에서 세법의 유추 해석 금지 원칙이 ⓐ나온다. 법에 적히지 않은 사안을 비슷하다는 이유로 끌어와 과세할 수 없다는 뜻이다.`,
`그런데 이 원칙은 조세를 피하려는 시도 앞에서 곤경에 처한다. 법이 과세 대상을 하나하나 열거하면, 열거되지 않은 새로운 형태의 거래를 고안해 세금을 피할 길이 열린다. 과거의 증여세가 그러하였다. 법이 증여로 인정할 유형을 나열해 두자, 그 유형에 걸리지 않으면서도 결과적으로 재산을 무상으로 넘겨주는 거래들이 잇달아 나타났다. 입법자가 새 유형을 뒤늦게 법에 ⓑ보태 넣으면 또 다른 유형이 생겨나는 일이 되풀이되었다. 열거주의는 언제나 한발 늦을 수밖에 없었다.`,
`이에 대응하여 도입된 것이 ㉠완전 포괄주의이다. 이는 증여의 유형을 열거하는 대신, 명칭이나 형식이나 목적을 묻지 않고 타인에게 재산이나 이익을 무상으로 이전하는 것 일체를 증여로 보아 과세하는 방식이다. 거래의 겉모습이 매매든 대여든, 실질적으로 대가 없이 이익이 옮겨 갔다면 증여로 다루겠다는 것이다. 이는 형식보다 실질을 좇아 과세한다는 실질 과세의 원칙과 맞닿아 있다. 이로써 입법자가 미처 내다보지 못한 새 거래도 과세의 그물에 걸리게 되었다.`,
`그러나 완전 포괄주의는 조세 법률주의와 긴장을 이룬다. 과세 대상이 넓고 추상적으로 규정될수록 국민이 자신의 거래가 과세 대상인지 미리 알기는 어려워지기 때문이다. 명확성의 요구가 흔들리는 것이다. 더욱이 유추 해석 금지는 법에 없는 것을 끌어오지 말라는 요구인데, 포괄 규정은 애초에 무엇이 법에 있고 무엇이 없는지의 경계를 흐린다. 조세 회피를 막으려는 요구와 예측 가능성을 지키려는 요구가 정면으로 ⓒ부딪치는 셈이다.`,
`이 긴장은 조세 회피를 어떻게 볼 것인가라는 물음과 이어진다. 세금을 적게 내려고 거래의 형식을 고르는 일 자체는 위법이 아니다. 법이 여러 길을 열어 두었다면 그중 부담이 가벼운 길을 택하는 것은 납세자의 자유이며, 이를 조세 회피라 하여 곧바로 나무랄 수는 없다. 문제는 그 형식이 오로지 세금을 피하려는 목적으로만 짜여 있고 그 밖에 아무런 실질도 없을 때이다. 실질 과세의 원칙은 바로 이 지점을 겨냥하지만, 그 겨냥이 지나치면 납세자가 법을 믿고 선택한 길마저 사후에 부인당하게 된다.`,
`법원은 이 긴장을 다루기 위해 몇 가지 태도를 취해 왔다. 우선 포괄 규정이 있다는 사정만으로 곧바로 과세가 정당화되지는 않으며, 개별 규정이 특정한 유형에 대해 과세의 범위와 방법을 따로 정해 둔 경우에는 그 규정의 취지를 넘어서서 포괄 규정을 다시 끌어다 과세하는 것을 ⓓ삼가야 한다고 보았다. 개별 규정이 일정한 요건을 갖춘 거래만 과세하기로 정한 것이라면, 그 요건에 미치지 못하는 거래는 입법자가 과세하지 않기로 한 것으로 볼 여지가 있기 때문이다. 결국 어디까지가 회피이고 어디부터가 법이 허용한 선택인지를 ⓔ가르는 일이 이 제도의 핵심 쟁점으로 남는다.`

   box:`○ 사례 1: 갑은 자녀 을에게 시가 10억 원인 건물을 1억 원만 받고 넘겼다. 이 거래는 형식상 매매 계약이며, 세법이 열거한 증여 유형 어디에도 해당하지 않는다.

    '사례 2에서 과세 당국이 포괄 규정을 끌어다 과세한 것은, 포괄 규정이 있는 이상 법원도 정당하다고 볼 것이겠군.'

{id:'w2c',week:2,tag:'과학 · 생물',color:'#D10000',title:'수생 동물의 호흡과 역류 교환',
 passage:[
`공기와 물은 호흡의 무대로서 조건이 크게 다르다. 같은 부피에 든 산소의 양이 물에서는 공기의 수십 분의 일에 지나지 않으며, 물은 공기보다 훨씬 무겁고 끈적여 몸을 지나가게 하는 데 힘이 많이 든다. 게다가 물속에서 산소의 확산은 느려, 표면에서 산소를 빼앗기고 나면 그 자리가 곧바로 채워지지 않는다. 그리하여 물에서 숨 쉬는 동물은 적은 산소를 얻기 위해 많은 물을 흘려보내야 하는 부담을 ⓐ진다.`,
`호흡 기관을 지나 혈액으로 옮겨 가는 산소의 양은 세 가지에 달려 있다. 첫째는 물과 혈액이 맞닿는 표면적이고, 둘째는 그 둘 사이의 산소 농도 차이이며, 셋째는 산소가 통과해야 하는 막의 두께이다. 옮겨 가는 산소의 양은 표면적과 농도 차이의 곱에 비례하고 막의 두께에 반비례한다. 어류의 아가미는 이 세 요인을 모두 ⓑ건드린다. 아가미는 여러 겹의 얇은 판으로 갈라지고 그 판은 다시 미세한 주름으로 나뉘어 좁은 공간에 넓은 표면적을 담으며, 판을 이루는 막은 매우 얇다.`,
`그러나 셋 가운데 가장 다루기 까다로운 것이 농도 차이이다. 표면적과 막 두께는 구조를 바꾸면 되지만, 농도 차이는 산소가 옮겨 가는 그 순간부터 저절로 줄어들기 때문이다. 물은 산소를 내주면서 농도가 낮아지고 혈액은 산소를 받으면서 농도가 높아진다. 그대로 두면 둘의 농도는 이내 같아지고 교환은 멈춘다. 어류가 택한 해법은 ㉠물과 혈액이 흐르는 방향이다.`,
`아가미에서 혈액은 물이 흐르는 방향과 반대로 흐른다. 이러한 역류 방식에서는 산소를 이미 많이 실은 혈액이 아직 산소가 풍부한 물과 만나고, 산소가 거의 없는 혈액은 산소를 많이 내준 물과 만난다. 그 결과 물과 혈액이 맞닿아 있는 모든 구간에서 농도 차이가 유지되어 혈액은 끝까지 산소를 넘겨받는다. 어류가 물에 녹아 있는 산소의 팔 할 이상을 뽑아내는 것은 이 때문이다. 나아가 역류 방식에서는 물을 떠나는 혈액의 산소 농도가, 아가미를 빠져나가는 물의 산소 농도보다 높아질 수 있다. 만약 물과 혈액이 같은 방향으로 흐른다면 이런 일은 결코 일어나지 않는다.`,
`같은 방향으로 흐르는 병류 방식에서는 사정이 다르다. 처음에는 농도 차이가 커서 산소가 빠르게 옮겨 가지만, 흐름을 따라가는 동안 둘의 농도가 서로 다가가 마침내 같아지는 지점에 ⓒ이른다. 그 뒤로는 아무리 표면적이 넓어도, 아무리 막이 얇아도 산소는 더 옮겨 가지 않는다. 표면적과 막 두께를 아무리 손보아도 농도 차이가 0이면 곱도 0이기 때문이다. 이 방식으로 얻을 수 있는 산소는 물에 든 것의 절반가량에 그친다.`,
`역류 방식의 이점을 온전히 누리려면 흘려보내는 물의 양과 흘려보내는 혈액의 양이 알맞게 맞물려야 한다. 물이 지나치게 적으면 혈액이 산소를 다 받기도 전에 물이 산소를 잃어 농도 차이가 일찍 사라지고, 물이 지나치게 많으면 산소를 그대로 안은 채 빠져나가는 물이 늘어 헛되이 힘만 쓴다. 어류는 물의 양을 혈액의 양보다 훨씬 많게 유지하는데, 이는 같은 부피의 물에 든 산소가 혈액이 실을 수 있는 산소보다 훨씬 적기 때문이다. 산소가 부족한 물에서는 이 비를 더 높여 물을 더 많이 흘려보내지만, 그럴수록 아가미를 지나가게 하는 데 드는 힘도 함께 늘어난다.`,
`한편 수온이 오르면 물에 녹을 수 있는 산소의 양은 ⓓ줄어드는 반면, 어류의 대사율은 높아져 필요한 산소량은 늘어난다. 공급은 줄고 수요는 느는 이 어긋남을 메우려면 물을 더 많이 흘려보내야 하는데, 물은 무겁고 끈적여 그 자체로 적지 않은 산소를 ⓔ먹는다. 더운 물에서 물고기가 숨차 하는 까닭이 여기에 있다.`
 ],
 points:[
  '산소 이동량 ∝ (표면적 × 농도 차이) ÷ 막 두께 — 셋 중 농도 차이만 저절로 줄어듦',
  '역류: 전 구간 농도 차 유지 → 추출률 80%↑ / 유출 혈액 산소 농도 > 유출 물 산소 농도 (병류에선 불가능)',
  '병류: 농도가 같아지면 표면적·막 두께를 개선해도 교환 중단(곱이 0) → 50%가량',
  '수온↑ → 용존 산소↓ + 대사율↑ + 환기 비용↑ (삼중고)'
 ],
 questions:[

   choices:[

  {type:'핵심 개념',stem:'㉠에 대한 이해로 가장 적절한 것은?',

    '병류 방식에서도 표면적을 충분히 넓히면 물에 든 산소의 팔 할 이상을 얻을 수 있다.',

   ],answer:2,
   why:'역류에서만 유출 혈액의 산소 농도가 유출 물의 농도를 넘어설 수 있다. ①②는 역류와 병류의 특징을 맞바꾼 것이고, ④⑤는 농도 차이가 0이면 곱이 0이 되어 표면적이나 막 두께로 만회할 수 없다는 서술과 어긋난다.'},
  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`어류의 아가미를 본떠 장치 A와 B를 만들었다. 두 장치는 접촉 표면적, 막의 두께, 두 유체의 유량이 모두 같으며, A는 두 유체가 서로 반대 방향으로, B는 같은 방향으로 흐른다.
○ 결과 1: 유입된 물에 든 산소 중 혈액에 해당하는 유체로 옮겨 간 비율은 A가 B보다 뚜렷하게 높았다.

○ 결과 3: B의 막 두께를 절반으로 줄여 다시 실험하였더니, 접촉 구간 앞쪽에서는 산소 이동이 빨라졌으나 최종 추출 비율은 거의 달라지지 않았다.`,
   choices:[

  {type:'추론',stem:'윗글을 바탕으로 추론한 내용으로 가장 적절한 것은?',

    '어류가 물의 양을 혈액의 양보다 훨씬 많게 하는 것은 같은 부피의 물에 든 산소가 적기 때문이다.',

{id:'w3a',week:3,tag:'주제 통합 · 인문',color:'#D10000',title:'왕필과 곽상 — 무(無)를 둘러싼 두 해석',
 passage:[
`(가) 위진 시대의 ㉮왕필은 만물이 어디에 뿌리를 두고 있는가를 물었다. 그는 눈에 보이는 온갖 사물이 저마다 모습과 성질을 지니고 있다는 사실 자체에서 실마리를 찾는다. 무엇이든 하나의 모습을 지니면 그 모습이 아닌 것이 될 수 없다. 따뜻함은 차가움이 될 수 없고 굳센 것은 부드러운 것이 될 수 없다. 그러므로 특정한 모습을 지닌 것은 다른 모습을 지닌 것의 근거가 될 수 없다. 만물 전체의 근거가 되려면 어떤 특정한 모습도 지니지 않아야 하며, 왕필은 그러한 것을 무라 ⓐ일컬었다.`,
`여기서 무는 아무것도 없는 텅 빈 상태가 아니다. 그것은 어떤 규정도 지니지 않기에 도리어 모든 규정을 가능하게 하는 근거이다. 왕필은 이를 그릇의 비어 있음에 ⓑ견준다. 그릇이 쓸모 있는 것은 그 안이 비어 있기 때문이며, 만약 그 안이 이미 무엇으로 채워져 있다면 다른 것을 담을 수 없다. 그리하여 그는 무를 근본으로 삼고 유를 말단으로 삼되, 말단을 없애자는 것이 아니라 근본을 높임으로써 말단이 저절로 제자리를 찾게 하자고 하였다. 다스림에서도 마찬가지여서, 통치자가 자신의 뜻을 앞세워 일마다 손대는 것이 아니라 스스로를 비워 백성이 저절로 그러하도록 두는 것이 그가 말한 이상이다.`,
`왕필의 이러한 관점은 그가 글을 읽는 방식에도 그대로 이어진다. 말은 뜻을 담기 위한 그릇이고 형상은 이치를 드러내기 위한 방편일 뿐이다. 그러므로 뜻을 얻었으면 말은 잊어도 좋고, 이치를 얻었으면 형상은 놓아도 좋다. 오히려 말과 형상에 매달리는 자는 그것이 가리키려던 바를 놓친다. 그물은 물고기를 잡기 위한 것이니 물고기를 얻으면 그물은 잊어야 하는 것과 같다. 여기서도 근본과 말단의 관계가 되풀이된다. 특정한 규정에 붙들리지 않아야 규정 너머의 것에 이를 수 있다는 그의 생각이 언어를 다루는 태도에까지 미친 것이다.`,
`(나) ㉯곽상은 왕필의 물음 자체를 되돌려 묻는다. 무가 만물을 낳는다고 할 때, 그 무는 있는 것인가 없는 것인가. 만약 무가 무엇인가를 낳을 힘을 지녔다면 그것은 이미 아무것도 아닌 것이 아니라 하나의 무엇이며, 따라서 무라 불릴 수 없다. 반대로 무가 참으로 아무것도 아니라면, 아무것도 아닌 것에서 무엇인가가 나올 수는 없다. 어느 쪽으로 가든 무를 만물의 근거로 삼는 길은 ⓒ막힌다는 것이 그의 진단이다.`,
`그리하여 곽상은 만물이 어떤 것에도 의존하지 않고 스스로 그러하게 생겨나 스스로 그러하게 변해 간다고 보았다. 이것이 ㉠독화이다. 만물은 누가 만들어서 있는 것도 아니고 무에서 나온 것도 아니며, 다만 저절로 그러할 뿐이다. 왜 그러한가를 물으면 그저 그러할 뿐이라고 답할 수밖에 없고, 그 이상의 까닭을 찾는 일은 헛되다. 여기서 그는 만물 각각이 타고난 몫을 성분이라 부른다. 큰 새는 크게 날고 작은 새는 낮게 날되, 둘 가운데 어느 하나가 더 낫지 않다. 저마다 제 성분을 남김없이 ⓓ펼칠 때 그것으로 족하기 때문이다.`,
`이 성분의 개념은 그가 세상의 질서를 보는 방식과도 이어진다. 예의와 제도로 짜인 인간 세상의 질서를 두고, 그것이 타고난 본성을 억누르는 굴레라는 비판이 당시에 널리 퍼져 있었다. 곽상은 이를 받아들이지 않았다. 사람이 무리를 이루어 살아가는 것 자체가 사람의 성분에 속하며, 그렇다면 그 무리를 지탱하는 질서 또한 억지로 씌운 굴레가 아니라 저절로 그러한 바의 일부라는 것이다. 다만 그 질서가 사람들 저마다의 성분을 거스르며 하나의 틀에 맞추라고 다그칠 때, 비로소 그것은 굴레가 된다. 문제는 질서가 있다는 사실이 아니라 그것이 성분을 거스르는가에 있다.`,
`이 관점에서 다스림이란 백성 위에 어떤 이상을 세워 이끄는 일이 아니다. 다스리는 이가 할 일은 각자가 제 성분대로 살아가는 것을 가로막지 않는 것뿐이다. 곽상이 보기에, 무를 근본으로 세우고 그것을 높이라고 말하는 순간 이미 만물 바깥에 무엇인가를 놓아둔 셈이 되며, 이는 만물이 스스로 그러하다는 사실을 흐린다. 왕필의 입장에서는 이에 대해, 만물이 저마다 그러하다고만 말하고 그 그러함이 어디서 가능해지는지를 묻지 않는다면 물음을 회피한 것에 지나지 않는다는 반론이 ⓔ나올 수 있다.`
 ],
 points:[

{id:'w3b',week:3,tag:'사회 · 경제',color:'#B45309',title:'IS-LM에서 IS-MP로 — 통화 정책 모형의 전환',
 passage:[
`거시 경제의 단기 균형을 설명하는 고전적인 틀은 IS-LM 모형이다. IS 곡선은 재화 시장이 균형을 이루는 이자율과 산출의 조합을 잇는다. 이자율이 낮아지면 기업의 투자가 늘고 그만큼 산출이 늘어나므로, 이 곡선은 오른쪽 아래로 ⓐ기운다. LM 곡선은 화폐 시장이 균형을 이루는 조합을 잇는다. 중앙은행이 통화량을 일정하게 유지한다고 할 때, 산출이 늘면 거래를 위해 필요한 화폐가 늘어나는데 공급된 화폐의 양은 그대로이므로 이자율이 올라야 균형이 회복된다. 그리하여 LM 곡선은 오른쪽 위로 향한다. 두 곡선이 만나는 점에서 이자율과 산출이 동시에 정해진다.`,
`이 모형에서 정부가 지출을 늘리면 IS 곡선이 오른쪽으로 옮겨 간다. 산출이 늘어나는데 통화량은 그대로이므로 이자율이 올라가고, 오른 이자율은 민간의 투자를 줄인다. 재정 지출이 민간 투자를 밀어내는 이 현상을 구축 효과라 한다. 정부 지출이 늘어난 만큼 산출이 온전히 늘지 못하는 것은 이 때문이다.`,
`그런데 오늘날의 중앙은행은 통화량을 정해 두고 이자율이 시장에서 결정되도록 내버려 두지 않는다. 오히려 이자율을 직접 정해 발표하고, 그 이자율이 유지되도록 필요한 만큼 화폐를 공급한다. 통화량은 정책의 수단이 아니라 결과인 셈이다. 이 사실을 반영한 것이 ㉠MP 곡선이다. MP 곡선은 중앙은행이 어떤 준칙에 따라 이자율을 정하는지를 나타낸다. 널리 쓰이는 준칙에 따르면, 중앙은행은 물가 상승률이 목표보다 높거나 산출이 잠재 수준을 넘어설 때 이자율을 올린다. 산출이 늘 때 이자율을 올린다는 점에서 MP 곡선도 오른쪽 위로 향하지만, 그 이유는 화폐 수요가 늘어서가 아니라 중앙은행이 그렇게 하기로 정했기 때문이다.`,
`준칙을 좀 더 들여다볼 필요가 있다. 기업의 투자를 좌우하는 것은 명목상의 이자율이 아니라 물가 상승분을 덜어 낸 실질 이자율이다. 물가가 오르는 만큼 갚아야 할 돈의 실질 가치는 줄어들기 때문이다. 그러므로 중앙은행이 물가 상승률이 오른 만큼만 이자율을 올린다면 실질 이자율은 그대로여서 경기를 식히지 못한다. 널리 쓰이는 준칙이 물가 상승률이 1만큼 오를 때 이자율을 그보다 크게 올리도록 정한 까닭이 여기에 있다. 물가가 오를 때 실질 이자율까지 함께 올라야 비로소 수요가 눌리고 물가가 잡힌다.`,
`두 모형의 차이는 뜻밖의 충격이 닥칠 때 뚜렷해진다. 사람들이 갑자기 현금을 더 쥐고 있으려 해 화폐 수요가 늘었다고 하자. IS-LM에서는 통화량이 고정되어 있으므로 이자율이 올라가고 산출이 줄어든다. 화폐 수요의 변덕이 그대로 실물 경기의 ⓑ출렁임으로 옮겨 오는 것이다. 반면 IS-MP에서는 중앙은행이 정해 둔 이자율을 지키기 위해 늘어난 수요만큼 화폐를 더 공급한다. 이자율은 움직이지 않고, 따라서 산출도 흔들리지 않는다. 화폐 수요 충격이 실물로 번지지 않도록 중앙은행이 자동으로 ⓒ막아 주는 셈이다.`,
`재정 지출의 효과도 달라진다. 중앙은행이 산출 변화에 이자율을 거의 반응시키지 않는 경우, 곧 MP 곡선이 수평에 가까운 경우, 정부 지출이 늘어도 이자율이 오르지 않으므로 구축 효과가 거의 일어나지 않는다. 반대로 중앙은행이 산출이 조금만 늘어도 이자율을 크게 올리는 준칙을 따른다면, MP 곡선은 가팔라지고 구축 효과는 IS-LM에서보다 오히려 커질 수 있다. 재정 정책의 효과가 통화 당국의 준칙에 달려 있다는 점을 IS-MP는 드러낸다. 다만 이자율을 더 내릴 수 없는 하한에 ⓓ부딪치면 이야기가 달라진다. 그때 중앙은행은 준칙대로 이자율을 낮출 수 없고, MP 곡선은 그 지점에서 수평으로 ⓔ꺾인다.`
 ],

{id:'w3c',week:3,tag:'과학 · 생물',color:'#15803D',title:'하디-바인베르크 평형',
 passage:[
`한 집단 안에서 어떤 형질을 결정하는 대립유전자가 두 가지뿐이라고 하자. 이 둘을 각각 A와 a라 하고, 집단 전체의 유전자 가운데 A가 차지하는 비율을 p, a가 차지하는 비율을 q라 하면 p와 q의 합은 1이다. 이때 다음 세대의 유전자형 비율은 어떻게 될까. 부모 세대의 유전자들이 아무런 치우침 없이 무작위로 짝을 이룬다면, 자손이 A를 둘 물려받을 확률은 p를 두 번 곱한 값이고, a를 둘 물려받을 확률은 q를 두 번 곱한 값이며, 서로 다른 것을 하나씩 물려받을 확률은 p와 q를 곱한 값의 두 배이다. 이 관계를 하디-바인베르크 평형이라 ⓐ부른다.`,
`이 평형이 성립하려면 몇 가지 조건이 갖추어져야 한다. 짝짓기가 무작위로 일어나야 하고, 집단의 크기가 충분히 커서 우연에 의한 치우침이 무시할 만해야 하며, 돌연변이가 일어나지 않아야 하고, 다른 집단과 개체가 드나들지 않아야 하며, 어떤 유전자형도 생존과 번식에서 유리하거나 불리하지 않아야 한다. 이 조건들이 모두 갖추어지면 대립유전자의 비율 p와 q는 세대가 아무리 흘러도 달라지지 않는다.`,
`언뜻 이 결론은 시시해 보인다. 그러나 바로 이 시시함이 요긴하다. 이 평형은 아무 일도 일어나지 않을 때 집단이 어떤 모습이어야 하는지를 알려 주는 기준선이기 때문이다. 실제로 관찰한 유전자형의 비율이 이 기준선에서 뚜렷하게 ⓑ벗어난다면, 위의 다섯 조건 가운데 적어도 하나가 깨진 것이다. 그리고 그 깨진 조건이야말로 그 집단에서 지금 작동하고 있는 진화의 힘이다. 평형은 그것이 성립하지 않을 때 오히려 더 많은 것을 말해 준다.`,
`평형은 실용적인 쓸모도 지닌다. 어떤 열성 유전병을 앓는 사람이 만 명 가운데 한 명이라 하자. 병을 앓으려면 a를 둘 물려받아야 하므로, q를 두 번 곱한 값이 만분의 일이고 따라서 q는 백분의 일이다. 그러면 p는 백분의 구십구가 된다. 이제 겉으로는 멀쩡하지만 a를 하나 지닌 보인자의 비율은 p와 q를 곱한 값의 두 배로, 대략 오십 명 가운데 한 명에 ⓒ이른다. 환자는 만 명에 한 명뿐인데 보인자는 오십 명에 한 명꼴인 셈이다. 드문 열성 형질일수록 겉으로 드러난 환자 수에 견주어 숨은 보인자가 압도적으로 많다는 사실이 여기서 ⓓ드러난다. 실제로 q가 작아질수록 보인자와 환자의 수의 비는 커진다.`,
`평형에서 벗어난 모습이 오히려 오래 유지되는 경우도 있다. 어떤 지역에서는 특정 열성 유전병의 대립유전자가 예상보다 훨씬 흔하게 유지된다. 그 대립유전자를 둘 물려받은 사람은 병을 앓아 불리하지만, 하나만 지닌 사람은 그 지역에 흔한 감염병에 잘 걸리지 않아 오히려 유리하기 때문이다. 하나를 지닌 사람이 가장 유리한 이 상황에서는, 불리한 대립유전자가 집단에서 사라지지 않고 일정한 비율로 남는다. 자연선택이 언제나 해로운 유전자를 몰아내는 방향으로만 작동하지는 않는다는 사실을 이 사례는 보여 준다.`,
`다만 이 계산을 그대로 적용할 수 없는 경우도 있다. 성염색체 위에 놓인 유전자가 그러하다. 남성은 그 염색체를 하나만 지니므로 열성 대립유전자를 하나만 물려받아도 형질이 나타난다. 이 경우 남성 환자의 비율은 q를 두 번 곱한 값이 아니라 q 그 자체에 가까워지고, 그리하여 남성 환자가 여성 환자보다 훨씬 흔해진다. 평형의 논리를 쓰되 그 전제가 어디까지 ⓔ먹히는지를 살피는 일이 필요한 까닭이다.`

{id:'w4a',week:4,tag:'인문 · 존재론',color:'#7C3AED',title:'하이데거 — 도구와 존재의 물음',
 passage:[
`하이데거는 서양 철학이 오랫동안 존재하는 것들에만 매달린 채 정작 있음 자체는 묻지 않았다고 보았다. 책상이 무엇으로 되어 있고 어떤 성질을 지녔는지는 물으면서, 그것이 있다는 것이 대체 무엇을 뜻하는지는 묻지 않았다는 것이다. 그는 개별적으로 있는 것들을 존재자라 하고, 그것들이 있다는 사태 자체를 존재라 하여 둘을 엄격히 갈랐다. 존재는 하나의 존재자가 아니므로 다른 존재자들처럼 대상으로 세워 놓고 관찰할 수 없다. 존재를 존재자처럼 다루려는 순간 물음은 어긋난다.`,
`그렇다면 존재는 어디에서 물어져야 하는가. 하이데거는 존재자 가운데 자신의 있음을 스스로 문제 삼는 유일한 존재자에서 실마리를 찾는다. 돌은 자신이 있다는 사실에 관심을 두지 않지만 인간은 그렇지 않다. 인간은 늘 자신이 어떻게 있어야 하는지를 염려하며 살아간다. 하이데거는 이러한 존재자를 현존재라 ⓐ이름 붙였다.`,
`현존재는 세계 안에 있다. 그러나 이 안에 있음은 물이 컵 안에 있는 것과 같지 않다. 물은 컵과 아무 상관 없이 그저 담겨 있을 뿐이지만, 현존재는 세계에 익숙해져 있고 세계와 이미 얽혀 있다. 우리가 방에 들어설 때 문손잡이를 새삼 관찰하고 그 성질을 따져 본 뒤 돌리는 것이 아니라 그저 돌리듯이 말이다. 이처럼 현존재가 세계와 맺는 가장 가까운 관계는 바라봄이 아니라 ⓑ다룸이다.`,
`이 관계 속에서 사물은 손안에 있는 것으로 나타난다. 망치는 무게와 재질을 지닌 물체이기 이전에 못을 박기 위한 것이며, 못은 널빤지를 잇기 위한 것이고, 널빤지는 비를 막을 지붕을 얹기 위한 것이다. 도구는 홀로 도구일 수 없으며, 언제나 다른 도구들과 얽힌 그물 속에서만 그것인 바가 된다. 그리고 이 그물이 원활히 돌아가는 동안 도구는 스스로를 ⓒ내세우지 않는다. 망치질에 몰두한 사람의 눈에 망치는 보이지 않는다. 도구는 자신을 감춤으로써 도구로서 온전히 작동하는 것이다.`,
`도구들의 이 얽힘은 결국 어딘가에서 멈춘다. 못은 널빤지를 위한 것이고 널빤지는 지붕을 위한 것이며 지붕은 비를 피하기 위한 것인데, 비를 피하는 일은 다시 무엇을 위한 것인가. 하이데거는 이 물음의 끝에 현존재 자신이 있다고 답한다. 도구들의 그물은 마지막에 현존재가 자신의 삶을 어떻게 꾸려 갈 것인가 하는 데로 이어지며, 바로 그 때문에 그물 전체가 뜻을 지닌다. 세계란 이 뜻의 그물이지, 사물들을 담아 놓은 커다란 그릇이 아니다.`,
`그렇다면 우리는 언제 사물을 대상으로 마주 세우는가. 하이데거는 ㉠도구가 고장 나거나 사라지거나 거치적거릴 때라고 답한다. 망치 자루가 부러지는 순간 망치는 비로소 눈에 띈다. 그것은 이제 못을 박기 위한 것이 아니라 무게와 부피를 지닌 하나의 사물, 곧 눈앞에 있는 것으로 드러난다. 동시에 여태 보이지 않던 도구들의 얽힘 전체도 함께 드러난다. 못이 무엇을 위한 것이었고 지붕이 무엇을 위한 것이었는지가 그제야 환해진다. 요컨대 눈앞에 있음은 손안에 있음보다 근원적인 것이 아니라, 손안에 있음이 무너질 때 파생되어 나오는 방식이다.`,
`서양 철학이 존재를 잊은 까닭도 여기에 있다고 하이데거는 본다. 철학은 사물을 다루는 삶의 자리를 떠나 그것을 마주 세워 관찰하는 태도를 유일하게 참된 것으로 ⓓ떠받들었고, 그리하여 파생된 방식을 근원적인 것으로 잘못 놓았다. 존재의 물음을 되살리려면 이 뒤집힌 순서를 바로 ⓔ돌려놓아야 한다는 것이다.`

{id:'w4b',week:4,tag:'사회 · 법',color:'#2563EB',title:'법적 의제 — 메인이 본 법의 변화',
 passage:[
`법은 좀처럼 스스로 바뀌지 않는다. 사회는 쉬지 않고 움직이는데 법은 문장으로 굳어 있어, 둘 사이에는 늘 틈이 생긴다. 법학자 메인은 이 틈을 메워 온 방식을 셋으로 나누어 살폈다. 의제와 형평과 입법이 그것이다.`,
`가장 먼저 등장한 것은 ㉠의제이다. 의제란 법조문은 그대로 둔 채, 실제로는 그렇지 않은 사실을 그러한 것으로 다루기로 하는 기법이다. 이를테면 피를 나누지 않은 사람을 자식으로 삼는 입양은, 낳지 않았음에도 낳은 것처럼 다루겠다는 약속이다. 법조문은 한 글자도 바뀌지 않았지만 그 법이 미치는 범위는 넓어진다. 메인은 의제가 법을 바꾸면서도 바뀌지 않은 척한다는 점에 주목하였다. 옛것을 함부로 건드릴 수 없는 사회에서, 의제는 겉으로는 조상의 법을 고스란히 지키면서 속으로는 그 법을 새 사정에 ⓐ맞추는 길이었다.`,
`그러나 의제에는 값이 따른다. 법의 겉과 속이 어긋나므로, 법을 처음 배우는 이는 조문을 읽고도 실제로 무슨 일이 벌어지는지 알기 어렵다. 조문 뒤에 쌓인 의제의 관행을 따로 익혀야 하는 것이다. 메인은 의제가 법을 가장 어수선하게 만드는 방식이라고 보았다. 그럼에도 그것이 오래 쓰인 것은, 법을 대놓고 고치는 일이 아직 허용되지 않던 시기에 다른 길이 없었기 때문이다.`,
`다음으로 나타난 것이 형평이다. 형평은 기존의 법과 나란히 서는 별개의 규범 체계로, 원래의 법보다 우월한 원리를 지녔다고 주장하며 그 법을 ⓑ고쳐 나간다. 의제가 자신이 법을 바꾸고 있음을 숨긴다면, 형평은 그것을 드러내 놓고 정당화한다. 다만 형평 역시 자신이 언제 어떻게 개입할지를 미리 다 밝히지는 않는다. 마지막에 등장하는 것이 입법이다. 입법은 외부의 권위가 명시적으로 법을 만들거나 고치는 방식으로, 그 정당성은 그 권위가 지닌 자격 자체에서 ⓒ나온다. 메인이 보기에 이 셋은 대체로 이 순서로 등장하였으며, 뒤의 것일수록 자신이 하는 일을 감추지 않는다.`,
`의제는 유추와 닮았으면서도 다르다. 유추는 법에 적힌 사안과 적히지 않은 사안이 서로 닮았다는 점을 근거로 삼아, 적히지 않은 사안에도 같은 결론을 끌어다 쓰는 추론이다. 여기서는 두 사안이 실제로 얼마나 닮았는지가 늘 다투어진다. 반면 의제는 닮았는지를 따지는 대신, 아예 그러한 것으로 다루기로 못 박는다. 다툼의 여지를 없애는 대신 사실과의 거리를 감수하는 것이다. 그러므로 의제는 법을 안정시키는 힘과 법을 실제로부터 떼어 놓는 힘을 동시에 지닌다.`,
`이 시각은 오늘날의 법에도 닿는다. 법인이라는 제도가 그러하다. 회사는 숨 쉬는 사람이 아니지만, 법은 회사를 사람인 것처럼 다루어 재산을 갖고 계약을 맺고 소송의 당사자가 되게 한다. 사람에 관한 규정을 회사에도 쓰기 위해서는 사람이 아닌 것을 사람으로 다루기로 하는 약속이 필요했던 것이다. 다만 여기서 주의할 점이 있다. 의제는 사실이 그러하다고 주장하는 것이 아니라 그러한 것으로 다루기로 정하는 것이다. 회사가 정말로 사람이라고 믿는 사람은 없다. 그러므로 의제를 두고 그것이 사실과 다르다고 ⓓ나무라는 것은 과녁을 벗어난 비판이다. 정작 물어야 할 것은, 그렇게 다루기로 한 결정이 어떤 문제를 풀었고 그 대가로 무엇을 ⓔ흐려 놓았는가이다.`
 ],
 points:[
  '메인: 법과 사회의 틈을 메우는 세 방식 — 의제 → 형평 → 입법 (뒤로 갈수록 자신이 하는 일을 감추지 않음)',
  '의제: 조문은 그대로 두고 사실이 아닌 것을 그러한 것으로 다룸 → 법을 바꾸면서 바뀌지 않은 척함',
  '의제의 대가: 법의 겉과 속이 어긋나 법이 어수선해짐',

  {type:'추론',stem:'윗글을 바탕으로 추론한 내용으로 가장 적절한 것은?',
   choices:[

  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 이해한 내용으로 적절하지 않은 것은? [3점]',
   box:`○ 어떤 법은 사람이 사망한 것으로 확실히 밝혀지지 않았더라도, 오랫동안 생사를 알 수 없는 경우에는 사망한 것으로 보아 상속을 개시하도록 정하고 있다. 이 규정은 사망 여부를 실제로 증명하도록 요구하지 않는다.
○ 한편 갑은 이 규정을 두고, 실제로는 살아 있을지도 모르는 사람을 죽었다고 단정하는 것이니 사실에 어긋나는 제도라고 비판하였다.`,

{id:'w4c',week:4,tag:'기술',color:'#D10000',title:'양자점 디스플레이',
 passage:[
`반도체 결정에 빛이나 전기 에너지를 주면 전자가 위로 뛰어올랐다가 다시 내려오면서 그 차이만큼의 에너지를 빛으로 내놓는다. 이 에너지 차이를 띠간격이라 하며, 띠간격이 클수록 파장이 짧은 빛이, 작을수록 파장이 긴 빛이 나온다. 보통의 반도체에서 띠간격은 그 물질이 무엇인가에 따라 정해지므로, 다른 색을 얻으려면 다른 물질을 써야 한다.`,
`그런데 결정의 크기를 수 나노미터까지 줄이면 사정이 달라진다. 전자는 좁은 공간에 갇힐수록 더 큰 에너지를 갖게 되는데, 결정이 전자의 활동 범위보다 작아지면 이 효과가 뚜렷해진다. 그리하여 같은 물질이라도 알갱이가 작을수록 띠간격이 커지고, 그만큼 파장이 짧은 빛이 나온다. 이러한 나노 결정을 양자점이라 한다. 양자점을 쓰면 물질을 바꾸지 않고 알갱이의 크기만 ⓐ달리하여 붉은빛부터 푸른빛까지 얻을 수 있다. 큰 알갱이에서는 붉은빛이, 작은 알갱이에서는 푸른빛이 나온다.`,
`양자점의 또 다른 장점은 내놓는 빛의 색이 매우 순수하다는 점이다. 빛이 어느 파장에 얼마나 몰려 있는지를 그리면 봉우리 모양이 되는데, 이 봉우리의 폭이 좁을수록 색이 순수하다. 양자점은 봉우리가 좁아, 화면이 표현할 수 있는 색의 범위가 넓어진다. 다만 이는 알갱이들의 크기가 고르다는 전제 아래에서만 그러하다. 크기가 제각각이면 저마다 다른 파장의 빛을 내어 봉우리가 ⓑ퍼지고, 색의 순수함은 그만큼 무너진다. 양자점 제조에서 크기를 고르게 하는 일이 관건인 까닭이다.`,
`양자점이 제 성능을 내려면 표면을 다스려야 한다. 알갱이가 작을수록 전체 원자 가운데 표면에 놓인 원자의 몫이 커지는데, 표면의 원자들은 이웃과 결합할 자리를 다 채우지 못한 채 남는다. 이렇게 비어 있는 자리는 뛰어오른 전자를 붙잡아 두었다가 빛을 내지 못한 채 열로 흘려보낸다. 이를 막기 위해 양자점 겉에 띠간격이 더 큰 다른 반도체를 얇게 입힌다. 이 껍질은 전자를 안쪽에 가두어 표면의 빈자리에 닿지 못하게 하며, 그 결과 빛으로 바뀌는 비율이 크게 높아진다. 껍질이 얇으면 가두는 힘이 모자라고 지나치게 두꺼우면 결정이 어긋나 오히려 새로운 빈자리가 생기므로, 적절한 두께를 찾는 일이 중요하다.`,
`양자점을 화면에 쓰는 방식은 크게 둘로 나뉜다. 하나는 ㉠빛으로 양자점을 깨우는 방식이다. 파장이 짧은 푸른빛을 광원으로 삼아 양자점에 ⓒ쬐면, 양자점이 그 빛을 흡수했다가 자신의 크기에 맞는 붉은빛이나 초록빛을 내놓는다. 푸른빛은 그대로 통과시키고 나머지 두 색은 양자점이 만들어 내는 것이다. 여기서 광원의 빛은 반드시 양자점이 낼 빛보다 파장이 짧아야 한다. 흡수한 것보다 더 큰 에너지의 빛을 내놓을 수는 없기 때문이다. 붉은 광원으로 푸른빛을 만들 수 없는 이유가 여기에 있다.`,
`다른 하나는 양자점에 전기를 직접 흘려 스스로 빛을 내게 하는 방식이다. 이 방식에서는 광원이 따로 필요 없고 화소마다 빛을 켜고 끌 수 있어, 검은색을 표현할 때 아예 빛을 내지 않을 수 있다. 앞의 방식에서는 광원이 늘 켜져 있어 새어 나오는 빛을 완전히 ⓓ막기 어려운데, 이 문제가 사라지는 것이다. 다만 전기로 깨우는 방식은 아직 수명과 효율에서 풀어야 할 과제가 남아 있으며, 특히 푸른빛을 내는 양자점은 띠간격이 커서 더 큰 에너지를 다루어야 하는 탓에 다른 색보다 빨리 ⓔ닳는다.`

{id:'w5a',week:5,tag:'인문 · 동양철학',color:'#7C3AED',title:'리(理)와 기(氣) — 장재, 정이, 주희',
 passage:[
`동양 철학에서 만물이 무엇으로 이루어져 있고 무엇에 의해 그러한 모습을 띠는가 하는 물음은 오래도록 이어졌다. 이 물음에 답하며 쓰인 두 낱말이 기와 리이다. 기는 모이고 흩어지며 형체를 이루는 것이고, 리는 사물이 그러한 까닭이다.`,
`장재는 기 하나로 모든 것을 설명하고자 하였다. 그가 보기에 텅 빈 것처럼 보이는 허공도 실은 지극히 옅게 흩어진 기이다. 기가 모이면 눈에 보이는 사물이 되고 흩어지면 다시 허공으로 돌아가니, 생겨남과 사라짐은 있음과 없음의 교체가 아니라 모임과 흩어짐의 교체일 뿐이다. 그러므로 없음에서 있음이 나온다는 말도, 있음이 없음으로 돌아간다는 말도 성립하지 않는다. 이 관점에서 사물이 그러한 까닭 역시 기가 모이고 흩어지는 방식 안에 이미 들어 있다. 리는 기와 나란히 놓인 또 하나의 무엇이 아니라, 기가 움직이는 결일 따름이다.`,
`정이는 여기에서 갈라선다. 그는 형체를 지니고 오르내리는 것과, 그렇게 오르내리게 하는 까닭을 갈라야 한다고 보았다. 앞의 것이 기이고 뒤의 것이 리이다. 기가 아무리 정교하게 움직인다 해도 그 움직임이 어째서 다른 방식이 아니라 하필 그 방식이어야 하는지는 기 자체로부터 나오지 않는다. 리를 세우지 않으면 이 물음이 남는다는 것이다. 나아가 그는 리가 하나이면서도 만물마다 다르게 드러난다고 하였다. 하나의 달이 온 강에 비치어 강마다 다른 달로 보이지만 달이 여럿인 것은 아니듯이 말이다.`,
`정이의 구분에 대해 장재의 편에서는 다음과 같이 되물을 수 있다. 기와 따로 있는 리를 세우고 나면, 그 리는 대체 어디에 어떻게 있는가. 형체도 없고 자리도 없다면 그것이 있다는 말은 무슨 뜻인가. 결국 기가 그렇게 움직인다는 사실을 달리 부른 것에 지나지 않는 것이 아닌가. 이 되물음은 리를 세우는 쪽이 리의 있음을 어떤 방식으로 말할 것인지를 해명해야 함을 보여 준다.`,
`주희는 정이의 구분을 이어받되 둘의 관계를 더 촘촘히 ⓐ다듬었다. 그에 따르면 리와 기는 서로 떠나지 않는다. 리는 언제나 기에 실려 있고, 기 없이 홀로 떠다니는 리란 없다. 그러나 둘은 서로 섞이지도 않는다. 리는 형체도 없고 스스로 움직이지도 않는 반면, 기는 형체를 이루고 스스로 움직인다. 그러므로 리가 기를 밀거나 당겨 무엇을 하게 만드는 것이 아니다. 리는 다만 기가 그렇게 움직여야 할 바를 정해 줄 뿐이며, 실제로 움직이는 일은 언제나 기가 한다.`,
`[A] 어떤 이는 다음과 같이 논증하였다. 첫째, 형체를 지니고 이 세계 안에 있는 것은 모두 기이다. 둘째, 리는 만물 하나하나에 깃들어 있다. 그러므로 리도 기이다. 주희는 이 논증이 성립하지 않는다고 보았다. 첫 번째 전제의 있다는 말은 형체를 지닌 채 어느 자리를 차지한다는 뜻이지만, 두 번째 전제의 깃들어 있다는 말은 그런 뜻이 아니다. 그것은 리가 그 사물이 그러한 까닭이 된다는 뜻일 뿐, 리가 사물 속 어느 자리에 형체를 지니고 들어앉아 있다는 뜻이 아니다. 두 전제에 쓰인 있다가 서로 다른 뜻이므로, 두 전제를 모두 받아들이더라도 결론은 따라 나오지 않는다.`,
`이러한 구분은 사람의 마음을 다루는 데에서 실질적인 무게를 지닌다. 주희에 따르면 사람의 본성은 리이고 감정과 욕구는 기의 움직임이다. 본성이 온전하지 않아서 잘못이 생기는 것이 아니라, 기가 흐려지거나 치우쳐서 본성이 제대로 드러나지 못하는 것이다. 그러므로 공부란 없던 리를 새로 ⓑ만들어 넣는 일이 아니라, 흐려진 기를 맑게 하여 이미 있는 리가 드러나게 하는 일이 된다.`
 ],
 points:[
  '장재: 기 일원 — 허공도 옅게 흩어진 기 / 생멸은 모임과 흩어짐일 뿐 / 리는 기의 결',

{id:'w5b',week:5,tag:'기술 · 역학',color:'#2563EB',title:'이동식 크레인과 전도 안정성',
 passage:[
`이동식 크레인은 차량 위에 붐을 얹어 무거운 짐을 들어 올리는 장비이다. 이때 가장 먼저 따져야 할 것은 장비가 앞으로 넘어지지 않는가, 곧 전도의 문제이다. 크레인이 넘어지려 할 때 그 회전의 중심이 되는 선을 전도선이라 하며, 아웃트리거라 불리는 받침대를 좌우로 뻗으면 전도선이 바깥으로 밀려난다.`,
`물체를 회전시키려는 작용의 크기를 모멘트라 하고, 이는 힘의 크기와, 회전의 중심에서 그 힘이 작용하는 지점까지의 거리를 곱한 값이다. 크레인에는 두 종류의 모멘트가 맞선다. 짐의 무게가 크레인을 전도선 바깥으로 넘어뜨리려는 전도 모멘트와, 장비 자체의 무게가 크레인을 안쪽으로 눌러 붙드는 안정 모멘트이다. 전도 모멘트가 안정 모멘트보다 커지는 순간 크레인은 넘어진다.`,
`전도 모멘트는 짐의 무게에 작업 반경을 곱한 값이다. 작업 반경이란 전도선에서 짐이 매달린 지점까지의 수평 거리이다. 그러므로 안정 모멘트가 정해져 있다면, 넘어지지 않고 들 수 있는 최대 하중은 작업 반경에 ⓐ반비례한다. 반경이 두 배가 되면 들 수 있는 무게는 절반이 된다. 크레인의 성능을 하나의 무게로만 말할 수 없고 반경마다 다르게 적어 둔 표로 제시하는 까닭이 여기에 있다.`,
`그런데 작업 반경은 붐을 다루는 두 가지 방법으로 달라진다. 하나는 붐의 길이이고 다른 하나는 붐이 지면과 이루는 각도이다. 붐을 세울수록, 곧 각도가 클수록 붐 끝은 위로 올라가고 작업 반경은 짧아진다. 반대로 붐을 눕힐수록 반경은 길어진다. 같은 반경을 얻는 방법이 여럿이라는 점이 중요하다. 짧은 붐을 눕혀서 얻은 반경과 긴 붐을 세워서 얻은 반경은 값이 같을 수 있다. 그러나 둘이 같은 무게를 들 수 있는 것은 아니다. 붐은 길어질수록 그 자체의 무게가 늘고, 그 무게 또한 전도선에서 떨어진 곳에 걸리므로 전도 모멘트에 ⓑ보태진다. 그리하여 반경이 같아도 붐이 길수록 들 수 있는 짐은 가벼워진다.`,
`아웃트리거는 이 싸움의 판을 바꾼다. 받침대를 넓게 뻗으면 전도선이 바깥으로 물러나므로, 장비 무게가 전도선까지 갖는 거리가 길어져 안정 모멘트가 커진다. 동시에 같은 위치의 짐이라도 전도선에서의 거리, 곧 작업 반경은 짧아진다. 안정 모멘트는 커지고 전도 모멘트는 줄어드니 두 방향으로 함께 유리해지는 셈이다. 받침대를 다 뻗지 못한 채 작업하는 것이 위험한 까닭이다.`,
`실제 현장에서는 전도 직전까지 짐을 싣지 않는다. 지반이 조금 꺼지거나 바람이 불거나 짐이 흔들리기만 해도 반경이 커질 수 있기 때문이다. 그래서 넘어지기 직전의 하중, 곧 전도 하중에 1보다 작은 값을 곱한 것을 그 반경에서 허용되는 정격 하중으로 삼는다. 곱하는 값이 작을수록 여유는 넉넉해지지만 들 수 있는 무게는 줄어든다. 안전과 능력은 이렇게 맞바꾸어진다. 한편 짐이 흔들려 옆으로 밀리면 반경이 늘어나 전도 모멘트가 커지므로, 짐을 급히 올리거나 멈추는 조작은 그 자체로 반경을 키우는 일과 다름없다.`
 ],
 points:[
  '모멘트 = 힘 × (회전 중심에서 힘 작용점까지의 거리) / 전도 모멘트 > 안정 모멘트 → 전도',

{id:'w5c',week:5,tag:'주제 통합 · 법',color:'#D10000',title:'형사법에서의 인과 관계와 객관적 귀속',
 passage:[
`(가) 사람의 행위가 어떤 결과를 낳았을 때, 그 결과를 그 행위의 탓으로 돌릴 수 있는가. 형사법은 먼저 두 사건 사이에 사실로서의 이음이 있는지를 묻는다. 가장 오래된 대답은 조건설이다. 그 행위가 없었다면 그 결과도 없었으리라고 말할 수 있으면 둘 사이에 인과 관계가 있다고 보는 것이다. 이 기준은 간명하지만 그물이 지나치게 넓다. 사람을 다치게 한 자가 없었다면 그 사람이 병원으로 옮겨지는 일도 없었을 것이고, 병원에 불이 나 숨지는 일도 없었을 것이다. 조건설을 그대로 ⓐ밀고 나가면 방화범이 낸 불로 숨진 결과까지 애초의 가해자에게 이어진다.`,
`이 난점을 덜기 위해 상당인과관계설이 제시되었다. 이는 그러한 행위에서 그러한 결과가 나오는 일이 일상의 경험에 비추어 통상적인 경우에만 인과 관계를 인정한다. 사람을 때린 일에서 사망이라는 결과가 나오는 것은 드물지 않으나, 병원 화재로 인한 사망까지 이어지는 것은 통상적이라 보기 어렵다. 그리하여 앞의 사례에서 가해자에게 사망의 책임을 묻지 않는 길이 열린다. 다만 무엇이 통상적인지는 판단하는 이의 경험과 시각에 기대게 되어, 기준이 흐릿하다는 지적이 ⓑ뒤따랐다.`,
`두 견해가 겨루는 자리에는 또 하나의 물음이 겹친다. 아무 일도 하지 않은 것도 결과를 낳았다고 할 수 있는가 하는 물음이다. 물에 빠진 아이를 보고도 건지지 않은 사람의 경우, 그가 한 일은 아무것도 없으므로 그 없음이 무엇인가를 일으켰다고 말하기는 어색하다. 그러나 법은 구할 의무를 진 자가 구하지 않은 때에는, 그가 마땅히 했어야 할 일을 했더라면 결과가 일어나지 않았으리라는 관계를 물어 인과 관계를 인정한다. 실제로 있었던 일이 아니라 있었어야 할 일을 끌어와 견주는 것이다.`,
`(나) ㉠객관적 귀속론은 물음을 둘로 나눌 것을 제안한다. 하나는 그 행위가 그 결과를 사실로서 일으켰는가 하는 물음이고, 다른 하나는 그 결과를 그 행위자의 것으로 규범적으로 돌릴 수 있는가 하는 물음이다. 앞의 물음에는 조건설의 판단을 그대로 쓰되, 그것만으로는 아무것도 ⓒ결정되지 않는다고 본다. 사실의 이음이 있다는 것은 책임을 묻기 위한 최소한의 문턱일 뿐, 문턱을 넘었다고 하여 안으로 들어갈 자격이 생기는 것은 아니다.`,
`뒤의 물음에 답하기 위해 이 이론은 두 가지를 차례로 ⓓ따진다. 첫째, 그 행위가 법이 허용하지 않는 위험을 만들어 냈는가. 조카가 벼락을 맞기를 바라며 숲으로 심부름을 보냈고 실제로 벼락이 떨어졌다 하더라도, 숲으로 사람을 보내는 일은 법이 허용하는 범위 안의 행위이므로 허용되지 않는 위험을 만든 것이 아니다. 둘째, 만들어진 그 위험이 바로 그 결과로 실현되었는가. 때린 행위가 만들어 낸 위험은 맞은 사람이 다치거나 숨질 위험이지 병원에 불이 날 위험이 아니다. 화재로 인한 사망은 다른 위험이 실현된 것이므로, 사실의 이음이 있더라도 가해자에게 돌려지지 않는다.`,
`위험의 실현을 따지는 데에는 하나의 물음이 더 얹힌다. 행위자가 규칙을 지켰더라도 같은 결과가 일어났으리라고 볼 수 있는 경우이다. 운전자가 규정 속도를 넘겨 달리다 사람을 쳤는데, 그 사람이 갑자기 뛰어들어 규정 속도로 달렸더라도 피할 수 없었으리라 인정된다면 어떻게 되는가. 이때 규정 위반이 만들어 낸 여분의 위험은 그 결과로 실현되었다고 보기 어렵다. 규칙을 어긴 것과 결과 사이에 사실의 이음이 있더라도, 그 어김이 결과를 좌우하지 못한 이상 결과를 그의 것으로 돌릴 수 없다는 것이다. 다만 이 판단은 일어나지 않은 일을 가정하여 견주는 것이어서, 어디까지 확실해야 인정할 것인가를 두고 다툼이 이어진다.`,
`이 틀은 상당인과관계설이 뭉뚱그려 다루던 것을 갈라 놓았다는 데 뜻이 있다. 통상적인가라는 하나의 물음에 섞여 있던 사실 판단과 규범 판단을 떼어 냄으로써, 어느 단계에서 무엇을 근거로 판단하는지가 드러나기 때문이다. 나아가 이 이론은 규범이 무엇을 막으려 했는지를 함께 묻는다. 어떤 규정이 특정한 위험을 막으려고 만들어진 것이라면, 그 규정을 어겼더라도 그것이 막으려던 위험과 무관한 결과까지 행위자에게 돌릴 수는 없다. 다만 무엇이 허용되지 않는 위험이고 어떤 위험이 실현된 것인지를 가르는 일 또한 결국 평가를 ⓔ거쳐야 하므로, 이 이론이 판단자의 시각을 완전히 걷어 낸 것은 아니라는 반론도 있다.`
 ],

{id:'w6a',week:6,tag:'예술 · 음악',color:'#7C3AED',title:'미니멀리즘 음악과 위상 변이',
 passage:[
`20세기 중반의 일부 작곡가들은 음 하나하나를 엄밀한 규칙으로 배치하여 극도로 복잡한 짜임을 만들어 냈다. 그 결과 악보는 정교해졌으나 듣는 이는 그 규칙을 귀로 ⓐ좇을 수 없었다. 짜임의 원리와 들리는 것 사이의 골이 벌어진 것이다. 미니멀리즘은 이 골을 메우려는 시도에서 출발하였다. 재료를 극단적으로 줄이고, 그 재료가 변해 가는 과정을 누구나 들을 수 있게 드러내자는 것이다.`,
`이들이 택한 재료는 짧은 음형 하나이다. 몇 개의 음으로 이루어진 이 음형은 쉬지 않고 되풀이된다. 그러나 되풀이가 곧 정지는 아니다. 음형은 조금씩 달라지며, 그 달라짐은 미리 정해진 절차를 따른다. 글래스는 되풀이할 때마다 음을 하나씩 보태거나 덜어 내는 방식을 썼다. 다섯 음이 여섯 음이 되고 다시 일곱 음이 되는 식이다. 어느 순간 무엇이 달라졌는지 듣는 이는 알아차릴 수 있고, 그 절차는 감추어지지 않는다.`,
`라이히가 고안한 ㉠위상 변이는 이 생각을 한층 밀고 나간다. 같은 음형을 두 연주자가 함께 되풀이하되, 한 사람이 아주 조금 빠르게 연주한다. 처음에는 둘이 겹쳐 하나로 들리지만, 시간이 흐르면서 뒤의 소리가 앞의 소리에서 조금씩 밀려난다. 밀려남이 쌓여 정확히 한 박에 이르면 두 음형은 한 박만큼 어긋난 채 다시 맞물린다. 이 어긋남이 계속 쌓여 음형의 길이만큼 밀려나면 둘은 처음처럼 다시 겹친다. 열두 박짜리 음형이라면 한 박씩 열두 번 밀려난 끝에 제자리로 돌아오고, 그동안 열한 가지의 서로 다른 겹침이 지나가는 셈이다.`,
`여기서 주목할 것은 그 열한 가지의 겹침을 작곡가가 하나하나 ⓑ고른 것이 아니라는 점이다. 그는 음형 하나와 어긋나게 하라는 절차 하나를 정했을 뿐이고, 나머지는 그 절차가 저절로 낳았다. 두 음형이 어긋나 맞물릴 때, 어느 쪽에도 적혀 있지 않은 새로운 선율이 귀에 떠오르기도 한다. 왼쪽에서 한 음, 오른쪽에서 한 음이 번갈아 들리며 만들어지는 이 선율은 악보 어디에도 없다. 라이히는 이렇게 절차가 스스로 빚어낸 결과를 듣는 일이야말로 이 음악의 핵심이라고 보았다.`,
`그리하여 듣는 방식도 달라진다. 앞선 음악에서 듣는 이는 다음에 무엇이 올 것인가를 기다리며 긴장과 해소를 좇았다. 미니멀리즘에서는 다음에 올 것이 이미 뻔하다. 대신 듣는 이의 주의는 지금 무엇이 달라지고 있는가로 ⓒ옮겨 간다. 같은 것이 되풀이될수록 아주 작은 차이가 크게 들리고, 어느 대목에 귀를 두는가에 따라 전혀 다른 음악이 들린다. 같은 연주를 두 사람이 서로 다르게 듣는 일이 여기서는 결함이 아니라 의도된 바이다.`,
`물론 단조롭다는 비판이 늘 따라다녔다. 그러나 이 비판은 무엇이 달라지고 있는지를 듣지 않고 무엇이 다음에 오는지를 기다린 데에서 ⓓ비롯되었다는 반론도 있다. 미니멀리즘은 음악이 무엇을 말하는가가 아니라 음악이 어떻게 되어 가는가를 듣게 하려 하였고, 그 점에서 듣는 이에게 새로운 몫을 ⓔ맡긴 셈이다.`
 ],

{id:'w6b',week:6,tag:'사회 · 경제',color:'#B45309',title:'동시 다중 라운드 경매',
 passage:[
`국가가 이동 통신용 주파수를 사업자에게 나누어 줄 때에는 경매가 널리 쓰인다. 그런데 주파수는 여러 대역으로 나뉘어 있고, 사업자에게 각 대역의 값어치는 서로 얽혀 있다. 어떤 사업자에게는 두 대역을 나란히 붙여 받아야만 비로소 쓸모가 있고, 하나만 받으면 값어치가 크게 떨어진다. 이렇게 함께 가질 때 값어치가 커지는 물건들을 보완재라 한다.`,
`대역을 하나씩 차례로 파는 순차 경매는 이 상황에서 곤란을 ⓐ겪는다. 앞의 대역에 얼마를 써야 할지는 뒤의 대역을 얼마에 받을 수 있느냐에 달려 있는데, 뒤의 경매는 아직 열리지 않았으니 알 수가 없다. 더 심각한 것은 앞의 대역을 비싸게 사고도 뒤의 대역을 놓치는 경우이다. 둘을 함께 가져야 쓸모가 있는 사업자가 하나만 손에 쥔 채 값만 치르는 일이 벌어진다. 이러한 위험을 노출 문제라 하며, 이를 두려워한 사업자는 애초에 소극적으로 응찰하게 되어 경매의 값이 낮아진다.`,
`이를 덜기 위해 고안된 것이 ㉠동시 다중 라운드 경매이다. 모든 대역을 한꺼번에 열어 두고, 여러 차례의 라운드를 되풀이한다. 각 라운드가 끝날 때마다 대역별로 현재 가장 높은 값과 그 값을 써낸 이가 공개되고, 다음 라운드에서 사업자들은 그 정보를 보고 다시 응찰한다. 값은 라운드를 거듭할수록 정해진 폭 이상으로만 올라갈 수 있으며, 아무도 새로 응찰하지 않으면 경매가 끝난다. 사업자는 매 라운드마다 다른 이들이 어느 대역을 얼마에 노리는지를 보면서 자신의 조합을 바꾸어 갈 수 있다. 순차 경매가 주지 못하던 정보가 경매 진행 중에 ⓑ드러나는 것이다.`,
`그러나 이 방식에는 새로운 허점이 생긴다. 사업자가 끝까지 손을 놓고 기다리다가 마지막 순간에만 뛰어들어 값을 올릴 수 있다면, 앞선 라운드에서 성실히 값을 올린 이들만 손해를 본다. 게다가 아무도 응찰하지 않으면 경매가 끝나 버리므로, 모두가 눈치만 보면 값이 오르지 않은 채 경매가 ⓒ닫힌다. 이를 막는 장치가 활동 규칙이다. 사업자마다 자신이 노리는 대역의 크기를 합한 값에 따라 활동량이 정해지고, 각 라운드에서 그 활동량 가운데 정해진 비율 이상을 실제 응찰에 쓰지 않으면 다음 라운드에 참여할 수 있는 활동량 자체가 줄어든다. 요구되는 비율은 경매가 진행될수록 높아진다. 초반에는 여유를 두어 조합을 바꿀 여지를 주고, 후반으로 갈수록 물러설 길을 좁히는 것이다.`,
`활동 규칙이 있어도 노출 문제가 온전히 사라지지는 않는다. 사업자는 여전히 대역을 하나씩 따로 낙찰받으므로, 두 대역을 노리다 하나만 얻는 일은 일어날 수 있다. 이를 정면으로 다루려면 사업자가 원하는 조합 자체를 하나의 묶음으로 써내고 그 묶음 단위로 낙찰이 이루어지게 해야 한다. 이러한 방식에서는 묶음이 통째로 되거나 통째로 안 되므로 하나만 얻는 일이 없다. 다만 사업자마다 써낼 수 있는 묶음의 가짓수가 급격히 늘어 승자를 가려내는 계산이 무거워지고, 값이 어떻게 정해졌는지를 사업자에게 납득시키기도 어려워진다.`,
`또 하나의 근심은 사업자들끼리 눈짓을 주고받는 일이다. 라운드마다 값이 공개되므로, 응찰 금액의 끝자리에 특정한 숫자를 넣어 어느 대역을 양보하겠다는 뜻을 서로 ⓓ내비칠 수 있다. 이를 막기 위해 응찰 금액의 단위를 굵게 정해 끝자리를 쓸 수 없게 하거나, 각 라운드에서 누가 얼마를 썼는지를 감추고 최고가만 알리기도 한다. 정보를 많이 드러낼수록 값이 잘 발견되지만 눈짓을 주고받기도 쉬워지므로, 얼마만큼 드러낼 것인가를 두고 저울질이 ⓔ따른다.`
 ],
 points:[

  {type:'핵심 개념',stem:'㉠에 대한 이해로 가장 적절한 것은?',
   choices:[

   ],answer:1,
   why:'①은 순차 경매, ③은 묶음 입찰이며, ④는 아무도 응찰하지 않으면 끝난다는 서술과 어긋난다. ⑤는 노출 문제가 온전히 사라지지 않는다는 서술과 반대다.'},
  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`대역 X와 Y를 동시 다중 라운드 경매로 판다. 사업자 갑은 X와 Y를 나란히 붙여 써야만 쓸모가 있어 둘 다 필요하고, 을은 X만 있으면 되며, 병은 Y만 있으면 된다.
○ 상황 1: 갑은 X에 높은 값을 써서 여러 라운드 동안 최고가를 유지하였으나, Y에서는 병에게 밀렸다.
○ 상황 2: 정은 초반 여러 라운드 동안 어느 대역에도 응찰하지 않고 값의 흐름만 지켜보다가, 후반에 한꺼번에 뛰어들려 하였다.`,
   choices:[

    '상황 2에서 정이 초반에 응찰하지 않은 것은 활동 규칙이 요구하는 비율을 채운 것이므로 불이익이 없겠군.'
   ],answer:4,
   why:'활동 규칙은 각 라운드에서 활동량의 일정 비율 이상을 실제 응찰에 쓰지 않으면 다음 라운드의 활동량 자체를 줄인다. 초반에 응찰하지 않은 정은 오히려 불이익을 받는다.'},

 ]},

{id:'w6c',week:6,tag:'과학 · 물리',color:'#15803D',title:'초전도와 초유동 — 거시 세계의 양자 현상',
 passage:[
`어떤 금속을 아주 낮은 온도까지 식히면 전기 저항이 갑자기 사라진다. 이 온도를 임계 온도라 하고, 이 상태를 초전도라 한다. 그런데 저항이 0인 것이 초전도의 전부는 아니다. 저항이 없기만 한 물체를 완전 도체라 하는데, 초전도체는 완전 도체가 보이지 않는 성질을 하나 더 지닌다.`,
`자기장 속에 놓인 물체를 식혀 초전도 상태로 만들면, 물체 안에 있던 자기장이 밖으로 밀려난다. 이를 마이스너 효과라 한다. 완전 도체라면 사정이 다르다. 완전 도체는 안에 있는 자기장이 변하는 것에만 저항할 뿐, 이미 들어와 있는 자기장을 스스로 몰아내지는 못한다. 그러므로 자기장을 걸어 둔 채 식히면 자기장이 그대로 갇힌다. 초전도체는 어떤 순서로 식히고 걸든 자기장을 밀어내므로, 마이스너 효과는 초전도가 단순히 저항이 없는 상태와는 다른 별개의 상태임을 보여 준다. 다만 자기장이 너무 세지면 초전도는 무너지며, 이때 견딜 수 있는 자기장의 세기는 온도가 임계 온도에 가까워질수록 ⓐ작아진다.`,
`이 현상의 뿌리는 전자가 짝을 이루는 데 있다. 본래 전자들은 같은 상태에 둘 이상이 함께 있을 수 없다. 이러한 입자를 페르미온이라 한다. 그런데 낮은 온도에서는 전자 하나가 지나가며 주변의 양이온 격자를 살짝 끌어당기고, 그렇게 일그러진 자리로 다른 전자가 이끌린다. 격자의 떨림을 매개로 두 전자가 서로 밀어내는 힘을 이기고 약하게 묶이는 것이다. 이 짝을 쿠퍼쌍이라 한다. 짝을 이룬 둘은 더 이상 페르미온처럼 굴지 않고, 같은 상태에 얼마든지 함께 있을 수 있는 보손처럼 ⓑ행세한다.`,
`그리하여 무수히 많은 쿠퍼쌍이 하나의 동일한 상태로 내려앉는다. 이제 이들은 제각기 움직이는 개별 입자가 아니라 하나의 커다란 물결처럼 함께 움직인다. 전자 하나를 흩뜨리려면 짝 전체를 깨뜨려야 하고 그러려면 일정한 크기 이상의 에너지가 필요한데, 낮은 온도에서는 그만한 에너지가 좀처럼 ⓒ주어지지 않는다. 흩어질 수 없으니 저항도 없다. 저항이 사라진 까닭이 여기에 있다.`,
`같은 원리가 다른 얼굴로 나타난 것이 초유동이다. 헬륨의 흔한 동위 원소는 그 자체로 보손이어서 짝을 이룰 필요가 없다. 충분히 식히면 이들이 곧바로 하나의 상태로 내려앉아, 점성이 사라진 액체가 된다. 이 액체는 좁은 틈을 저항 없이 빠져나가고, 그릇의 벽을 얇은 막을 이루어 기어올라 밖으로 ⓓ흘러넘친다. 휘저어도 아무렇게나 소용돌이치지 않고, 소용돌이가 생기더라도 정해진 크기의 몫으로만 생긴다.`,
`반면 헬륨의 드문 동위 원소는 전자와 마찬가지로 페르미온이다. 그래서 이것만으로는 하나의 상태로 내려앉을 수 없다. 이 물질이 초유동을 보이려면 흔한 동위 원소보다 수천 배 더 낮은 온도까지 내려가야 하는데, 그제야 비로소 두 원자가 짝을 이루어 보손처럼 굴기 때문이다. 초전도체에서 전자가 겪은 일을 여기서는 원자가 겪는 셈이다. 서로 다른 두 현상이 하나의 원리로 ⓔ묶이는 지점이 여기이다. 수많은 입자가 하나의 양자 상태를 나누어 가질 때, 눈으로 볼 수 있는 크기의 세계에서 양자의 성질이 드러난다.`
 ],
 points:[
  '초전도 ≠ 저항 0만이 아님 — 마이스너 효과(순서와 무관하게 자기장을 밀어냄)가 완전 도체와 구별짓는 표지',
  '임계 자기장은 온도가 임계 온도에 가까워질수록 작아짐',
  '쿠퍼쌍: 격자 떨림을 매개로 두 전자가 약하게 묶임 → 페르미온이 보손처럼 행세 → 하나의 상태로 응축 → 흩어지지 않으니 저항 없음',
  '초유동: 헬륨의 흔한 동위 원소는 본래 보손 → 곧바로 응축 / 드문 동위 원소는 페르미온 → 수천 배 낮은 온도에서 원자끼리 짝을 이뤄야 함',
  '공통 원리: 수많은 입자가 하나의 양자 상태를 나누어 가질 때 거시 세계에서 양자 성질이 드러남'
 ],
 questions:[
  {type:'세부 정보',stem:'윗글에서 알 수 있는 내용으로 적절하지 않은 것은?',
   choices:[
    '초전도체는 완전 도체가 지니지 않는 성질을 하나 더 지닌다.',
    '완전 도체는 이미 들어와 있는 자기장을 스스로 몰아내지 못한다.',
    '초전도체가 견딜 수 있는 자기장의 세기는 온도가 임계 온도에 가까워질수록 커진다.',
    '쿠퍼쌍을 이룬 두 전자는 보손처럼 행세한다.',
    '헬륨의 드문 동위 원소는 그 자체로는 하나의 상태로 내려앉을 수 없다.'
   ],answer:2,
   why:'견딜 수 있는 자기장의 세기는 온도가 임계 온도에 가까워질수록 작아진다고 하였다.'},
  {type:'추론',stem:'마이스너 효과에 대한 이해로 가장 적절한 것은?',
   choices:[
    '자기장을 걸어 둔 채 식히면 초전도체 안에 자기장이 그대로 갇힌다.',
    '완전 도체도 초전도체와 마찬가지로 자기장을 스스로 밀어낸다.',
    '초전도체가 저항이 없다는 사실만으로 마이스너 효과를 설명할 수 있다.',
    '마이스너 효과는 초전도가 저항이 없는 상태와는 별개의 상태임을 보여 준다.',
    '마이스너 효과는 식히는 순서에 따라 나타나기도 하고 나타나지 않기도 한다.'
   ],answer:3,
   why:'초전도체는 어떤 순서로 식히고 걸든 자기장을 밀어내므로, 저항이 없다는 것만으로는 설명되지 않는 별개의 성질이다. ①②③⑤는 모두 지문과 어긋난다.'},
  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`헬륨의 두 동위 원소 P와 Q를 각각 식히며 관찰하였다. P는 그 자체로 보손이고, Q는 페르미온이다.
○ 결과 1: P는 비교적 높은 온도에서 점성이 사라졌고, 그릇의 벽을 타고 기어올라 밖으로 흘러넘쳤다.
○ 결과 2: Q는 P가 점성을 잃은 온도에서는 아무런 변화가 없었고, 그보다 수천 배 낮은 온도에 이르러서야 점성을 잃었다.`,
   choices:[
    'P가 비교적 높은 온도에서 점성을 잃은 것은 짝을 이룰 필요 없이 곧바로 하나의 상태로 내려앉기 때문이겠군.',
    'Q가 훨씬 낮은 온도를 필요로 한 것은 두 원자가 짝을 이루어야 비로소 보손처럼 굴 수 있기 때문이겠군.',
    'Q가 짝을 이루는 과정은 초전도체에서 전자가 쿠퍼쌍을 이루는 과정에 견줄 수 있겠군.',
    'P가 벽을 타고 기어오른 것은 점성이 사라져 저항 없이 움직일 수 있기 때문이겠군.',
    'Q는 페르미온이므로 아무리 온도를 낮추어도 하나의 상태로 내려앉을 수 없겠군.'
   ],answer:4,
   why:'Q도 충분히 낮은 온도에서는 두 원자가 짝을 이루어 보손처럼 굴게 되어 하나의 상태로 내려앉는다. ⑤는 결과 2와 정면으로 어긋난다.'},
  {type:'어휘',stem:'문맥상 ⓐ~ⓔ와 바꿔 쓰기에 적절하지 않은 것은?',
   choices:['ⓐ : 감소한다','ⓑ : 처신한다','ⓒ : 공급되지','ⓓ : 유출된다','ⓔ : 결부되는'],answer:1,
   why:'ⓑ행세하다는 어떤 성질을 지닌 것처럼 굴고 그렇게 작용한다는 뜻이므로 거동하다 정도가 알맞다. 처신하다는 사람이 몸가짐이나 태도를 취한다는 뜻이어서 입자에 쓰기에 어색하다.'}
 ]}
,

{id:'w7a',week:7,tag:'인문 · 언어철학',color:'#7C3AED',title:'동일성 명제 — 프레게와 러셀',
 passage:[
`샛별은 샛별이다라는 말과 샛별은 개밥바라기다라는 말을 견주어 보자. 둘은 모두 참이고, 두 이름이 가리키는 것도 같은 하나의 금성이다. 그런데 앞의 말은 아무것도 알려 주지 않는 반면, 뒤의 말은 하나의 발견이었다. 이름이 가리키는 대상만이 말의 뜻을 이룬다면 두 문장은 똑같아야 하는데 그렇지 않다. 이 어긋남을 어떻게 설명할 것인가가 동일성 명제의 문제이다.`,
`프레게는 이름에 두 층을 두어 답하였다. 이름이 가리키는 대상을 지시체라 하고, 그 대상이 어떤 방식으로 주어지는가를 뜻이라 한다. 샛별과 개밥바라기는 지시체가 같지만 뜻이 다르다. 하나는 새벽 동쪽에 뜨는 밝은 별로, 다른 하나는 저녁 서쪽에 뜨는 밝은 별로 같은 금성을 붙든다. 두 문장이 알려 주는 바가 다른 것은 뜻이 다르기 때문이다. 나아가 프레게는 지시체가 없어도 뜻은 있을 수 있다고 보았다. 가장 큰 수라는 표현에 대응하는 대상은 없지만 그 표현이 무엇을 말하려는지는 우리가 안다.`,
`러셀은 다른 길을 택하였다. 그가 보기에 이름처럼 보이는 표현들은 사실 이름이 아니라 감추어진 서술이다. 현재 프랑스의 왕은 대머리다라는 문장을 예로 들자. 프랑스에는 왕이 없으니 이 문장은 무엇에 대해 말하는 것인가. 프레게처럼 뜻과 지시체를 나누면, 이 문장은 뜻은 있으나 지시체가 없어 참도 거짓도 아니게 된다. 러셀은 이 결론을 받아들이지 않았다. 그는 이 문장이 실은 세 주장을 겹쳐 놓은 것이라고 ⓐ풀었다. 프랑스의 왕인 것이 적어도 하나 있고, 그런 것이 둘 이상은 없으며, 그것은 대머리이다. 이렇게 읽으면 첫 번째 주장이 거짓이므로 문장 전체가 거짓이 된다. 참도 거짓도 아닌 문장은 필요 없어진다.`,
`[A] 러셀의 이 처리는 동일성 문제도 함께 다룬다. 샛별과 개밥바라기가 각각 새벽에 가장 밝은 별과 저녁에 가장 밝은 별이라는 서술을 줄인 말이라면, 두 문장의 차이는 뜻이라는 새로운 층을 두지 않고도 설명된다. 앞의 문장은 같은 서술을 두 번 쓴 것이고 뒤의 문장은 서로 다른 두 서술을 겹쳐 놓은 것이니, 알려 주는 바가 다른 것은 당연하다. 러셀은 이로부터, 프레게가 도입한 뜻이라는 층은 없어도 되는 것이며 없는 편이 낫다고 보았다. 설명할 수 있는 것이 같다면 더 적은 것으로 설명하는 쪽을 택해야 한다는 것이다.`,
`이에 대해 프레게의 편에서는 다음과 같이 되물을 수 있다. 러셀의 길에서는 이름 하나하나가 어떤 서술의 줄임말인지가 사람마다 달라진다. 어떤 이에게 샛별은 새벽에 가장 밝은 별이지만 다른 이에게는 금성 탐사선이 처음 닿은 별일 수 있다. 그렇다면 같은 문장을 두고도 사람마다 다른 것을 말하는 셈이 되어, 우리가 같은 말을 주고받는다는 사실이 설명되지 않는다. 뜻은 개인이 머릿속에 ⓑ떠올리는 심상이 아니라 여럿이 함께 붙들 수 있는 공적인 것이라는 프레게의 주장은 바로 이 지점을 겨눈다.`

{id:'w7b',week:7,tag:'주제 통합 · 사회',color:'#B45309',title:'세계화를 보는 두 시선 — 부르디외와 기든스',
 passage:[
`(가) ㉮부르디외는 세계화를 자연스러운 흐름으로 여기는 시각 자체를 문제 삼는다. 그가 보기에 세계화란 국경을 넘어 저절로 번져 가는 물결이 아니라, 특정한 이익을 지닌 이들이 만들어 낸 정책의 결과이다. 그런데 이 정책은 정책으로서가 아니라 어쩔 수 없는 현실로 제시된다. 경쟁력을 갖추지 않으면 도태된다는 말이 되풀이될수록, 사람들은 다른 길을 상상하는 힘을 ⓐ잃는다. 그는 이처럼 특정한 질서를 유일한 현실인 양 받아들이게 만드는 힘에 주목하였다.`,
`이 힘은 노골적인 강압으로 작동하지 않는다. 그것은 학교와 언론과 전문가의 말을 거쳐 사람들의 몸에 배어든다. 무엇이 합리적이고 무엇이 시대에 뒤진 것인지에 대한 감각이 만들어지고, 사람들은 그 감각에 따라 스스로 판단한다고 여기며 실제로는 주어진 틀 안에서 판단한다. 부르디외는 국가가 지녔던 사회적 보호의 기능이 이 과정에서 낡은 것으로 몰리는 데 주목하였다. 그리하여 그는 세계화를 사회적 성취를 무너뜨리는 기획으로 규정하고, 이에 맞서 국경을 넘는 연대를 만들어 내야 한다고 ⓑ외쳤다.`,
`(나) ㉯기든스는 세계화를 되돌릴 수 없는 조건으로 본다. 다만 그가 말하는 세계화는 경제에 한정되지 않는다. 통신이 시간과 공간의 거리를 무너뜨리면서, 먼 곳의 사건이 이곳의 삶을 곧바로 흔드는 일이 일상이 되었다. 이 변화는 위에서 강요된 것이라기보다 여러 힘이 얽혀 빚어진 것이며, 국가와 시장 어느 한쪽이 조종할 수 있는 것이 아니다.`,
`기든스는 이 조건 아래에서 전통이 지녔던 권위가 흔들린다는 점을 강조한다. 예전에는 어떻게 살 것인지가 태어난 자리에 따라 대체로 정해져 있었으나, 이제는 각자가 스스로 선택하고 그 선택을 끊임없이 고쳐 가야 한다. 이는 자유의 확대이면서 동시에 부담의 확대이다. 선택에는 위험이 따르고, 그 위험은 개인이 감당해야 할 몫으로 ⓒ돌아온다. 그러므로 국가의 할 일은 사라지는 것이 아니라 달라진다. 실패한 뒤에 메워 주는 방식만으로는 부족하며, 사람들이 변화하는 조건 속에서 스스로 설 수 있도록 교육과 훈련을 통해 능력을 갖추게 해야 한다. 그는 이를 낡은 좌파와 우파 어느 쪽도 아닌 제3의 길이라 불렀다.`,
`두 사람의 갈림은 세계화가 무엇인가에 대한 규정에서 이미 시작된다. 부르디외에게 세계화는 뒤집어야 할 기획이고, 기든스에게는 그 안에서 살아갈 방법을 찾아야 할 조건이다. 기든스의 처방에 대해 부르디외의 입장에서는, 조건이라 부르는 순간 이미 그 질서를 받아들인 것이며 국가의 역할을 개인의 능력을 길러 주는 데로 좁히는 것은 사회적 보호를 걷어 내는 일을 다른 말로 ⓓ바꾼 것에 지나지 않는다는 비판이 제기될 수 있다. 반대로 기든스의 입장에서는, 세계화를 누군가의 기획으로만 보는 것은 시간과 공간이 실제로 압축되고 있다는 사실을 놓치는 일이며 되돌릴 수 없는 것을 되돌리자는 주장은 대안이 되지 못한다는 반론이 ⓔ가능하다.`
 ],

○ A안: 실직자에게 오랜 기간 생계비를 지급하고, 해당 산업을 보호하는 규제를 되살린다.
○ B안: 실직자에게 새로운 기술을 익힐 교육과 훈련을 제공하여 다른 일자리로 옮겨 갈 수 있게 한다.

    '(가)의 입장에서는 B안이 사회적 보호를 걷어 내는 일을 다른 말로 바꾼 것에 지나지 않는다고 볼 수 있겠군.',

   why:'ⓒ돌아오다는 위험의 몫이 결국 개인에게 지워진다는 뜻이므로 전가되다, 귀속되다가 알맞다. 귀결되다는 논의가 어떤 결론에 최종적으로 이른다는 뜻이어서 문맥에 맞지 않는다.'}

{id:'w7c',week:7,tag:'과학 · 생명',color:'#15803D',title:'후성 유전과 항암 치료',
 passage:[
`같은 유전자를 지닌 세포들이 어떻게 간세포가 되기도 하고 신경 세포가 되기도 하는가. 유전자의 염기 서열은 같은데 나타나는 모습이 다르다면, 서열 자체가 아니라 어떤 유전자를 켜고 끄는가가 갈랐다는 뜻이다. 염기 서열을 바꾸지 않으면서 유전자의 켜짐과 꺼짐을 조절하고 그 상태를 딸세포에까지 물려주는 방식을 후성 유전이라 한다.`,
`대표적인 방식이 둘이다. 하나는 유전자의 앞머리에 있는 특정 부위에 작은 화학 표지를 ⓐ붙이는 것이다. 이 표지가 촘촘히 붙으면 그 유전자를 읽어 내는 장치가 다가오지 못해 유전자는 꺼진다. 다른 하나는 실을 감아 둔 실패에 해당하는 단백질을 손보는 것이다. 유전 물질은 이 단백질에 감겨 있는데, 단백질의 꼬리에 어떤 표지가 붙느냐에 따라 감긴 정도가 달라진다. 느슨하게 풀리면 읽어 내는 장치가 들어갈 수 있어 유전자가 켜지고, 단단히 감기면 꺼진다.`,
`암세포에서는 이 조절이 어지럽혀져 있다. 세포의 증식을 막아 세우는 유전자, 이른바 제동 장치에 해당하는 유전자들의 앞머리에는 표지가 지나치게 촘촘히 붙어 있어 그 유전자들이 꺼져 있다. 제동이 풀린 세포는 멈추지 않고 불어난다. 여기서 중요한 점이 있다. 유전자 자체가 부서진 것이 아니라 덮여 있을 뿐이라는 것이다. 부서진 것은 되돌리기 어렵지만 덮인 것은 ⓑ걷어 낼 수 있다. 후성 유전이 치료의 표적이 될 수 있는 까닭이 여기에 있다.`,
`그리하여 표지를 붙이는 효소나 실패 단백질을 손보는 효소의 작용을 막는 약이 개발되었다. 표지를 붙이지 못하게 하면 이미 붙어 있던 표지도 세포가 분열할 때마다 옅어지고, 꺼져 있던 제동 장치 유전자가 다시 켜진다. 그러면 세포는 증식을 멈추거나 스스로 죽는 길로 들어선다.`,
`그러나 이 약들은 근본적인 어려움을 안고 있다. 약은 그 효소가 어느 유전자에 작용하는지를 가리지 못한다. 꺼져 있던 제동 장치가 켜지는 동시에, 꺼져 있어야 마땅한 다른 유전자들도 함께 켜질 수 있다. 정상 세포에서도 후성 유전은 쉬지 않고 일하고 있으므로, 약은 암세포만이 아니라 정상 세포의 조절까지 ⓒ흔든다. 표적을 정밀하게 겨누는 항암제와 달리, 이 약들은 세포 전체의 조절 판을 흔드는 셈이다.`,
`역설적이게도 바로 이 무차별성이 다른 쓸모를 ⓓ낳기도 한다. 어떤 암세포는 면역 세포에게 자신을 알리는 표지를 꺼 둔 채 숨어 있는데, 후성 유전 약이 그 표지를 다시 켜면 면역 세포가 암세포를 알아보게 된다. 그래서 이 약들은 홀로 쓰이기보다 면역 치료와 ⓔ짝지어 쓰이는 쪽으로 나아가고 있다. 암세포를 직접 죽이는 무기라기보다, 숨어 있던 암세포를 드러내어 다른 무기가 닿게 하는 역할인 셈이다.`
 ],
 points:[
  '후성 유전: 염기 서열을 바꾸지 않고 유전자의 켜짐·꺼짐을 조절하며 그 상태를 물려줌',
  '두 방식: ①앞머리에 화학 표지가 촘촘히 붙으면 꺼짐 ②실패 단백질의 꼬리 표지에 따라 감김이 느슨/단단 → 켜짐/꺼짐',
  '암세포: 제동 장치 유전자가 부서진 것이 아니라 덮여 꺼져 있음 → 되돌릴 수 있으므로 치료 표적이 됨',
  '한계: 약은 어느 유전자에 작용할지 가리지 못함 → 정상 세포의 조절까지 흔듦(무차별성)',
  '그 무차별성의 역설적 쓸모: 숨어 있던 암세포의 표지를 켜 면역 세포가 알아보게 함 → 면역 치료와 병용'
 ],
 questions:[
  {type:'세부 정보',stem:'윗글에서 알 수 있는 내용으로 적절하지 않은 것은?',
   choices:[
    '후성 유전은 염기 서열을 바꾸지 않고 유전자의 켜짐과 꺼짐을 조절한다.',
    '유전자 앞머리에 표지가 촘촘히 붙으면 그 유전자는 꺼진다.',
    '유전 물질이 단백질에 단단히 감기면 유전자는 켜진다.',
    '암세포에서는 제동 장치에 해당하는 유전자들이 꺼져 있다.',
    '후성 유전 약은 어느 유전자에 작용할지를 가리지 못한다.'
   ],answer:2,
   why:'단단히 감기면 읽어 내는 장치가 들어갈 수 없어 유전자는 꺼진다. ③은 이를 뒤집었다.'},
  {type:'추론',stem:'윗글을 바탕으로 추론한 내용으로 가장 적절한 것은?',
   choices:[
    '암세포의 제동 장치 유전자는 부서져 있으므로 되살릴 수 없다.',
    '표지를 붙이는 효소의 작용을 막으면 이미 붙은 표지도 분열을 거듭하며 옅어질 수 있다.',
    '후성 유전 약은 표적을 정밀하게 겨눈다는 점에서 표적 항암제와 같다.',
    '정상 세포에서는 후성 유전이 일어나지 않으므로 약의 영향을 받지 않는다.',
    '암세포가 면역 세포에게 자신을 알리는 표지를 꺼 두면 면역 세포가 더 쉽게 알아본다.'
   ],answer:1,
   why:'표지를 붙이지 못하게 하면 이미 붙어 있던 표지도 분열할 때마다 옅어진다고 하였다. ①③④⑤는 모두 지문과 어긋난다.'},
  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`어떤 암세포 집단 K를 대상으로 실험하였다.
○ 결과 1: K에서는 증식을 막는 유전자 G의 앞머리에 표지가 촘촘히 붙어 있었고, G는 꺼져 있었다. 다만 G의 염기 서열 자체는 온전하였다.
○ 결과 2: 표지를 붙이는 효소를 막는 약을 처리하자 G가 다시 켜졌고, K의 증식이 느려졌다.
○ 결과 3: 같은 약을 처리한 정상 세포에서도 꺼져 있던 여러 유전자가 함께 켜졌다.
○ 결과 4: 약을 처리한 K는 면역 세포에게 더 잘 인식되었다.`,
   choices:[
    '결과 1은 G가 부서진 것이 아니라 덮여 있을 뿐이어서 되돌릴 여지가 있음을 보여 주겠군.',
    '결과 2는 표지가 옅어지면서 꺼져 있던 제동 장치가 다시 켜진 것으로 볼 수 있겠군.',
    '결과 3은 약이 어느 유전자에 작용할지 가리지 못한다는 한계를 보여 주겠군.',
    '결과 4는 숨어 있던 표지가 다시 켜져 면역 세포가 K를 알아보게 된 것으로 볼 수 있겠군.',
    '결과 3은 약이 표적을 정밀하게 겨누어 정상 세포에는 영향을 주지 않음을 보여 주겠군.'
   ],answer:4,
   why:'결과 3은 정상 세포의 유전자까지 함께 켜졌음을 보여 주므로, 정밀하게 겨눈다는 진술과 정면으로 어긋난다.'},
  {type:'어휘',stem:'문맥상 ⓐ~ⓒ와 바꿔 쓰기에 적절하지 않은 것은?',
   choices:['ⓐ : 부착하는','ⓑ : 제거할','ⓒ : 동요한다','ⓓ : 초래하기도','ⓔ : 병용되어'],answer:2,
   why:'ⓒ흔들다는 약이 정상 세포의 조절을 어지럽힌다는 뜻의 타동사이므로 교란하다가 알맞다. 동요하다는 스스로 흔들린다는 자동사여서 목적어를 취하는 이 문맥에 맞지 않는다.'}
 ]},

{id:'w8a',week:8,tag:'주제 통합 · 인문',color:'#D10000',title:'상관주의와 사변적 실재론',
 passage:[
`(가) 근대 철학의 한 갈래는 다음과 같은 생각 위에 서 있다. 우리는 사물 자체를 알 수 없고, 오직 우리에게 나타난 사물만을 안다. 우리가 무엇을 안다고 할 때 그 앎에는 언제나 우리의 인식 틀이 ⓐ배어 있으며, 그 틀을 걷어 낸 사물이 어떠한지는 원리상 물을 수 없다는 것이다. 우리는 생각과 무관한 사물에 이를 수 없고, 사물과 무관한 생각에도 이를 수 없다. 접근할 수 있는 것은 언제나 둘 사이의 관계뿐이다. 오늘날 이러한 입장을 ㉠상관주의라 부른다.`,
`상관주의는 소박한 확신을 무너뜨린 대가로 강력한 방어막을 얻었다. 누군가 사물 자체가 이러이러하다고 주장하면, 상관주의자는 그 주장 역시 그가 지닌 인식 틀 안에서 이루어진 것이라고 ⓑ되받으면 그만이다. 사물 자체를 안다는 주장은 언제나 사물 자체를 알았다고 여기는 우리의 앎으로 되돌아온다. 이 되받음은 어떤 주장에 대해서도 쓸 수 있다.`,
`(나) ㉡사변적 실재론은 이 방어막의 한 지점을 겨눈다. 그것이 겨누는 것은 과학이 말하는 어떤 사건들이다. 지구가 생겨난 것은 사람이 나타나기 훨씬 이전이고, 별들이 빛을 낸 것도 그러하다. 과학은 이러한 사건이 언제 일어났는지를 상당한 정확도로 말한다. 그런데 상관주의에 따르면 모든 앎은 우리와의 관계 안에서만 뜻을 지닌다. 그렇다면 우리가 없던 시절에 일어난 사건에 대한 진술은 무엇을 말하는 것인가.`,
`상관주의자에게 남은 길은 그 진술을 우리에게 나타난 한에서의 과거로 읽는 것이다. 곧 우리가 지금 관측하는 자료로부터 그렇게 재구성되는 한에서 그러하다는 뜻으로 ⓒ새기는 것이다. 사변적 실재론은 이 읽기가 과학이 실제로 말하는 바를 배반한다고 본다. 과학자는 우리가 그렇게 재구성하는 한에서 지구가 그때 생겼다고 말하는 것이 아니라, 우리가 있든 없든 지구가 그때 생겼다고 말한다. 상관주의는 이 문장을 있는 그대로 받아들이지 못하고 반드시 단서를 달아야 하는데, 그 단서는 과학의 문장을 다른 문장으로 바꾸어 놓는다.`,
`나아가 사변적 실재론은 상관주의가 스스로를 지키는 방식에 대해서도 되묻는다. 상관주의는 사물 자체를 알 수 없다고 말한다. 그런데 알 수 없다는 이 주장 자체는 사물 자체에 관한 하나의 앎이 아닌가. 정말로 우리가 관계 바깥에 대해 아무것도 말할 수 없다면, 관계 바깥이 알 수 없는 것이라는 말조차 할 수 없어야 한다. 상관주의가 이 주장을 유지하려면 관계 바깥에 무엇인가가 있다는 것만은 인정해야 하며, 그 순간 그것은 이미 관계 바깥에 대한 진술이 된다. 사변적 실재론은 이 틈을 ⓓ파고들어, 생각과 무관하게 있는 것에 대해 말하는 길이 완전히 닫혀 있지는 않다고 주장한다.`,
`물론 이에 대해 상관주의의 편에서는, 과거에 관한 진술을 우리와의 관계 안에서 읽는 것은 과학을 배반하는 일이 아니라 그 진술이 어떻게 정당화되는지를 밝히는 일일 뿐이라고 ⓔ응수할 수 있다. 과학자가 무엇을 말한다고 여기는가와 그 말이 어떤 자격으로 참일 수 있는가는 다른 물음이라는 것이다.`
 ],

{id:'w8b',week:8,tag:'사회 · 정치',color:'#2563EB',title:'민주정과 공화정',
 passage:[
`민주정과 공화정은 흔히 같은 뜻으로 쓰이지만, 그 뿌리를 따라가면 서로 다른 물음에서 나왔다. 민주정이 답하려던 물음은 누가 다스리는가이다. 다스림의 권한이 소수가 아니라 인민 전체에 있을 때 그 정체는 민주적이다. 반면 공화정이 답하려던 물음은 어떻게 다스려야 자유가 지켜지는가이다. 여기서 자유는 남의 뜻에 매이지 않는 상태를 뜻하며, 공화정은 어느 누구도 남의 뜻에 매이지 않도록 권력을 ⓐ묶어 두는 방식에 관심을 둔다.`,
`이 차이는 자유를 어떻게 이해하는가에서 갈린다. 흔한 이해에 따르면 자유란 간섭받지 않는 상태이다. 아무도 나를 막지 않으면 나는 자유롭다. 그러나 공화정의 전통에서 자유는 간섭이 없는 상태가 아니라 자의적인 지배 아래 놓이지 않은 상태이다. 너그러운 주인 밑의 노예를 생각해 보자. 주인이 마음이 좋아 아무 간섭도 하지 않는다면 그는 간섭받지 않는다. 그러나 그는 자유롭지 않다. 주인이 마음을 바꾸면 언제든 간섭할 수 있고, 그 사실이 그의 삶을 ⓑ옭아매기 때문이다. 자유는 간섭이 실제로 없는가가 아니라 간섭할 수 있는 자의적 권력 아래 있는가로 판가름 난다.`,
`이 관점에서는 다수의 뜻이라 하여 안심할 수 없다. 다수가 원하는 대로 무엇이든 할 수 있다면 소수는 다수의 자의에 매인 처지가 된다. 다스리는 자가 인민 전체라 하더라도 그 다스림이 자의적일 수 있다는 것이다. 그리하여 공화정은 권력을 여럿으로 나누고, 서로가 서로를 막게 하며, 법이 통치자 자신도 ⓒ묶도록 한다. 권력을 누가 쥐는가보다 그 권력이 어떻게 제약되는가를 먼저 묻는 것이다.`,
`여기에서 견제와 균형이라는 장치가 나온다. 법을 만드는 권한과 집행하는 권한과 재판하는 권한을 갈라 서로 다른 손에 맡기면, 어느 한 손도 제 뜻대로 모든 것을 할 수 없다. 또 다수의 결정이라도 함부로 건드릴 수 없는 영역을 정해 두면, 소수는 다수의 뜻이 바뀌더라도 그 영역만큼은 매이지 않는다. 이러한 장치들은 다스림을 느리고 번거롭게 만들지만, 그 느림과 번거로움이야말로 자의적 지배를 막는 값이다.`,
`그렇다면 민주정과 공화정은 맞서는가. 반드시 그렇지는 않다. 공화정이 요구하는 것은 인민의 지배를 없애라는 것이 아니라 어떤 지배도 자의적이지 않게 하라는 것이다. 오히려 통치자가 인민의 뜻을 살피지 않아도 되는 체제야말로 인민을 자의적 권력 아래 두는 것이므로, 공화정의 요구는 인민이 통치자를 견제할 수 있어야 한다는 요구로 ⓓ이어진다. 다만 이때의 견제는 다수가 원하는 대로 무엇이든 관철하는 힘이 아니라, 통치자가 자의적으로 굴 수 없도록 붙드는 힘이다.`,
`오늘날의 헌법 체제는 이 두 물음에 함께 답하려는 시도로 읽을 수 있다. 선거를 통해 누가 다스릴지를 인민이 정한다는 점에서 민주적이고, 그렇게 정해진 권력이 헌법과 분립과 사법 심사에 의해 제약된다는 점에서 공화적이다. 이 둘이 겹칠 때 비로소 다수의 뜻이 실현되면서도 그 뜻이 소수를 자의적으로 ⓔ누르지 않게 된다.`
 ],
 points:[

  '자유의 두 이해: 간섭의 부재 vs 자의적 지배의 부재 — 너그러운 주인 밑의 노예는 간섭받지 않아도 자유롭지 않음',

{id:'w8c',week:8,tag:'기술',color:'#B45309',title:'GPU와 병렬 연산',
 passage:[
`오랫동안 컴퓨터의 성능은 중앙 처리 장치가 한 해 한 해 빨라지는 것으로 좋아졌다. 그러나 어느 시점부터 이 방식은 벽에 ⓐ부딪쳤다. 회로를 더 빠르게 돌리면 열이 감당할 수 없을 만큼 늘어나기 때문이다. 그래서 하나를 더 빠르게 만드는 대신 여러 개를 함께 쓰는 쪽으로 방향이 바뀌었다.`,
`중앙 처리 장치는 원래 한 줄로 늘어선 명령을 차례차례 처리하도록 만들어졌다. 앞의 결과가 나와야 뒤를 처리할 수 있는 일, 조건에 따라 길이 갈리는 일에 강하다. 이를 위해 그것은 다음에 올 길을 미리 짐작하고, 자주 쓰는 자료를 가까이 쟁여 두는 장치들을 잔뜩 ⓑ거느린다. 그 결과 하나하나의 처리 단위는 크고 정교하지만 그 수는 적다.`,
`㉠그래픽 처리 장치는 반대의 길을 걸었다. 화면의 수백만 개 점에 각각 색을 정하는 일은 서로를 기다릴 필요가 없다. 한 점의 색을 정하는 데 옆 점의 결과가 필요하지 않기 때문이다. 그렇다면 짐작하고 쟁여 두는 정교한 장치를 덜어 내고, 그 자리에 단순한 처리 단위를 최대한 많이 심는 편이 낫다. 그리하여 이 장치는 작고 단순한 연산기를 수천 개씩 늘어놓고, 같은 명령을 서로 다른 자료에 한꺼번에 적용한다.`,
`이 구조는 무엇을 잘하고 무엇을 못하는지가 뚜렷하다. 같은 계산을 방대한 자료에 되풀이하는 일이라면 압도적으로 빠르다. 그러나 앞의 결과를 기다려야 하는 일에서는 수천 개의 연산기가 대부분 놀게 된다. 더 곤란한 것은 갈림길이다. 같은 명령을 함께 수행하도록 묶인 연산기들 가운데 일부만 조건을 만족하면, 나머지는 그 갈래가 끝날 때까지 아무 일도 하지 않고 기다렸다가 다음 갈래를 함께 지나야 한다. 결국 두 갈래를 차례로 다 밟는 셈이어서, 갈림길이 많은 일일수록 이점이 ⓒ깎인다.`,
`또 하나의 병목은 자료를 나르는 길이다. 연산기가 아무리 많아도 계산할 자료가 제때 닿지 않으면 소용이 없다. 계산 한 번에 자료를 얼마나 많이 읽어야 하는가를 따져 보면, 자료를 조금 읽고 계산을 많이 하는 일에는 이 장치가 잘 맞고, 자료만 잔뜩 읽고 계산은 조금 하는 일에는 잘 맞지 않는다. 연산기의 개수를 늘리는 것보다 자료를 나르는 길을 넓히는 것이 성능을 더 끌어올리는 경우가 흔한 까닭이 여기에 있다.`,
`인공 신경망의 학습이 이 장치와 잘 맞았던 것은 우연이 아니다. 신경망의 계산은 대부분 커다란 수의 표를 서로 곱해 더하는 일로 ⓓ환원되는데, 이 일은 서로를 기다릴 필요가 없고 갈림길도 거의 없으며, 한 번 불러온 자료를 여러 번 되쓸 수 있다. 이 장치가 요구하는 조건을 모두 갖춘 셈이다. 그래픽을 그리려고 만든 장치가 학습을 떠맡게 된 것은, 두 일이 겉으로는 아무 상관이 없어 보이지만 계산의 결이 같았기 때문이다. 도구가 새로운 쓸모를 얻는 일은 이렇게 그 도구가 무엇을 잘하는지를 다시 ⓔ읽어 내는 데에서 시작된다.`
 ],
 points:[

  'GPU: 정교한 장치를 덜어 내고 단순한 연산기를 수천 개 — 같은 명령을 서로 다른 자료에 한꺼번에',

  '병목은 연산기 수가 아니라 자료를 나르는 길 — 자료를 조금 읽고 계산을 많이 하는 일에 적합',
  '신경망 학습이 맞은 이유: 서로 기다릴 필요 없음 + 갈림길 거의 없음 + 자료 재사용'

 questions:[

  {type:'핵심 개념',stem:'㉠에 대한 이해로 가장 적절한 것은?',
   choices:[

  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`세 가지 작업을 그래픽 처리 장치로 실행하였다.
○ 작업 A: 백만 개의 수에 모두 같은 값을 곱한다.

   choices:[

{id:'w9a',week:9,tag:'주제 통합 · 인문',color:'#D10000',title:'정치란 무엇인가 — 바디우와 랑시에르',
 passage:[
`(가) 우리는 흔히 정치를 국가를 운영하고 이해를 조정하는 일로 여긴다. ㉮바디우는 이러한 일을 정치라 부르기를 거부한다. 그가 보기에 그것은 이미 주어진 질서를 유지하고 관리하는 활동일 뿐이다. 각 집단에게 자리를 나누어 주고, 그 자리에 걸맞은 몫을 셈하여 배분하는 이 활동은 질서를 흔들지 않는다. 오히려 흔들릴 만한 것을 미리 자리 안으로 ⓐ거두어들인다.`,
`바디우가 정치라 부르는 것은 이 셈에 들지 않던 것이 느닷없이 나타나는 순간에서 시작된다. 그는 이러한 나타남을 사건이라 한다. 사건은 기존의 질서 안에서는 있을 수 없다고 여겨지던 것이므로, 그것이 일어났다는 사실 자체를 기존의 셈법으로는 증명할 수 없다. 그러므로 사건에 대해서는 그것이 일어났다고 선언하고 그 선언에 스스로를 매어 두는 이들이 있어야 한다. 바디우는 이 ⓑ매어 둠을 충실성이라 부르고, 사건에 충실한 이들이 그 사건이 열어젖힌 진리를 세워 나가는 과정을 정치라 한다. 정치는 드물게 일어나며, 일어난 뒤에도 끝없는 노력을 통해서만 이어진다.`,
`(나) ㉯랑시에르 또한 자리와 몫을 나누는 활동과 정치를 갈라 놓는다. 그는 앞의 것을 치안이라 부른다. 치안은 경찰의 일만을 가리키지 않는다. 그것은 누가 말할 자격이 있고 누구의 소리는 그저 소음인지, 무엇이 보이고 무엇이 보이지 않는지를 미리 나누어 놓은 감각의 질서 전체이다. 어떤 이들의 말은 주장으로 들리고 어떤 이들의 말은 그저 시끄러운 소리로 들린다면, 그 나눔이 이미 치안이다.`,
`랑시에르에게 정치란 이 나눔에 셈해지지 않은 이들이 자신도 말할 자격이 있음을 스스로 ⓒ내세우는 일이다. 그들은 무엇을 달라고 요구하기에 앞서, 요구할 자격이 자신에게 있음을 보여 준다. 그리하여 정치는 어떤 이익을 다투는 일이 아니라 누가 말하는 자로 셈해지는가를 다투는 일이 된다. 이 다툼은 기존의 질서에 새 항목을 하나 보태는 것이 아니라, 셈하는 방식 자체를 어긋나게 만든다. 랑시에르는 이 어긋남을 불화라 하고, 불화가 일어나는 자리에서만 정치가 있다고 보았다.`,
`두 사람은 관리와 정치를 가른다는 점에서 나란히 서지만, 무엇이 정치를 여는가에서 갈린다. 바디우에게 그것은 질서 바깥에서 느닷없이 도래하는 사건이며, 그 사건에 충실한 소수의 주체가 진리를 세워 간다. 랑시에르에게 그것은 이미 그 질서 안에 있으면서도 셈해지지 않던 이들이 스스로를 셈에 ⓓ밀어 넣는 일이며, 그것은 늘 평등이라는 전제를 확인하는 형태를 띤다. 랑시에르의 입장에서는, 바디우가 말하는 사건이 언제 일어날지 알 수 없는 것이라면 정치는 기다림이 되어 버린다는 반론이 제기될 수 있다. 반대로 바디우의 입장에서는, 셈해지지 않은 이들의 등장 역시 무엇인가가 일어나야 가능한 것이므로 그 일어남을 설명하지 않고서는 불화도 설명되지 않는다는 반론이 ⓔ가능하다.`
 ],

{id:'w9b',week:9,tag:'사회 · 조세',color:'#B45309',title:'법인세와 이중 과세',
 passage:[
`회사가 이익을 내면 그 이익에 법인세가 매겨진다. 세금을 뺀 나머지 가운데 일부가 주주에게 배당으로 건네지면, 이번에는 그 배당에 소득세가 매겨진다. 같은 돈이 두 번 세금을 ⓐ치르는 셈이다. 이를 이중 과세라 한다.`,
`이것이 문제인지 아닌지는 회사를 무엇으로 보느냐에 달려 있다. 회사를 주주와 구별되는 별개의 인격으로 본다면, 회사가 번 돈에 회사가 세금을 내고 주주가 받은 돈에 주주가 세금을 내는 것은 서로 다른 두 사람이 각자 자기 몫에 세금을 내는 것일 뿐이다. 반면 회사를 주주들이 편의를 위해 세워 둔 껍데기로 본다면, 회사가 번 돈은 결국 주주의 돈이므로 같은 소득에 세금이 두 번 매겨진 것이 된다.`,
`이중 과세를 그대로 두면 두 가지 뒤틀림이 생긴다. 첫째, 사업을 회사 형태로 하는 것이 개인 사업으로 하는 것보다 불리해진다. 둘째, 회사가 이익을 배당하지 않고 안에 쌓아 두려는 유인이 생긴다. 배당하지 않으면 주주 단계의 세금이 미루어지기 때문이다. 그리하여 투자할 곳이 마땅치 않은 회사조차 돈을 ⓑ묶어 두게 된다.`,
`부담이 얼마나 되는지는 간단히 셈해 볼 수 있다. 회사가 100을 벌고 법인세율이 20%라면 회사에 남는 것은 80이다. 이를 모두 배당하고 배당에 대한 소득세율이 25%라면 주주의 손에는 60이 남는다. 결국 100 가운데 40이 세금이니 실질적인 부담률은 40%가 된다. 두 세율을 단순히 더한 45%가 아니라는 점에 유의해야 한다. 뒤의 세금은 앞의 세금을 뺀 나머지에만 매겨지기 때문이다. 그러므로 어느 한쪽 세율을 낮추면 전체 부담은 낮아지지만, 그 낮아지는 폭은 다른 쪽 세율이 높을수록 작아진다.`,
`이 뒤틀림을 덜기 위한 장치가 여럿 마련되어 있다. 하나는 배당을 받은 주주의 세금을 계산할 때, 그 배당에 이미 붙어 있던 법인세만큼을 미리 얹어 소득을 잡은 뒤 그 얹은 만큼을 세액에서 ⓒ빼 주는 방식이다. 이렇게 하면 주주는 마치 자신이 직접 100을 벌어 자신의 세율로 세금을 낸 것과 비슷한 처지가 된다. 다른 하나는 아예 회사 단계에서 세금을 매기지 않고 이익을 주주에게 그대로 흘려보내어 주주의 소득으로만 과세하는 방식이다. 이는 회사를 껍데기로 보는 관점을 끝까지 ⓓ밀고 나간 것이다.`,
`그러나 어느 방식도 온전하지는 않다. 배당을 하지 않고 쌓아 두면 첫째 장치는 작동하지 않는다. 주주에게 배당이 가야 비로소 얹고 빼는 계산이 이루어지기 때문이다. 또 주주 가운데 외국에 사는 이가 많거나 세금을 내지 않는 기관이 섞여 있으면, 그들에게는 법인세를 돌려줄 근거를 찾기 어렵다. 법인세가 주주를 통해 걷는 예납에 지나지 않는 것인지, 아니면 회사라는 존재 자체에 물리는 몫인지를 정하지 않고서는 어느 장치도 끝까지 ⓔ밀어붙일 수 없는 것이다.`
 ],

   why:'그 장치는 배당이 주주에게 가야 계산이 이루어진다. ①은 다른 쪽 세율이 높을수록 폭이 작아진다는 서술과 반대이고, ②는 1−0.9×0.9=19%이므로 틀리며, ④⑤도 각각 뒤집혔다.'},
  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`갑 회사는 한 해에 200을 벌었다. 법인세율은 30%, 배당에 대한 소득세율은 20%이다.
○ 상황 1: 갑이 법인세를 낸 뒤 남은 돈을 모두 배당하였다.
○ 상황 2: 갑이 법인세를 낸 뒤 한 푼도 배당하지 않고 회사 안에 쌓아 두었다.
○ 상황 3: 갑의 주주 가운데 상당수가 세금을 내지 않는 공익 기관이다.
(단, 다른 조건은 고려하지 않는다.)`,
   choices:[
    '상황 1에서 법인세를 낸 뒤 남는 돈은 140이겠군.',
    '상황 1에서 주주의 손에 남는 돈은 112이고, 실질 부담률은 44%이겠군.',
    '상황 1의 실질 부담률은 두 세율을 더한 50%보다 낮겠군.',
    '상황 2에서는 주주 단계의 세금이 미루어지므로 배당하지 않을 유인이 생기겠군.',
    '상황 3에서는 공익 기관 주주에게도 법인세만큼을 돌려주는 근거를 쉽게 찾을 수 있겠군.'
   ],answer:4,
   why:'세금을 내지 않는 기관 주주에게는 법인세를 돌려줄 근거를 찾기 어렵다고 하였다. ②의 셈도 200×0.7=140, 140×0.8=112, 부담 88/200=44%로 지문과 맞는다.'},
  {type:'어휘',stem:'문맥상 ⓐ~ⓔ와 바꿔 쓰기에 적절하지 않은 것은?',
   choices:['ⓐ : 부담하는','ⓑ : 유보하게','ⓒ : 공제해','ⓓ : 관철한','ⓔ : 봉착할'],answer:4,
   why:'ⓔ밀어붙이다는 어떤 방식을 끝까지 관철한다는 뜻이므로 관철하다가 알맞다. 봉착하다는 어려움에 부딪친다는 뜻이어서 문맥에 맞지 않는다.'}
 ]},

{id:'w9c',week:9,tag:'과학 · 지구',color:'#15803D',title:'지자기 역전의 발견',
 passage:[
`용암이 식어 굳을 때, 그 안의 자성을 띠는 알갱이들은 당시 지구 자기장의 방향을 향해 나란히 늘어선 채 그대로 ⓐ굳는다. 어떤 온도 아래로 내려가면 알갱이들은 더 이상 방향을 바꾸지 못하고 그 순간의 방향을 간직하게 된다. 그러므로 오래된 용암에 남은 자기 방향을 재면 그것이 굳던 시절의 자기장 방향을 알 수 있다.`,
`20세기 초, 여러 지역의 용암을 조사하던 이들은 뜻밖의 사실과 마주쳤다. 어떤 암석들은 오늘날과 정반대 방향의 자기를 지니고 있었다. 이를 두고 두 가지 설명이 맞섰다. 하나는 지구의 자기장이 실제로 방향을 뒤집은 적이 있다는 것이고, 다른 하나는 어떤 암석이 굳을 때 주변 자기장과 반대 방향으로 자화되는 성질을 지녔다는 것이다. 뒤의 설명은 실제로 그러한 성질을 지닌 광물이 발견되면서 힘을 얻었다.`,
`두 설명을 ⓑ가르는 관건은 무엇이었는가. 만약 암석 자체의 성질 때문이라면, 거꾸로 자화된 암석은 그런 성질을 지닌 광물을 품은 것들에 한정될 것이고 그것이 언제 굳었는지와는 상관이 없을 것이다. 반대로 자기장이 실제로 뒤집혔다면, 같은 시기에 굳은 암석은 그 종류나 놓인 곳과 무관하게 모두 같은 방향을 가리켜야 한다. 결국 물음은 방향이 광물의 종류를 따라가는가, 시대를 따라가는가로 좁혀졌다.`,
`세계 곳곳의 용암을 모아 그 나이를 재고 자기 방향을 함께 살핀 결과, 방향은 시대를 따라갔다. 대륙이 다르고 광물이 달라도 같은 시기에 굳은 것들은 같은 방향을 가리켰고, 방향이 바뀌는 시점도 서로 ⓒ들어맞았다. 지구의 자기장이 실제로 여러 차례 뒤집혔다는 결론이 이렇게 세워졌다.`,
`결정적인 뒷받침은 뜻밖의 곳에서 왔다. 바다 밑을 자력계로 훑던 이들은 해저에 자기의 세기가 강한 띠와 약한 띠가 번갈아 나타나는 줄무늬가 있음을 발견하였다. 더 놀라운 것은 그 줄무늬가 바다 한가운데 솟은 산맥을 사이에 두고 좌우로 거울처럼 대칭을 이룬다는 점이었다. 이는 하나의 그림으로 ⓓ풀렸다. 산맥에서 새 지각이 솟아올라 좌우로 밀려 나가는데, 갓 굳은 지각은 그때의 자기장 방향을 새긴다. 자기장이 뒤집히면 다음에 솟은 지각은 반대 방향을 새긴다. 이 일이 되풀이되면 산맥을 축으로 좌우 대칭인 줄무늬가 만들어진다.`,
`이 설명은 서로 다른 두 주장을 한꺼번에 떠받쳤다. 자기장이 실제로 뒤집힌다는 것과, 해저가 산맥에서 만들어져 양쪽으로 벌어진다는 것이다. 어느 한쪽만으로는 대칭 줄무늬를 설명할 수 없고, 둘이 함께여야 비로소 설명된다. 하나의 관찰이 두 가설을 동시에 ⓔ붙들어 준 셈이며, 이 일은 곧 대륙이 움직인다는 생각이 받아들여지는 결정적인 계기가 되었다.`
 ],
 points:[
  '용암이 식으며 자성 알갱이가 당시 자기장 방향을 기록 → 오래된 암석으로 과거 자기장을 읽음',
  '거꾸로 자화된 암석: 두 설명 경쟁 — ①자기장이 실제로 뒤집혔다 ②암석 자체가 반대로 자화되는 성질을 지닌다',
  '판별의 관건: 방향이 광물의 종류를 따라가는가(②) 시대를 따라가는가(①) → 관찰 결과 시대를 따라감',
  '해저 자기 줄무늬가 해령을 축으로 좌우 대칭 → 자기장 역전 + 해저 확장이 함께여야만 설명됨',
  '하나의 관찰이 두 가설을 동시에 떠받침 → 대륙 이동이 받아들여지는 계기'
 ],
 questions:[
  {type:'세부 정보',stem:'윗글에서 알 수 있는 내용으로 적절하지 않은 것은?',
   choices:[
    '용암이 식어 굳을 때 자성 알갱이는 당시 자기장의 방향을 간직한다.',
    '거꾸로 자화된 암석에 대해 두 가지 설명이 맞섰다.',
    '주변 자기장과 반대 방향으로 자화되는 성질을 지닌 광물이 실제로 발견되었다.',
    '조사 결과 암석의 자기 방향은 광물의 종류를 따라갔다.',
    '해저의 자기 줄무늬는 바다 한가운데의 산맥을 사이에 두고 대칭을 이룬다.'
   ],answer:3,
   why:'방향은 광물의 종류가 아니라 시대를 따라갔다. 이것이 자기장이 실제로 뒤집혔다는 결론의 근거였다.'},
  {type:'논증 구조',stem:'윗글에 나타난, 두 설명을 판별한 방식에 대한 이해로 가장 적절한 것은?',
   choices:[
    '두 설명 가운데 어느 하나가 더 간단하다는 이유로 그것을 택하였다.',
    '두 설명이 서로 다른 예측을 내놓는 지점을 찾아 관찰로 확인하였다.',
    '거꾸로 자화되는 광물이 발견되었으므로 자기장 역전설을 폐기하였다.',
    '두 설명이 같은 예측을 내놓았으므로 둘을 모두 받아들였다.',
    '해저 줄무늬가 발견되기 전까지는 두 설명을 구별할 방법이 전혀 없었다.'
   ],answer:1,
   why:'암석의 성질 때문이라면 방향이 광물의 종류를 따라가야 하고, 자기장 역전 때문이라면 시대를 따라가야 한다. 서로 어긋나는 예측을 찾아 관찰로 판별한 것이다.'},
  {type:'구체적 상황 적용',stem:'윗글을 바탕으로 〈보기〉를 탐구한 내용으로 적절하지 않은 것은? [3점]',
   box:`세 지역의 용암을 조사하였다. 세 지역의 광물 조성은 서로 다르다.
○ 관찰 1: 300만 년 전에 굳은 용암은 세 지역 모두 오늘날과 반대 방향의 자기를 지녔다.
○ 관찰 2: 100만 년 전에 굳은 용암은 세 지역 모두 오늘날과 같은 방향의 자기를 지녔다.
○ 관찰 3: 어느 해저 산맥의 좌우에서, 산맥으로부터의 거리가 같은 두 지점의 자기 방향은 서로 같았다.`,
   choices:[
    '관찰 1과 2는 자기 방향이 광물의 종류가 아니라 시대를 따라감을 보여 주겠군.',
    '관찰 1과 2는 지구의 자기장이 실제로 뒤집힌 적이 있다는 설명을 뒷받침하겠군.',
    '만약 암석 자체의 성질 때문이었다면, 광물 조성이 다른 세 지역이 같은 시기에 같은 방향을 보일 까닭은 없겠군.',
    '관찰 3은 산맥에서 솟은 지각이 좌우로 같은 속도로 밀려 나갔다면 나타날 결과이겠군.',
    '관찰 3은 자기장 역전 없이 해저 확장만으로도 온전히 설명되겠군.'
   ],answer:4,
   why:'좌우 대칭의 줄무늬는 자기장이 뒤집힌다는 것과 해저가 벌어진다는 것이 함께여야 설명된다. 어느 한쪽만으로는 설명되지 않는다.'},
  {type:'어휘',stem:'문맥상 ⓐ~ⓔ와 바꿔 쓰기에 적절하지 않은 것은?',
   choices:['ⓐ : 고착된다','ⓑ : 판별하는','ⓒ : 일치하였다','ⓓ : 규명되었다','ⓔ : 결부해'],answer:4,
   why:'ⓔ붙들어 주다는 두 가설을 함께 뒷받침해 준다는 뜻이므로 지지하다가 알맞다. 결부하다는 서로 관련지어 묶는다는 뜻이어서, 관찰이 가설을 떠받친다는 문맥과 다르다.'}
 ]},

{id:'w10a',week:10,tag:'인문 · 인식론',color:'#7C3AED',title:'기적에 관한 흄의 논증',
 passage:[
`우리는 직접 보지 못한 일의 대부분을 남의 말을 통해 안다. 그렇다면 남의 말을 얼마나 믿어야 하는가. 흄은 증언을 믿는 근거가 증언 그 자체에 있지 않다고 보았다. 우리가 증언을 믿는 것은 사람들의 말이 사실과 들어맞는 일을 그동안 거듭 겪어 왔기 때문이다. 곧 증언의 신빙성은 경험이 쌓여 만들어진 것이지 미리 주어진 것이 아니다.`,
`그런데 우리는 또 다른 경험도 쌓아 왔다. 죽은 이가 되살아나지 않는다는 것, 물 위를 걸을 수 없다는 것 같은 자연의 한결같음이 그것이다. 흄은 자연법칙에 대한 우리의 믿음이야말로 가장 두텁고 예외 없는 경험 위에 서 있다고 보았다. 기적이란 바로 이 자연법칙을 어기는 사건이다. 그러므로 기적을 증언하는 말을 마주할 때, 우리는 서로 맞서는 두 경험을 저울에 ⓐ올려놓게 된다. 한쪽에는 그 증언이 참일 가능성을 떠받치는 경험이 있고, 다른 쪽에는 자연법칙이 예외 없이 지켜져 왔다는 경험이 있다.`,
`[A] 흄의 판정 기준은 여기서 나온다. 증언이 거짓이라는 것이 그 증언이 전하는 기적이 실제로 일어났다는 것보다 더 놀라운 일일 때에만, 우리는 그 증언을 믿어야 한다. 그런데 기적은 정의상 가장 예외 없는 경험을 어기는 사건이다. 반면 사람이 속거나 속이는 일은 흔하다. 그러므로 어느 증언에 대해서든, 그 증언이 거짓일 가능성은 기적이 실제로 일어났을 가능성보다 크지 않기가 어렵다. 흄이 이끌어 낸 결론은 기적이 일어나지 않는다는 것이 아니다. 어떤 증언도 기적을 믿게 할 만큼의 무게를 지니기 어렵다는 것이다. 이는 사실에 관한 주장이 아니라 우리가 무엇을 믿을 자격이 있는가에 관한 주장이다.`,
`이 논증에 대해서는 여러 반론이 제기되었다. 하나는 흄이 자연법칙에 대한 경험을 지나치게 무겁게 ⓑ매겼다는 것이다. 자연법칙 역시 경험의 일반화일 뿐인데, 어긋나는 사례가 보고될 때마다 그것을 거짓 증언으로 돌린다면 법칙은 결코 수정될 수 없다. 그렇다면 흄의 기준은 새로운 발견을 가로막는 셈이 된다.`,
`다른 하나는 증언들이 서로를 떠받칠 수 있다는 점을 흄이 셈에 넣지 않았다는 것이다. 서로 짜지 않은 여러 사람이 독립적으로 같은 일을 증언한다면, 그들이 모두 속거나 모두 속일 가능성은 급격히 작아진다. 이러한 증언이 충분히 ⓒ쌓이면 저울의 한쪽이 무거워질 수 있다는 것이다. 이에 대해 흄의 편에서는, 기적을 증언하는 이들은 대개 그 기적을 믿고자 하는 동일한 열망을 나누어 가진 이들이므로 그들의 증언이 참으로 독립적이라 보기 어렵다고 응수할 수 있다. 독립성이라는 조건 자체가 좀처럼 ⓓ채워지지 않는다는 것이다.`,
`흄의 논증이 오늘날에도 되풀이해 읽히는 까닭은, 그것이 특정한 종교적 주장을 겨눈 데 있지 않다. 그것은 놀라운 주장을 마주했을 때 우리가 무엇을 견주어 판단해야 하는가를 하나의 저울로 ⓔ세워 놓았다는 데 있다. 그 저울의 눈금을 어디에 둘 것인가를 두고 다툼은 이어지고 있다.`
 ],
 points:[
  '증언의 신빙성은 미리 주어진 것이 아니라 경험이 쌓여 만들어진 것',
  '기적 = 가장 예외 없는 경험(자연법칙)을 어기는 사건 → 두 경험이 저울 위에서 맞섬',

{id:'w10b',week:10,tag:'기술',color:'#2563EB',title:'임베딩과 유사도',

`컴퓨터는 낱말을 그 자체로 다루지 못한다. 낱말을 숫자로 바꾸어야 계산할 수 있다. 가장 단순한 방법은 낱말마다 번호를 매겨 그 자리에만 1을 두고 나머지는 0으로 채운 긴 줄을 만드는 것이다. 그러나 이 방식에서는 어떤 두 낱말을 견주어도 겹치는 곳이 없다. 사과와 배가 서로 얼마나 가까운지, 사과와 자동차가 얼마나 먼지를 이 줄만으로는 ⓐ말할 수 없다. 낱말들 사이의 거리가 표현되지 않는 것이다.`,
`임베딩은 낱말을 훨씬 짧은 실수의 줄로 옮긴다. 이 줄은 여러 방향을 가진 하나의 화살표로 볼 수 있다. 핵심은 이 화살표를 어떻게 정하느냐이다. 그 실마리는 낱말의 쓰임에 있다. 비슷한 뜻을 지닌 낱말은 비슷한 자리에 나타난다. 사과와 배는 모두 먹다, 달다, 껍질 같은 낱말 곁에 자주 놓인다. 그러므로 함께 놓이는 낱말들이 비슷할수록 화살표의 방향이 비슷해지도록 값을 조금씩 고쳐 나가면, 뜻이 가까운 낱말들은 저절로 비슷한 방향을 ⓑ갖게 된다.`,
`두 화살표가 얼마나 비슷한지를 재는 데에는 방향만을 보는 것이 알맞다. 두 화살표를 맞물려 곱해 더한 값을 내적이라 하는데, 이 값은 두 화살표의 길이와 그 사이 각도에 함께 달려 있다. 그러므로 내적만으로는 방향이 비슷해서 값이 큰 것인지, 그저 화살표가 길어서 값이 큰 것인지 알 수 없다. 그래서 내적을 두 화살표의 길이로 나누어 길이의 몫을 ⓒ덜어 낸다. 남는 것은 두 화살표 사이 각도만을 반영한 값이며, 이를 코사인 유사도라 한다. 두 방향이 같으면 1, 아무 상관이 없으면 0, 정반대이면 −1이 된다.`,
`길이를 덜어 내는 일이 왜 필요한지는 낱말의 빈도를 생각하면 드러난다. 학습 과정에서 자주 나타난 낱말일수록 그 화살표는 길어지기 쉽다. 길이를 덜어 내지 않으면, 그저 흔하다는 이유만으로 어떤 낱말이 모든 낱말과 비슷해 보이는 일이 벌어진다. 방향만을 보는 순간 이 왜곡은 ⓓ가신다.`,
`화살표의 방향이 뜻을 담게 되면 뜻들 사이의 관계도 방향으로 나타난다. 왕에서 남자를 빼고 여자를 더한 화살표가 여왕에 가깝게 놓이는 일이 관찰되는데, 이는 성별이라는 관계가 하나의 방향으로 새겨졌음을 뜻한다. 다만 이러한 성질은 관계가 자료 안에 고르게 나타날 때에만 잘 드러나며, 자료가 치우쳐 있으면 그 치우침 또한 방향으로 새겨진다. 특정 직업이 특정 성별 쪽으로 기울어 나타나는 일이 그러하다. 임베딩은 자료에 담긴 쓰임을 배우는 것이지 옳고 그름을 배우는 것이 아니므로, 자료의 편향은 걸러지지 않은 채 그대로 ⓔ옮아온다.`
 ],

{id:'w10c',week:10,tag:'과학 · 생명',color:'#D10000',title:'역노화 — 후성 유전 시계를 되감다',
 passage:[

`놀랍게도 이 배치는 나이에 따라 상당히 일정한 방식으로 달라진다. 그래서 유전자 앞머리에 붙은 표지의 양상을 재면 그 사람의 나이를 꽤 정확히 알아맞힐 수 있다. 이를 후성 유전 시계라 한다. 이 시계가 가리키는 나이가 실제 나이보다 앞서 있는 사람은 여러 질병에 더 잘 걸리는 것으로 나타났다. 여기서 하나의 물음이 생긴다. 시계가 앞서 가는 것이 늙음의 결과일 뿐인가, 아니면 늙음 그 자체인가.`,

const DAY_START_HOUR=5; // 하루가 바뀌는 시각 (새벽 5시)
function rTd(){
  const d=new Date();
  d.setHours(d.getHours()-DAY_START_HOUR);   // 05:00 이전이면 전날로 셈
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}

function isoAdd(ds,n){const base=String(ds).slice(0,10);const d=new Date(base+'T00:00:00');if(isNaN(d.getTime())){const p=base.split('-');d.setTime(new Date(+p[0],+p[1]-1,+p[2]).getTime());}d.setDate(d.getDate()+n);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function dUntil(ds,from){const a=new Date(String(ds).slice(0,10)+'T00:00:00'),b=new Date(String(from||rTd()).slice(0,10)+'T00:00:00');return Math.round((a-b)/864e5);}
function fmtD(ds){const d=new Date(ds+'T00:00:00');const n=['일','월','화','수','목','금','토'];return (d.getMonth()+1)+'/'+d.getDate()+'('+n[d.getDay()]+')';}

function setSolve(date,sid,field,val){
  val=Math.max(0,Math.round(val||0));
  if(!S.solves[date])S.solves[date]=[];
  let r=S.solves[date].find(x=>x.subjectId===sid);
  if(!r){r={subjectId:sid,solved:0,wrong:0};S.solves[date].push(r);}
  r[field]=val;

  if(r.wrong>r.solved&&field==='wrong')r.wrong=r.solved;
  // 빈 행 정리
  S.solves[date]=S.solves[date].filter(x=>x.solved||x.wrong);

}
