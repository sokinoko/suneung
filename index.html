  '오늘 몫 다 했다. 자랑스러워해도 돼.',
  '네가 오늘 해낸 거, 나만 알기 아까워서 알려주는 거야.',
  '오늘 하루 몫 완료. 남는 시간은 온전히 네 거야.'
];
function notifyPick(pool,vars){
  const recent=S.cfg.lastNotifyTexts||[];
  let tries=0, raw;
  do{ raw=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  while(pool.length>recent.length && recent.includes(raw) && tries<6);
  recent.push(raw); if(recent.length>4)recent.shift(); S.cfg.lastNotifyTexts=recent;
  return raw.replace(/\{s\}/g,vars.s).replace(/\{g\}/g,vars.g).replace(/\{r\}/g,vars.r);
}
function notifyContent(){
  const d=rTd(), solved=daySolved(d), goal=S.cfg.dailyGoal||40;
  const vars={s:solved,g:goal,r:Math.max(0,goal-solved)};
  if(solved<=0) return {title:'수능 섬 · 아직 시작 전', body:notifyPick(NOTI_NONE,vars)};
  if(solved<goal) return {title:'수능 섬 · '+solved+'/'+goal, body:notifyPick(NOTI_UNDER,vars)};
  return {title:'수능 섬 · 목표 달성 🎉', body:notifyPick(NOTI_DONE,vars)};
}
async function fireNotification(){
  if(typeof Notification==='undefined' || Notification.permission!=='granted')return;
  const c=notifyContent();
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      const reg=await navigator.serviceWorker.ready;
      reg.showNotification(c.title,{body:c.body,icon:'icon-192.png',badge:'icon-192.png',tag:'suneung-reminder',renotify:true,vibrate:[80,40,80]});
    }else{
      new Notification(c.title,{body:c.body,icon:'icon-192.png'});
    }
  }catch(e){ try{ new Notification(c.title,{body:c.body}); }catch(e2){} }
  S.cfg.lastNotifyAt=new Date().toISOString(); save();
}
function notifyTick(){
  if(!S.cfg.notifyOn)return;
  const last=S.cfg.lastNotifyAt?new Date(S.cfg.lastNotifyAt).getTime():0;
  if(Date.now()-last>=NOTIFY_INTERVAL_MS) fireNotification();
}
function startNotifyLoop(){
  if(notifyTimer)clearInterval(notifyTimer);
  if(!S.cfg.notifyOn)return;
  if(!S.cfg.lastNotifyAt)S.cfg.lastNotifyAt=new Date().toISOString(); // 처음 켤 땐 바로 안 울리고 50분 뒤부터
  notifyTimer=setInterval(notifyTick,60*1000);
}
async function requestNotifyPermission(){
  if(typeof Notification==='undefined'){toast('이 브라우저는 알림을 지원하지 않아요');return false;}
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied'){toast('알림이 차단돼 있어요. 브라우저 설정에서 허용해 주세요');return false;}
  const r=await Notification.requestPermission();
  return r==='granted';
}
async function toggleNotify(){
  if(!S.cfg.notifyOn){
    const ok=await requestNotifyPermission();
    if(!ok){toast('알림 권한이 필요해요');return;}
    S.cfg.notifyOn=true; S.cfg.lastNotifyAt=new Date().toISOString();
    save(); startNotifyLoop(); RA();
    toast('50분마다 알림을 보낼게요');
  }else{
    S.cfg.notifyOn=false; save(); startNotifyLoop(); RA();
    toast('알림을 껐어요');
  }
}
function sendTestNotify(){
  if(typeof Notification==='undefined'){toast('이 브라우저는 알림을 지원하지 않아요');return;}
  if(Notification.permission!=='granted'){toast('먼저 알림을 켜서 권한을 허용해 주세요');return;}
  fireNotification(); toast('테스트 알림을 보냈어요');
}


/* ===== 플래너 ===== */
let planEdit=null; // {kind, refId}
const PKIND={
  solve:{name:'문제 풀이',unit:'문제',icon:'edit'},
  lec  :{name:'인강',      unit:'강',   icon:'play'},
  warm :{name:'예열지문',  unit:'편',   icon:'chart'},
  free :{name:'직접 입력', unit:'개',   icon:'flag'}
};
const PSTEP={solve:5,lec:1,warm:1,free:1};
// 계획 카드에서 진도를 조절하면 원본 기록(풀이·인강·예열)에도 그대로 반영
function planAdjust(id,delta){
  const date=rTd(), it=planList(date).find(x=>x.id===id);
  if(!it)return;
  if(it.kind==='solve'){
    const r=solveRow(date,it.refId)||{solved:0};
    setSolve(date,it.refId,'solved',Math.max(0,(r.solved||0)+delta));
  }else if(it.kind==='lec'){
    const L=(S.lectures||[]).find(x=>x.id===it.refId);
    if(!L){toast('인강을 찾을 수 없어요');return;}
    const lo=it.base||0, hi=L.total||0;
    L.done=Math.max(lo,Math.min(hi,(L.done||0)+delta));
    save();
    if(L.total&&L.done>=L.total)toast('완강! 🎉');
  }else if(it.kind==='warm'){
    if(delta>0){
      const nx=(typeof WARMUP!=='undefined'?WARMUP:[]).find(x=>!(S.warmupRead||[]).includes(x.id));
      if(!nx){toast('예열지문을 다 풀었어요');return;}
      if(!Array.isArray(S.warmupRead))S.warmupRead=[];
      S.warmupRead.push(nx.id);save();
    }else{
      if((S.warmupRead||[]).length>(it.base||0)){S.warmupRead.pop();save();}
    }
  }else{
    it.manual=Math.max(0,Math.min(it.target,(it.manual||0)+delta));save();
  }
}
// 목표까지 한 번에 채우기
function planFill(id){
  const date=rTd(), it=planList(date).find(x=>x.id===id);
  if(!it)return;
  const need=(it.target||1)-planProg(it,date);
  if(need<=0)return;
  if(it.kind==='warm'){for(let i=0;i<need;i++)planAdjust(id,1);}
  else planAdjust(id,need);
}
function planList(date){return (S.plans&&S.plans[date])||[];}
// 계획 항목의 현재 진도 — 기존 기록에서 자동으로 읽어 옴
function planProg(it,date){
  if(!it)return 0;
  if(it.kind==='solve'){const r=solveRow(date,it.refId);return r?(r.solved||0):0;}
  if(it.kind==='lec'){const L=(S.lectures||[]).find(x=>x.id===it.refId);if(!L)return 0;return Math.max(0,(L.done||0)-(it.base||0));}
  if(it.kind==='warm'){return Math.max(0,(S.warmupRead||[]).length-(it.base||0));}
  return it.manual||0;
}
function planDone(it,date){return planProg(it,date)>=(it.target||1);}
function planStats(date){
  const L=planList(date);
  if(!L.length)return {n:0,done:0,pct:0};
  const done=L.filter(it=>planDone(it,date)).length;
  return {n:L.length,done,pct:Math.round(done/L.length*100)};
}
function planLabel(it){
  if(it.kind==='solve'){const sb=(S.subjects||[]).find(x=>x.id===it.refId);return sb?sb.name:'과목';}
  if(it.kind==='lec'){const L=(S.lectures||[]).find(x=>x.id===it.refId);return L?L.name:'인강';}
  if(it.kind==='warm')return '예열지문';
  return it.label||'할 일';
}
function planColor(it){
  if(it.kind==='solve'){const sb=(S.subjects||[]).find(x=>x.id===it.refId);return sb?sb.color:'var(--navy)';}
  if(it.kind==='lec'){const L=(S.lectures||[]).find(x=>x.id===it.refId);const sb=L&&(S.subjects||[]).find(x=>x.id===L.subjectId);return sb?sb.color:'var(--navy)';}
  if(it.kind==='warm')return '#D10000';
  return 'var(--navy)';
}
// 계획을 세우는 시점의 기준값을 찍어 둠 (그래야 오늘 한 만큼만 셈함)
function planBase(kind,refId){
  if(kind==='lec'){const L=(S.lectures||[]).find(x=>x.id===refId);return L?(L.done||0):0;}
  if(kind==='warm')return (S.warmupRead||[]).length;
  return 0;
}
function addPlanItem(kind,refId,target,label){
  const d=rTd();
  if(!S.plans[d])S.plans[d]=[];
  const tg=Math.max(1,target||1);
  // 같은 대상이 이미 계획에 있으면 새로 만들지 않고 목표만 고쳐 준다
  const dup=S.plans[d].find(x=>x.kind===kind&&(kind==='free'? (x.label||'')===(label||'') : x.refId===(refId||null)));
  if(dup){dup.target=tg;save();return 'updated';}
  S.plans[d].push({id:uid(),kind,refId:refId||null,target:tg,label:label||'',base:planBase(kind,refId),manual:0});
  save();return 'added';
}
/* ===== 3개년 기출 회독 ===== */
const GSUBJ=[{k:'kor',n:'국어',c:'#D10000'},{k:'eng',n:'영어',c:'#2563EB'},{k:'eth',n:'윤리와 사상',c:'#15803D'}];
const GYEAR=[2027,2026,2025,2024];
const GEXAM=[{k:'sn',n:'수능',mo:11,dy:14},{k:'m9',n:'9월',mo:9,dy:1},{k:'m6',n:'6월',mo:6,dy:1}];
// N학년도 시험은 (N-1)년에 치름 → 아직 치르지 않은 시험은 표에 넣지 않음
function gHeld(y,e){
  const ex=GEXAM.find(x=>x.k===(e&&e.k||e));if(!ex)return false;
  const when=new Date((y-1)+'-'+String(ex.mo).padStart(2,'0')+'-'+String(ex.dy).padStart(2,'0')+'T00:00:00');
  return new Date(rTd()+'T00:00:00')>=when;
}
function gExams(y){return GEXAM.filter(e=>gHeld(y,e));}
function gYears(){return GYEAR.filter(y=>gExams(y).length>0);}
const GROUNDS=3;
let gSubj='kor';
function gKey(y,e){return y+'-'+e;}
function gGet(sub,y,e){return ((S.gichul||{})[sub]||{})[gKey(y,e)]||0;}
function gSet(sub,y,e,v){
  if(!S.gichul[sub])S.gichul[sub]={};
  S.gichul[sub][gKey(y,e)]=Math.max(0,Math.min(GROUNDS,v));
  save();
}
function gSubjStat(sub){
  let done=0,cnt=0;
  gYears().forEach(y=>gExams(y).forEach(e=>{done+=gGet(sub,y,e.k);cnt++;}));
  const total=Math.max(1,cnt*GROUNDS);
  return {done,total,pct:Math.round(done/total*100)};
}
function gichulCard(){

/* ===== Charts (inline SVG) ===== */
// 라인 차트. series:[{name,color,points:[{x(label idx),y(value)}]}], opts:{labels,yMin,yMax,invert,yFmt}
function lineChart(series,opts){
  opts=opts||{};
  const labels=opts.labels||[];
  const W=520,H=190,pl=38,pr=14,pt=14,pb=30;
  const iw=W-pl-pr,ih=H-pt-pb;
  let yMin=opts.yMin,yMax=opts.yMax;
  if(yMin==null||yMax==null){
    let vals=[];series.forEach(s=>s.points.forEach(p=>{if(p.y!=null)vals.push(p.y);}));
    if(!vals.length)vals=[0,1];
    yMin=yMin==null?Math.min.apply(null,vals):yMin;
    yMax=yMax==null?Math.max.apply(null,vals):yMax;
    if(yMin===yMax){yMin-=1;yMax+=1;}
    const pad=(yMax-yMin)*0.12;yMin-=pad;yMax+=pad;
  }
  const n=labels.length||1;
  const xAt=i=>pl+(n<=1?iw/2:iw*i/(n-1));
  const yAt=v=>{let t=(v-yMin)/(yMax-yMin||1);if(opts.invert)t=1-t;return pt+ih-t*ih;};
  const yFmt=opts.yFmt||(v=>Math.round(v));
  let g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // gridlines (4)
  for(let k=0;k<=4;k++){
    const v=yMin+(yMax-yMin)*k/4;const yy=pt+ih-(ih*k/4);
    g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#E6E1D4" stroke-width="1.5"/>';
    const lv=opts.invert?yMin+(yMax-yMin)*(4-k)/4:v;
    g+='<text x="'+(pl-6)+'" y="'+(yy+4)+'" font-size="10" font-weight="800" fill="#8C8678" text-anchor="end">'+yFmt(lv)+'</text>';
  }
  // x axis labels
  labels.forEach((lb,i)=>{
    g+='<text x="'+xAt(i)+'" y="'+(H-9)+'" font-size="10" font-weight="800" fill="#8C8678" text-anchor="middle">'+esc(lb)+'</text>';
  });
  // axes
  g+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(pt+ih)+'" stroke="#1A1A2E" stroke-width="2"/>';
  g+='<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(W-pr)+'" y2="'+(pt+ih)+'" stroke="#1A1A2E" stroke-width="2"/>';
  // series
  series.forEach(s=>{
    const pts=s.points.filter(p=>p.y!=null);
    if(pts.length>1){
      let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+xAt(p.x)+' '+yAt(p.y)+' ';});
      g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    pts.forEach(p=>{g+='<circle cx="'+xAt(p.x)+'" cy="'+yAt(p.y)+'" r="4" fill="#fff" stroke="'+s.color+'" stroke-width="2.5"/>';});
  });
  g+='</svg>';
  return g;
}

function mockChart(metric,sorted){
  if(!sorted)sorted=S.mocks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const labels=sorted.map(m=>m.name.length>5?m.name.slice(0,5):m.name);
  let opts={labels};
  if(metric==='pct')opts.yMin=0,opts.yMax=100,opts.yFmt=v=>Math.round(v);
  else if(metric==='raw')opts.yMin=0,opts.yMax=100,opts.yFmt=v=>Math.round(v);
  else if(metric==='grade')opts.yMin=1,opts.yMax=9,opts.invert=true,opts.yFmt=v=>Math.round(v)+'등급';
  else opts.yFmt=v=>Math.round(v); // std: auto domain
  const series=S.subjects.map(sub=>({
    name:sub.name,color:sub.color,
    points:sorted.map((m,i)=>{
      const sc=(m.scores||[]).find(x=>x.subjectId===sub.id);
      const v=sc?sc[metric]:null;
      return {x:i,y:(v===''||v==null||isNaN(v))?null:+v};
    })
  })).filter(s=>s.points.some(p=>p.y!=null));
  if(!series.length)return '<div class="empty">이 지표로 입력된 점수가 없어요</div>';
  return lineChart(series,opts);
}

  const agg={};
  Object.keys(S.solves).forEach(d=>{(S.solves[d]||[]).forEach(r=>{
    const a=agg[r.subjectId]||(agg[r.subjectId]={s:0,w:0});a.s+=r.solved||0;a.w+=r.wrong||0;});});
  let worst=null;
  S.subjects.forEach(sub=>{const a=agg[sub.id];
    if(a&&a.s>=10){const rate=a.w/a.s;if(!worst||rate>worst.rate)worst={sub,rate};}});
  return worst;
}

/* ===== WARMUP (예열지문 · 주간 모의고사) ===== */
const NUMS=['①','②','③','④','⑤'];
function wuGet(pid){const o=(S.wuState||{})[pid];return (o&&o.a)||{};}
function wuPut(pid,qi,ci){if(!S.wuState[pid])S.wuState[pid]={a:{}};S.wuState[pid].a[qi]=ci;save();}
function wuClear(pid){if(S.wuState&&S.wuState[pid]){delete S.wuState[pid];save();}}
function weekList(){return WARMUP.filter(p=>p.week===wuWeek);}
function viewWarmup(){
  const list=weekList();
  if(!list.length)return '<div class="card"><div class="empty">지문이 없어요</div></div>';
  if(wuIdx<0)wuIdx=list.length-1;if(wuIdx>=list.length)wuIdx=0;
  const p=list[wuIdx];
  const weeks=[...new Set(WARMUP.map(x=>x.week))].sort((a,b)=>a-b);
  const readN=list.filter(x=>S.warmupRead.includes(x.id)).length;
  const isRead=S.warmupRead.includes(p.id);

  let h='<div class="card">';
  h+='<div class="sec">'+ic('chart')+'독서 예열지문 <span class="muted" style="margin-left:auto">'+wuWeek+'주차 '+readN+'/'+list.length+'</span></div>';
  h+='<div class="muted" style="margin-bottom:11px;line-height:1.6">평가원 독서 형식 그대로예요. 지문 1편 + 4문항, 실전처럼 <b>지문당 8~10분</b>을 재고 풀어 보세요.</div>';
  // 주차 선택
  h+='<div class="mtoggle">'+weeks.map(w=>{
    const ws=WARMUP.filter(x=>x.week===w);
    const done=ws.filter(x=>S.warmupRead.includes(x.id)).length;
    return '<div class="mt '+(wuWeek===w?'on':'')+'" data-wuweek="'+w+'">'+w+'주차 <span style="opacity:.7">'+done+'/'+ws.length+'</span></div>';
  }).join('')+'</div>';
  // 지문 네비
  h+='<div class="daybar"><div class="navb" data-warmprev="1">‹</div>'
    +'<div style="font-weight:900;font-size:12.5px;display:flex;align-items:center;gap:7px;flex:1;justify-content:center">'
    +'<span class="gchip" style="background:'+p.color+';color:#fff;border-color:'+p.color+';height:22px;font-size:10.5px;padding:0 8px">'+esc(p.tag)+'</span>'
    +'<span>'+(wuIdx+1)+' / '+list.length+'</span></div>'
    +'<div class="navb" data-warmnext="1">›</div></div>';
  // 지문
  h+='<div style="border:2px solid var(--ink);border-radius:14px;padding:16px;background:var(--paper)">';
  h+='<div style="font-weight:900;font-size:11px;color:var(--soft);letter-spacing:1px;margin-bottom:5px">[1~'+p.questions.length+'] 다음 글을 읽고 물음에 답하시오.</div>';
  h+='<div class="serif" style="font-weight:800;font-size:15.5px;margin-bottom:11px;text-align:center">'+esc(p.title)+(isRead?' <span style="color:var(--green);font-size:11px;font-family:sans-serif">✓</span>':'')+'</div>';
  p.passage.forEach((para,pi)=>{
    h+='<div class="serif" style="font-size:14.5px;line-height:1.95;text-align:justify;color:#25252F;margin-bottom:'+(pi<p.passage.length-1?'11px':'0')+'">'+esc(para)+'</div>';
  });
  h+='</div>';
  // 문항
  const nq=p.questions.length;
  wuAnswers=wuGet(p.id);
  const answered=p.questions.filter((q,qi)=>wuAnswers[qi]!==undefined).length;
  const correct=p.questions.filter((q,qi)=>wuAnswers[qi]===q.answer).length;
  p.questions.forEach((q,qi)=>{
    const sel=wuAnswers[qi];
    h+='<div style="margin-top:17px;border-top:2px dashed var(--line);padding-top:14px">';
    h+='<div style="display:flex;gap:7px;align-items:flex-start;margin-bottom:9px">'
      +'<span class="gchip" style="height:20px;font-size:10px;background:var(--navy);color:#fff;border-color:var(--navy);flex-shrink:0;margin-top:1px;padding:0 6px">'+esc(q.type)+'</span>'
      +'<span style="font-weight:800;font-size:14px;line-height:1.5">'+(qi+1)+'. '+esc(q.stem)+'</span></div>';
    if(q.box){
      h+='<div style="border:2px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:11px;background:var(--card2)">'
        +'<div style="font-weight:900;font-size:11px;margin-bottom:6px;color:var(--soft);letter-spacing:2px;text-align:center">〈보 기〉</div>'
        +'<div style="font-size:13px;line-height:1.75">'+q.box.split('\n').map(l=>esc(l)).join('<br>')+'</div></div>';
    }
    q.choices.forEach((c,ci)=>{
      let st='display:flex;gap:9px;padding:10px 12px;border:2px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:13.5px;font-weight:600;line-height:1.5;cursor:pointer;background:#fff';
      let mk='color:var(--ink)';
      if(sel!==undefined){
        if(ci===q.answer){st+=';border-color:var(--green);background:rgba(21,128,61,.08)';mk='color:var(--green);font-weight:900';}
        else if(ci===sel){st+=';border-color:var(--red);background:rgba(209,0,0,.06)';mk='color:var(--red);font-weight:900';}
      }
      h+='<div style="'+st+'" data-warmpick="'+qi+'|'+ci+'"><span style="font-weight:900;'+mk+'">'+NUMS[ci]+'</span><span>'+esc(c)+'</span></div>';
    });
    if(sel!==undefined){
      const ok=sel===q.answer;
      h+='<div style="border-left:4px solid '+(ok?'var(--green)':'var(--red)')+';padding:9px 12px;margin-top:3px;background:var(--card2);border-radius:0 10px 10px 0">'
        +'<div style="font-weight:900;font-size:12.5px;margin-bottom:4px;color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'정답':'오답')+' · 정답 '+NUMS[q.answer]+'</div>'
        +'<div class="muted" style="line-height:1.65">'+esc(q.why)+'</div></div>';
    }
    h+='</div>';
  });
  if(answered)h+='<div style="text-align:center;font-weight:900;font-size:14px;margin:16px 0 2px;color:'+(correct===nq?'var(--green)':'var(--navy)')+'">'+nq+'문항 중 '+correct+'문항 정답'+(correct===nq&&answered===nq?' 🎉':'')+'</div>';
  // 핵심 정리
  h+='<div class="spacer"></div><div class="btn ghost" data-warmreveal="1">'+ic(wuReveal?'x':'check')+(wuReveal?'지문 핵심 접기':'지문 핵심 정리 보기')+'</div>';
  if(wuReveal){
    h+='<div style="border:2px solid var(--navy);border-radius:14px;padding:14px;margin-top:11px;background:var(--card2)"><div style="font-weight:900;font-size:13px;margin-bottom:9px">지문 핵심 정리</div>';
    p.points.forEach(pt=>{h+='<div style="display:flex;gap:7px;margin-bottom:7px;font-size:13px;font-weight:600;line-height:1.55"><span style="color:var(--red);font-weight:900">▪</span><span>'+esc(pt)+'</span></div>';});
    h+='</div>';
  }
  if(answered)h+='<div class="spacer"></div><div class="btn ghost" data-warmreset="'+p.id+'">'+ic('x')+'답 지우고 다시 풀기</div>';
  h+='<div class="spacer"></div><div class="btn '+(isRead?'ghost':'navy')+'" data-warmread="'+p.id+'">'+ic('check',isRead?undefined:'#fff')+(isRead?'완료 취소':'풀이 완료 · 다음 지문')+'</div>';
  h+='</div>';
  return h;
}

function saveSched(id){
  const name=(document.getElementById('scName').value||'').trim();
  const date=document.getElementById('scDate').value;
  if(!name||!date){toast('이름과 날짜를 입력하세요');return;}
  const host=(document.getElementById('scHost').value||'').trim();
  if(!S.schedule)S.schedule=[];
  if(id){const e=S.schedule.find(x=>x.id===id);if(e){e.name=name;e.date=date;e.host=host;}}
  else S.schedule.push({id:uid(),name,date,host});
  save();closeSheet();RA();toast('저장됐어요');

/* ── 성장 단계 (수능까지 꾸준히 하면 최종 진화) ── */
const STAGES=[
  {min:0,   name:'알',     desc:'아직 잠들어 있어요'},
  {min:30,  name:'아기',   desc:'막 깨어났어요'},
  {min:100, name:'청소년', desc:'부쩍 자랐어요'},
  {min:250, name:'성체',   desc:'늠름해졌어요'},
  {min:500, name:'현자',   desc:'모든 걸 통달했어요'}
];
const FOOD_PER=10;      // 10문제 = 밥 1개
const FOOD_CAP=10;      // 하루 최대 10개
const HUNGER_MAX=100;

function petInit(){
  if(!S.pet||typeof S.pet!=='object')S.pet={};
  const p=S.pet;
  if(typeof p.xp!=='number')p.xp=0;
  if(typeof p.hunger!=='number')p.hunger=60;
  if(typeof p.fedTotal!=='number')p.fedTotal=0;
  if(!p.claimed||typeof p.claimed!=='object')p.claimed={};
  if(!p.name)p.name='아리';
  if(typeof p.shell!=='number')p.shell=0;
  if(!p.lastTick)p.lastTick=rTd();
  petTick();
}
/* 하루 지날 때마다 배고파짐 */
function petTick(){
  const p=S.pet,today=rTd();
  if(p.lastTick===today)return;
  let d=dUntil(today,p.lastTick); // 지난 일수
  if(d>0){p.hunger=Math.max(0,p.hunger-18*Math.min(d,7));}
  p.lastTick=today;save();
}
function petStage(){
  const xp=S.pet.xp||0;
  let idx=0;
  STAGES.forEach((s,i)=>{if(xp>=s.min)idx=i;});
  return idx;
}
function petNext(){
  const i=petStage();
  if(i>=STAGES.length-1)return null;
  const cur=STAGES[i].min,nxt=STAGES[i+1].min;
  const xp=S.pet.xp||0;
  return {name:STAGES[i+1].name,need:nxt-xp,pct:Math.round((xp-cur)/(nxt-cur)*100)};
}
/* 오늘 얻은 밥 / 남은 밥 */
function foodEarned(date){
  return Math.min(FOOD_CAP,Math.floor(daySolved(date)/FOOD_PER));
}
function foodLeft(){
  const t=rTd();
  return Math.max(0,foodEarned(t)-(S.pet.claimed[t]||0));
}
function petMood(){
  const h=S.pet.hunger;
  if(h>=75)return {face:'행복',emoji:'🌟',msg:'기분이 아주 좋아요'};
  if(h>=45)return {face:'보통',emoji:'🙂',msg:'평온해요'};
  if(h>=20)return {face:'배고픔',emoji:'😥',msg:'배가 고파요…'};
  return {face:'시무룩',emoji:'💧',msg:'많이 외로웠어요'};
}
function feedPet(n){
  const t=rTd();
  const avail=foodLeft();
  n=Math.min(n||1,avail);
  if(n<=0){toast('🍖 이 없어요 · 문제를 풀면 생겨요');return;}
  S.pet.claimed[t]=(S.pet.claimed[t]||0)+n;
  const before=petStage();
  S.pet.xp+=n;
  S.pet.fedTotal+=n;
  S.pet.hunger=Math.min(HUNGER_MAX,S.pet.hunger+12*n);
  save();
  const after=petStage();
  RA();
  if(after>before)setTimeout(()=>petEvolveSheet(after),260);
  else toast('냠냠! 🍖 ×'+n);
}
function petEvolveSheet(i){
  const st=STAGES[i];
  refreshSheet('<div class="grab"></div>'
    +'<div style="text-align:center;padding:6px 0 4px">'
    +'<div style="font-size:12px;font-weight:900;color:var(--red);letter-spacing:2px">EVOLVED</div>'
    +'<div style="margin:10px 0">'+petSVG(i,110)+'</div>'
    +'<div class="serif" style="font-size:22px;font-weight:800">'+esc(S.pet.name)+'이(가) <span style="color:var(--red)">'+esc(st.name)+'</span>(으)로!</div>'
    +'<div class="muted" style="margin-top:6px">'+esc(st.desc)+'</div></div>'
    +'<div class="spacer"></div><div class="btn navy" data-cancel="1">'+ic('check','#fff')+'좋아!</div>');
  document.getElementById('scrim').classList.add('open');
}

/* ── 애니메이션 헬퍼 ── */
function anim(el,cls,ms){
  if(!el)return;
  el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),ms||600);
}
function tamaPress(el,petCls){
  anim(el,'press',400);
  anim(document.querySelector('.tama-lcd'),'flash',240);
  if(petCls)anim(document.getElementById('lcdPet'),petCls,700);
}
function flyMeat(){
  const p=document.getElementById('lcdPet');if(!p)return;
  const m=document.createElement('div');
  m.className='fly-meat';m.textContent='🍖';
  p.appendChild(m);setTimeout(()=>m.remove(),650);
}
function flyHearts(n){
  const p=document.getElementById('lcdPet');if(!p)return;
  for(let i=0;i<(n||3);i++){
    const h=document.createElement('div');
    h.className='fly-heart';h.textContent=['💕','💖','✨'][i%3];
    h.style.left=(24+Math.random()*52)+'%';
    h.style.animationDelay=(i*0.13)+'s';
    p.appendChild(h);setTimeout(()=>h.remove(),1100+i*130);
  }
}

  h+='</div>';

  const MILE={100:'D-100. 이제부터가 진짜야. 오늘 쌓는 하루하루가 그날의 너를 만든다.',
              50:'D-50. 반이 지났어. 흔들려도 괜찮아, 방향만 잃지 마.',
              30:'D-30. 한 달 남았다. 새로운 걸 넓히기보다, 아는 걸 깊게.',
              14:'D-14. 2주. 이제 컨디션도 실력이야. 잠을 챙겨.',
              7 :'D-7. 일주일 남았어. 여기까지 온 것만으로 넌 이미 대단해.',
              3 :'D-3. 새 문제보다 익숙한 기출을. 낯선 건 오늘부터 만들지 마.',
              1 :'D-1. 내일이야. 오늘은 일찍 자는 게 가장 좋은 공부야.',
              0 :'오늘이다. 네가 준비한 걸 그대로 보여 주고 와. 나는 여기서 기다릴게.'};
  if(MILE[dd])return {tag:'D-'+dd,text:MILE[dd],src:null,special:true};
  // 연속 학습 분기점: 딱 그날에만 (매일 아님)
  const STREAK={7:'7일 연속. 습관이 잡히기 시작했어.',
                30:'30일 연속. 이건 재능이 아니라 네가 만든 거야.',
                50:'50일 연속. 나 솔직히 좀 감동했어.',
                100:'100일 연속. 말이 필요 없다.'};
  if(STREAK[streak])return {tag:streak+'일 연속',text:STREAK[streak],src:null,special:true};
  // 그 외 모든 날 → 매일 다른 명언
  const q=pickQuote();
  return {tag:'오늘의 한마디',text:q.text,src:q.src};
}
/* ===== 주간 통계 ===== */
function lastDays(n,end){
  const e=end||rTd(), out=[];
  for(let i=n-1;i>=0;i--){const d=isoAdd(e,-i);out.push({date:d,solved:daySolved(d),wrong:dayWrong(d)});}
  return out;
}
function weekSum(offset){ // offset 0=이번 7일, 1=그 이전 7일
  const end=isoAdd(rTd(),-(offset||0)*7);
  return lastDays(7,end).reduce((a,b)=>a+b.solved,0);
}
function studiedDays(n){return lastDays(n).filter(x=>x.solved>0).length;}

/* ===== 오늘 요약 스트립 ===== */
function summaryStrip(){
  const d=rTd(), solved=daySolved(d), goal=S.cfg.dailyGoal||40;
  const st=planStats(d), streak=streakDays();
  const cell=(big,label,color)=>'<div style="flex:1;text-align:center;padding:2px 0">'
    +'<div style="font-weight:900;font-size:17px;line-height:1.1;color:'+(color||'var(--ink)')+'">'+big+'</div>'
    +'<div class="muted" style="font-size:10.5px;margin-top:3px">'+label+'</div></div>';
  const sep='<div style="width:1.5px;background:var(--line);align-self:stretch;margin:2px 0"></div>';
  let h='<div style="display:flex;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:11px 6px;margin-bottom:13px;background:#fff">';
  h+=cell(streak+'<span style="font-size:11px">일</span>','연속 학습',streak>0?'var(--red)':'var(--soft)');
  h+=sep;
  h+=cell(solved+'<span style="font-size:11px">/'+goal+'</span>','오늘 문제',solved>=goal?'var(--green)':'var(--ink)');
  h+=sep;
  h+=cell(st.n?st.pct+'<span style="font-size:11px">%</span>':'<span style="font-size:13px;color:var(--soft)">–</span>','계획 달성',st.n&&st.pct===100?'var(--green)':'var(--ink)');
  h+=sep;
  h+=cell(weekSum(0),'최근 7일');
  h+='</div>';
  return h;
}

/* ===== 주간 리포트 ===== */
function weekCard(){
  const days=lastDays(7), cur=weekSum(0), prev=weekSum(1);
  const max=Math.max(1,...days.map(x=>x.solved));
  const diff=cur-prev;
  const dnames=['일','월','화','수','목','금','토'];
  let h='<div class="card"><div class="sec">'+ic('chart')+'최근 7일';
  h+='<span class="muted" style="margin-left:auto">'+studiedDays(7)+'일 공부</span></div>';
  // 막대
  h+='<div style="display:flex;align-items:flex-end;gap:5px;height:92px;margin-bottom:9px">';
  days.forEach((x,i)=>{
    const hp=Math.round(x.solved/max*72), isToday=i===days.length-1;
    const dt=new Date(x.date+'T00:00:00'), dn=dnames[dt.getDay()];
    h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">'
      +'<div style="font-size:9.5px;font-weight:800;margin-bottom:3px;color:'+(x.solved?'var(--ink)':'var(--soft)')+'">'+(x.solved||'')+'</div>'
      +'<div style="width:100%;height:'+Math.max(3,hp)+'px;border-radius:5px 5px 0 0;border:1.5px solid var(--ink);border-bottom:none;background:'+(x.solved? (isToday?'var(--red)':'var(--navy)') :'var(--line)')+'"></div>'
      +'<div class="muted" style="font-size:10px;margin-top:4px;font-weight:'+(isToday?'900':'600')+'">'+dn+'</div>'
      +'</div>';
  });
  h+='</div>';
  // 합계 & 증감
  h+='<div style="display:flex;align-items:center;gap:8px;border-top:2px dashed var(--line);padding-top:11px">'
    +'<span style="font-weight:800;font-size:12.5px">7일 합계</span>'
    +'<span style="font-weight:900;font-size:16px;margin-left:auto">'+cur+'<span class="muted" style="font-size:11px;font-weight:700">문제</span></span>';
  if(prev>0){
    const up=diff>=0;
    h+='<span class="gchip" style="height:22px;font-size:10.5px;padding:0 8px;background:'+(up?'var(--green)':'var(--red)')+';color:#fff;border-color:'+(up?'var(--green)':'var(--red)')+'">'
      +(up?'▲ +':'▼ ')+diff+'</span>';
  }
  h+='</div>';
  if(prev>0)h+='<div class="muted" style="margin-top:7px;line-height:1.55">그 전 7일은 '+prev+'문제였어요.</div>';
  return h+'</div>';
}

/* ===== 백업 / 복원 ===== */
function backupBlob(){
  const payload={app:'suneung-island',ver:1,savedAt:new Date().toISOString(),data:S};
  return JSON.stringify(payload);
}
function downloadBackup(){
  try{
    const name='수능섬_백업_'+rTd()+'.json';
    const blob=new Blob([backupBlob()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
    S.cfg.lastBackup=rTd();save();
    toast('백업 파일을 내려받았어요');
  }catch(e){toast('내려받기 실패 · 복사를 써 주세요');}
}

  let h='<div class="grab"></div><div class="mtitle">'+ic('gear')+'백업 복원</div>';
  h+='<div class="muted" style="line-height:1.65;margin-bottom:11px">백업 파일을 열어 안의 내용을 <b>전부 복사</b>해서 아래에 붙여넣어 주세요.<br><b style="color:var(--red)">지금 기록은 모두 덮어써져요.</b></div>';
  h+='<textarea id="restoreBox" rows="6" placeholder=\'{"app":"suneung-island", ...\' style="width:100%;font-size:12px"></textarea>';
  h+='<div class="spacer"></div><div class="btn navy" data-dorestore="1">'+ic('check','#fff')+'복원하기</div>';
  refreshSheet(h);document.getElementById('scrim').classList.add('open');

function doRestore(){
  const el=document.getElementById('restoreBox');
  const raw=((el&&el.value)||'').trim();
  if(!raw){toast('붙여넣은 내용이 없어요');return;}
  let obj;
  try{obj=JSON.parse(raw);}catch(e){toast('형식이 올바르지 않아요');return;}
  const data=(obj&&obj.app==='suneung-island'&&obj.data)?obj.data:obj;
  if(!data||typeof data!=='object'||(!data.subjects&&!data.solves)){toast('수능 섬 백업이 아니에요');return;}
  sheetConfirm('정말 복원할까요?','지금까지의 기록이 모두 사라지고 백업 시점으로 되돌아가요.',()=>{
    try{
      S=Object.assign({},S,data);
      normalize();save();
      closeSheet();RA();toast('복원했어요');
    }catch(e){toast('복원 실패');}
  });
}
function streakDays(){
  let n=0,d=rTd();
  if(!daySolved(d))d=isoAdd(d,-1); // 오늘 아직 안 했으면 어제부터
  while(daySolved(d)>0){n++;d=isoAdd(d,-1);if(n>400)break;}
  return n;
}

function memoReply(text){
  const raw=String(text||'');
  // 새벽 시간대(00:00~04:59)면 먼저 알아봐 줌
  if(isLateNight() && /졸리|피곤|잠|힘들|못하겠|졸려/.test(raw)){
    return '새벽이네요. 지금 푸는 건 ' + fmtD(rTd()) + ' 몫으로 쌓이니까 조급해하지 마요. 졸리면 자는 게 이득일 때도 있어요.';
  }

  const t=(text||'').toLowerCase();
  const P=S.pet.name;
  const dd=dUntil(S.suneungDate);
  const solved=daySolved(rTd());
  const streak=streakDays();
  const hunger=Math.round(S.pet.hunger);
  const has=(...ws)=>ws.some(w=>t.includes(w));

  // 최근 답변과 겹치지 않도록 몇 번 다시 뽑아봄
  if(!Array.isArray(S.pet.lastReplies))S.pet.lastReplies=[];
  const recent=S.pet.lastReplies;
  function pick(a){
    let v=a[Math.floor(Math.random()*a.length)];
    for(let i=0;i<4 && a.length>recent.length && recent.includes(v);i++) v=a[Math.floor(Math.random()*a.length)];
    recent.push(v); if(recent.length>4)recent.shift();
    return v;
  }
  // 배고픔 4단계: 굶주림 / 배고픔 / 보통 / 배부름
  const tier = hunger<15?'starve' : hunger<40?'hungry' : hunger<75?'ok' : 'full';
  // 다른 화제에 답할 때 덧붙이는 배고픔 후기 (항상은 아니고 절반 확률로만, 밥 얘기 자체일 땐 생략)
  const POSTSCRIPT={
    starve:['…근데 나 지금 진짜 배고파. 포만감 '+hunger+'%야.','아 배고파… 문제 좀 더 풀어주면 안 될까.','포만감 '+hunger+'%. 살짝 서러운 수치야.'],

  function withPostscript(line){
    if(Math.random()<0.45) return line+' '+pick(POSTSCRIPT[tier]);

      '힘든 걸 힘들다고 말할 수 있는 것도 용기야. 잘 버티고 있어, 진짜로.',
      '어깨 좀 펴자. 오늘 하루 못 해도 아무 일 안 일어나. 내가 보증할게.',
      '힘들면 잠깐 나 쓰다듬어. 그 정도는 도와줄 수 있어.',
      '괜찮아. 지금 힘든 건 네가 대충 하지 않고 있다는 뜻이니까.',

function addMemo(){
  const el=document.getElementById('memoInput');
  const v=(el.value||'').trim();
  if(!v){toast('내용을 입력하세요');return;}
  if(!Array.isArray(S.memos))S.memos=[];
  S.memos.unshift({id:uid(),date:rTd(),time:new Date().toTimeString().slice(0,5),text:v,reply:memoReply(v)});
  if(S.memos.length>200)S.memos.length=200;
  save();el.value='';RA();
  toast(S.pet.name+'이(가) 답장했어요');
}

function eveStats(){
  // 그동안 쌓인 것들을 전부 센다
  let days=0,solved=0,wrong=0;
  Object.keys(S.solves||{}).forEach(d=>{
    const s=daySolved(d);
    if(s>0){days++;solved+=s;wrong+=dayWrong(d);}
  });
  const lec=lecTotals();
  const memos=(S.memos||[]).length;
  const mocks=(S.mocks||[]).length;
  const warm=(S.warmupRead||[]).length;
  const fed=(S.pet&&S.pet.fedTotal)||0;
  const stage=STAGES[petStage()];
  // 가장 많이 푼 날
  let best={date:null,n:0};
  Object.keys(S.solves||{}).forEach(d=>{const n=daySolved(d);if(n>best.n)best={date:d,n};});
  // 가장 오래 이어간 연속일
  const dates=Object.keys(S.solves||{}).filter(d=>daySolved(d)>0).sort();
  let run=0,maxRun=0,prev=null;
  dates.forEach(d=>{
    if(prev&&isoAdd(prev,1)===d)run++;else run=1;
    if(run>maxRun)maxRun=run;prev=d;
  });
  // 힘들다고 적었던 날의 수 (버텨낸 날)
  const hard=(S.memos||[]).filter(m=>/힘들|지쳐|지친|포기|그만|못하겠|울|눈물|불안|걱정|무서|망했|최악/.test(m.text||'')).length;
  return {days,solved,wrong,lec,memos,mocks,warm,fed,stage,best,maxRun,hard};
}

  let h='<div class="grab"></div>';
  h+='<div style="text-align:center;padding:2px 2px 4px">';
  h+='<div style="display:inline-block;border:2.5px solid var(--red);color:var(--red);border-radius:8px;font-weight:900;font-size:11px;padding:3px 14px;letter-spacing:2px">D-1</div>';
  h+='<div style="margin:14px 0 4px">'+petSVG(petStage(),96)+'</div>';
  h+='<div class="serif" style="font-size:21px;font-weight:800;line-height:1.5;margin:10px 4px 14px">내일이야.<br>그동안 네가 한 걸 세어 봤어.</div>';
  h+='</div>';

  // 숫자들
  h+='<div style="border:2.5px solid var(--ink);border-radius:16px;padding:14px;background:var(--card2);margin-bottom:12px">';
  const row=(label,val)=>'<div style="display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1.5px dashed var(--line)"><span style="font-size:12.5px;font-weight:700;color:var(--soft)">'+label+'</span><span class="serif" style="font-size:16px;font-weight:800">'+val+'</span></div>';
  if(st.days)h+=row('책상에 앉은 날',st.days+'일');
  if(st.solved)h+=row('네가 푼 문제',st.solved.toLocaleString()+'문제');
  if(st.wrong)h+=row('틀리고 다시 본 문제',st.wrong.toLocaleString()+'문제');
  if(st.maxRun>1)h+=row('가장 오래 이어간 날',st.maxRun+'일 연속');
  if(st.best.n)h+=row('가장 많이 푼 하루',st.best.n+'문제');
  if(st.lec.done)h+=row('끝까지 들은 강의',st.lec.done+'강');
  if(st.mocks)h+=row('치러낸 모의고사',st.mocks+'회');
  if(st.warm)h+=row('읽어낸 지문',st.warm+'편');
  if(st.memos)h+=row('나에게 남긴 말',st.memos+'번');
  if(st.fed)h+=row(pet+'에게 준 밥',st.fed+'개');
  h+='</div>';

  // 편지
  h+='<div style="border-left:4px solid var(--red);padding:2px 0 2px 13px;margin:16px 2px">';
  h+='<div class="serif" style="font-size:14.5px;line-height:2;color:var(--ink)">';
  if(st.hard>0){
    h+='이 중에 '+st.hard+'번은, 힘들다고 적어 놓고도 한 날이야.<br>';
    h+='그날들이 제일 크다. 잘 되는 날에 하는 건 누구나 하니까.<br><br>';
  }
  if(first){
    h+='너는 '+first.slice(5).replace('-','월 ')+'일부터 이걸 적기 시작했어.<br>';
    h+='그때의 너는 오늘의 네가 어디까지 왔는지 몰랐을 거야.<br><br>';
  }
  h+='내일 시험장에서 새로운 실력이 나오진 않아.<br>';
  h+='그러니 아무것도 증명하지 않아도 돼.<br>';
  h+='<b>이미 다 해뒀거든. 위에 적힌 게 전부 증거야.</b><br><br>';
  h+='긴장되면 손을 한 번 봐. 저 문제들을 다 푼 손이야.<br>';
  h+='잘 자고, 아침 잘 먹고, 아는 것부터 차분히.<br><br>';
  h+='어떤 점수가 나와도 나는 여기 있을게.<br>';
  h+='<span style="color:var(--red);font-weight:800">잘 다녀와.</span>';
  h+='</div></div>';
  h+='<div class="serif" style="text-align:right;font-size:13px;font-weight:800;color:var(--soft);margin:0 4px 6px">— '+esc(pet)+', 그리고 지금까지의 너로부터</div>';

  h+='<div class="spacer"></div><div class="btn navy" data-motivclose="1">'+ic('check','#fff')+'응, 다녀올게</div>';
  refreshSheet(h);
  document.getElementById('scrim').classList.add('open');
}
/* 당일 아침 */
function ddaySheet(){
  refreshSheet('<div class="grab"></div>'
    +'<div style="text-align:center;padding:10px 4px 6px">'
    +'<div style="display:inline-block;background:var(--red);color:#fff;border:2.5px solid var(--red);border-radius:8px;font-weight:900;font-size:11px;padding:4px 16px;letter-spacing:3px">D-DAY</div>'
    +'<div style="margin:16px 0 6px">'+petSVG(petStage(),100)+'</div>'
    +'<div class="serif" style="font-size:24px;font-weight:800;line-height:1.5;margin:12px 6px 10px">다녀와.<br>여기서 기다릴게.</div>'
    +'<div class="muted" style="line-height:1.8;margin:0 6px">아는 것부터 차분히.<br>모르는 건 넘기고, 다시 돌아오면 돼.<br>너는 준비돼 있어.</div>'
    +'</div>'
    +'<div class="spacer"></div><div class="btn" data-motivclose="1">'+ic('flag','#fff')+'가자</div>');
  document.getElementById('scrim').classList.add('open');
}

/* ===== Sheet system ===== */
function refreshSheet(html){document.getElementById('sheet').innerHTML=html;}
function closeSheet(){document.getElementById('scrim').classList.remove('open');}
function sheetConfirm(title,desc,onYes){
  refreshSheet('<div class="grab"></div><div class="mtitle">'+title+'</div><div class="muted" style="margin-bottom:16px">'+desc+'</div>'
    +'<div class="rowf"><div class="btn ghost" data-cancel="1">취소</div><div class="btn" data-confirm="1">삭제</div></div>');
  document.getElementById('scrim').classList.add('open');
  sheetConfirm._cb=onYes;
}

/* ===== Events: click ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-day],[data-today],[data-solveadj],[data-lecadj],[data-lecadd],[data-lecmark],[data-leced],[data-dolecsave],[data-dellec],[data-metric],[data-mockadd],[data-mockopen],[data-domocksave],[data-delmock],[data-news],[data-edits],[data-dels],[data-sfc],[data-savesubj],[data-notifytoggle],[data-notifytest],[data-backupfile],[data-restore],[data-dorestore],[data-export],[data-reset],[data-cancel],[data-confirm],[data-warmprev],[data-warmnext],[data-wuweek],[data-warmreveal],[data-warmreset],[data-warmread],[data-warmpick],[data-univfav],[data-univmemo],[data-univmemosave],[data-feed],[data-shell],[data-fixpet],[data-tamastat],[data-petrename],[data-petpoke],[data-gsubj],[data-gtap],[data-planfill],[data-planadd],[data-plankind],[data-planref],[data-doplansave],[data-plancopy],[data-plandel],[data-planplus],[data-planminus],[data-memoadd],[data-memodel],[data-memoopen],[data-motivclose],[data-schedpast],[data-schedadd],[data-schededit],[data-doschedsave],[data-delsched],[data-mockfrom]');
  if(!t)return;const d=t.dataset;
  if(d.go!==undefined){tab=d.go;RA();}
  else if(d.day!==undefined){S.curDate=isoAdd(curD(),+d.day);if(S.curDate===rTd())S.curDate=null;save();RA();}
  else if(d.today!==undefined){S.curDate=null;save();RA();}
  else if(d.solveadj!==undefined){
    const[sid,field,delta]=d.solveadj.split('|');const r=solveRow(curD(),sid)||{solved:0,wrong:0};
    setSolve(curD(),sid,field,(r[field]||0)+ +delta);RA();
  }
  else if(d.lecadj!==undefined){
    const[lid,delta]=d.lecadj.split('|');const l=S.lectures.find(x=>x.id===lid);
    if(l){l.done=Math.max(0,Math.min((l.total||0),(l.done||0)+ +delta));save();RA();}
  }
  else if(d.lecadd!==undefined){openLecForm(null);}
  else if(d.lecmark!==undefined){
    const[lid,n]=d.lecmark.split('|');const l=S.lectures.find(x=>x.id===lid);
    if(l){const num=+n;l.done=(l.done===num)?num-1:num;l.done=Math.max(0,Math.min(l.total||0,l.done));save();RA();
      if(l.done>=(l.total||0)&&l.total)toast('완강! 🎉');}
  }
  else if(d.leced!==undefined){openLecForm(d.leced);}
  else if(d.dolecsave!==undefined){saveLec(d.dolecsave||null);}
  else if(d.dellec!==undefined){S.lectures=S.lectures.filter(x=>x.id!==d.dellec);save();closeSheet();RA();toast('삭제됐어요');}
  else if(d.metric!==undefined){mockMetric=d.metric;RA();}
  else if(d.mockadd!==undefined){openMockForm(null);}
  else if(d.mockopen!==undefined){openMockForm(d.mockopen);}
  else if(d.mockfrom!==undefined){const ev=(S.schedule||[]).find(x=>x.id===d.mockfrom);openMockForm(null,ev?{name:ev.name,date:ev.date}:null);}
  else if(d.warmprev!==undefined){const n=weekList().length;wuIdx=(wuIdx-1+n)%n;wuReveal=false;RA();}
  else if(d.warmnext!==undefined){const n=weekList().length;wuIdx=(wuIdx+1)%n;wuReveal=false;RA();}
  else if(d.wuweek!==undefined){wuWeek=+d.wuweek||1;wuIdx=0;wuReveal=false;RA();}
  else if(d.warmreveal!==undefined){wuReveal=!wuReveal;RA();}
  else if(d.warmpick!==undefined){const[qi,ci]=d.warmpick.split('|');const cp=weekList()[wuIdx];if(cp)wuPut(cp.id,+qi,+ci);RA();}
  else if(d.warmreset!==undefined){wuClear(d.warmreset);wuReveal=false;RA();toast('답을 지웠어요');}
  else if(d.warmread!==undefined){
    const idr=d.warmread,i=S.warmupRead.indexOf(idr);
    if(i>=0){S.warmupRead.splice(i,1);}
    else{
      S.warmupRead.push(idr);toast('예열 완료 🔥');
      const L=weekList();
      const nx=L.findIndex((x,k)=>k>wuIdx&&!S.warmupRead.includes(x.id));
      const any=L.findIndex(x=>!S.warmupRead.includes(x.id));
      wuIdx=nx>=0?nx:(any>=0?any:wuIdx);wuReveal=false;
    }
    save();RA();
  }
  else if(d.univfav!==undefined){
    const n=d.univfav,i=S.favUnivs.indexOf(n);
    if(i>=0)S.favUnivs.splice(i,1);else S.favUnivs.push(n);
    save();RA();
  }
  else if(d.univmemo!==undefined){openUnivMemo(d.univmemo);}
  else if(d.univmemosave!==undefined){saveUnivMemo(d.univmemosave);}
  else if(d.feed!==undefined){
    const _n=+d.feed||1;
    if(foodLeft()>0){
      tamaPress(t.closest('.tama-btn'),'eat');
      flyMeat();
      setTimeout(()=>{flyHearts(3);feedPet(_n);},430);
    } else {
      tamaPress(t.closest('.tama-btn'),'sad');
      feedPet(_n);
    }
  }
  else if(d.tamastat!==undefined){tamaPress(t.closest('.tama-btn'));setTimeout(tamaStatSheet,180);}
  else if(d.shell!==undefined){
    S.pet.shell=+d.shell||0;save();RA();
    setTimeout(()=>{anim(document.getElementById('lcdPet'),'happy',700);},40);
    toast(shellNow().name+' 색으로 바꿨어요');
  }
  else if(d.fixpet!==undefined){
    S.pet=null;petInit();
    if(!Array.isArray(S.memos))S.memos=[];
    S.memos=S.memos.filter(m=>m&&typeof m.text==='string');
    save();RA();toast('복구했어요');
  }
  else if(d.petrename!==undefined){
    const v=(document.getElementById('petName').value||'').trim();
    if(v){S.pet.name=v.slice(0,8);save();closeSheet();RA();toast('이름이 '+S.pet.name+'(으)로 바뀌었어요');}
    else toast('이름을 입력하세요');
  }
  else if(d.petpoke!==undefined){
    const btn=t.closest('.tama-btn');
    const sad=S.pet.hunger<25;
    if(btn)tamaPress(btn,sad?'sad':'wiggle');
    else anim(document.getElementById('lcdPet'),sad?'sad':'wiggle',700);
    if(!sad)flyHearts(2);
    const mo=petMood();toast(S.pet.name+': '+mo.msg+' '+mo.emoji);
  }
  else if(d.gsubj!==undefined){gSubj=d.gsubj;RA();}
  else if(d.gtap!==undefined){
    const[sub,y,e,i]=d.gtap.split('|');const cur=gGet(sub,+y,e);
    gSet(sub,+y,e,cur>=+i? +i-1 : +i);RA();
    if(gGet(sub,+y,e)>=GROUNDS)toast('3회독 완료 ✓');
  }
  else if(d.planadd!==undefined){planEdit=null;planSheet();}
  else if(d.plankind!==undefined){planEdit={kind:d.plankind,refId:null};planSheet();}
  else if(d.planref!==undefined){planEdit=planEdit||{kind:'solve'};planEdit.refId=d.planref;planSheet();}
  else if(d.doplansave!==undefined){savePlanItem(d.doplansave);}
  else if(d.plancopy!==undefined){copyYesterdayPlan();}
  else if(d.plandel!==undefined){const dt=rTd();S.plans[dt]=planList(dt).filter(x=>x.id!==d.plandel);save();RA();}
  else if(d.planplus!==undefined){const dt=rTd();const it=planList(dt).find(x=>x.id===d.planplus);if(it){const was=planProg(it,dt)>=it.target;planAdjust(d.planplus,PSTEP[it.kind]||1);RA();if(!was&&planProg(it,dt)>=it.target)toast('하나 해냈어요 ✓');}}
  else if(d.planminus!==undefined){const dt=rTd();const it=planList(dt).find(x=>x.id===d.planminus);if(it){planAdjust(d.planminus,-(PSTEP[it.kind]||1));RA();}}
  else if(d.planfill!==undefined){planFill(d.planfill);RA();toast('목표를 채웠어요 ✓');}
  else if(d.memoadd!==undefined){addMemo();}
  else if(d.memodel!==undefined){S.memos=(S.memos||[]).filter(x=>x.id!==d.memodel);save();RA();}
  else if(d.memoopen!==undefined){memoOpen=!memoOpen;RA();}
  else if(d.motivclose!==undefined){S.motivSeen=rTd();save();closeSheet();}
  else if(d.schedpast!==undefined){showPast=!showPast;RA();}
  else if(d.schedadd!==undefined){openSchedForm(null);}
  else if(d.schededit!==undefined){openSchedForm(d.schededit);}
  else if(d.doschedsave!==undefined){saveSched(d.doschedsave||null);}
  else if(d.delsched!==undefined){S.schedule=(S.schedule||[]).filter(x=>x.id!==d.delsched);save();closeSheet();RA();toast('삭제됐어요');}
  else if(d.domocksave!==undefined){saveMock(d.domocksave||null);}
  else if(d.delmock!==undefined){S.mocks=S.mocks.filter(x=>x.id!==d.delmock);save();closeSheet();RA();toast('삭제됐어요');}
  else if(d.news!==undefined){openSubjForm(null);}
  else if(d.edits!==undefined){openSubjForm(d.edits);}
  else if(d.dels!==undefined){delSubj(d.dels);}
  else if(d.sfc!==undefined){edit.color=d.sfc;refreshSheet(renderSubjForm());}
  else if(d.savesubj!==undefined){saveSubj();}
  else if(d.notifytoggle!==undefined){toggleNotify();}
  else if(d.notifytest!==undefined){sendTestNotify();}
  else if(d.backupfile!==undefined){downloadBackup();RA();}
  else if(d.restore!==undefined){restoreSheet();}
  else if(d.dorestore!==undefined){doRestore();}
  else if(d.export!==undefined){try{navigator.clipboard.writeText(JSON.stringify(S));toast('클립보드에 복사됨');}catch(err){toast('복사 실패');}}
  else if(d.reset!==undefined){sheetConfirm('전체 초기화할까요?','모든 데이터가 사라져요',()=>{try{localStorage.removeItem(KEY);}catch(err){}location.reload();});}
  else if(d.cancel!==undefined){closeSheet();}
  else if(d.confirm!==undefined){closeSheet();if(sheetConfirm._cb)sheetConfirm._cb();}
});

/* ===== Events: change (inputs) ===== */
document.addEventListener('change',e=>{
  const el=e.target,id=el.id||'';
  if(id==='datePick'){S.curDate=el.value||null;if(S.curDate===rTd())S.curDate=null;save();RA();return;}
  if(id==='suneungDate'){S.suneungDate=el.value||S.suneungDate;save();RA();toast('수능일 저장됨');return;}
  if(id==='goalInput'){S.cfg.dailyGoal=Math.max(1,parseInt(el.value)||40);save();RA();return;}
  const ds=el.dataset||{};
  if(ds.solveset!==undefined){
    const[sid,field]=ds.solveset.split('|');setSolve(curD(),sid,field,parseInt(el.value)||0);RA();return;
  }
  if(ds.lecset!==undefined){
    const l=S.lectures.find(x=>x.id===ds.lecset);
    if(l){l.done=Math.max(0,Math.min((l.total||0),parseInt(el.value)||0));save();RA();}
    return;
  }
});
document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet();});

/* ===== Boot ===== */
try{load();}catch(e){seed();}
try{
  RA();
  if(S.motivSeen!==rTd()){
    const _dd=dUntil(S.suneungDate);
    setTimeout(_dd===1?eveSheet:(_dd===0?ddaySheet:motivSheet),_dd<=1&&_dd>=0?700:420);
  }
}catch(e){document.getElementById('view').innerHTML='<div class="card"><div class="sec" style="color:var(--red)">오류가 났어요</div><div class="muted" style="line-height:1.6;word-break:break-all">'+String(e&&e.message||e)+'</div><div class="spacer"></div><div class="btn ghost" data-fixpet="1">데이터 복구 시도</div></div>';}

/* ===== PWA: 서비스 워커 등록 + 알림 루프 ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
try{ startNotifyLoop(); }catch(e){}
// 앱을 다시 열었을 때(백그라운드→포그라운드) 밀린 시간이 있으면 바로 한 번 확인
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    try{ notifyTick(); }catch(e){}
  }
});
</script>
